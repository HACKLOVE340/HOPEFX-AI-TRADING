services:
  backend:
    name: FastAPI Backend
    description: HOPEFX FastAPI backend on port 8000
    commands:
      start: |
        cd /workspaces/HOPEFX-AI-TRADING
        pip install -r requirements.txt -q 2>/dev/null || true
        APP_ENV=development FEATURE_WATCHLIST=true FEATURE_TRADE_JOURNAL=true FEATURE_BILLING_SUBSCRIPTION=true FEATURE_ADVANCED_TRADING=true FEATURE_PRICE_ALERTS=true FEATURE_RESEARCH=true FEATURE_TEAMS=true FEATURE_REPLAY=true FEATURE_NOCODE=true FEATURE_TRANSPARENCY=true FEATURE_PUSH_NOTIFICATIONS=true FEATURE_TWO_FACTOR_AUTH=true uvicorn app:app --host 0.0.0.0 --port 8000 --reload
      ready: curl -sf http://localhost:8000/health
    ports:
      - port: 8000
        onOpen: ignore

  frontend:
    name: Vite Frontend
    description: HOPEFX React/Vite frontend on port 5173
    commands:
      start: |
        cd /workspaces/HOPEFX-AI-TRADING/frontend
        npm install -q 2>/dev/null || true
        npm run dev
      ready: curl -sf http://localhost:5173
    ports:
      - port: 5173
        onOpen: open-preview

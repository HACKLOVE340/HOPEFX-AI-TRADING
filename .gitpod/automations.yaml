services:
  redis:
    name: "Redis"
    description: "Redis pub/sub and session cache"
    commands:
      start: redis-server --daemonize no --loglevel warning --bind 127.0.0.1
      ready: redis-cli ping

  clamav:
    name: "ClamAV Daemon"
    description: "ClamAV antivirus daemon for file scanning"
    commands:
      start: |
        # Ensure virus DB is present (freshclam on first run)
        if [ ! -f /var/lib/clamav/main.cvd ] && [ ! -f /var/lib/clamav/main.cld ]; then
          sudo freshclam --quiet || true
        fi
        sudo mkdir -p /var/run/clamav
        sudo chown clamav:clamav /var/run/clamav
        # Remove stale socket if present
        sudo rm -f /var/run/clamav/clamd.ctl
        sudo clamd --foreground=yes
      ready: clamdscan --ping 1 2>/dev/null && echo "OK" || test -S /var/run/clamav/clamd.ctl

  backend:
    name: "FastAPI Backend"
    description: "HOPEFX AI Trading API server (port 8000)"
    commands:
      start: |
        cd /workspaces/HOPEFX-AI-TRADING
        [ -f .env ] || python3 scripts/bootstrap_dev.py
        OTEL_ENABLED=false APP_ENV=development REDIS_URL=redis://127.0.0.1:6379/0 REDIS_FORCE_TLS=false REDIS_PASSWORD= python3 run.py --mode api
      ready: curl -sf http://localhost:8000/api/health
    ports:
      - port: 8000
        onOpen: ignore

  frontend:
    name: "React Frontend (Vite dev)"
    description: "Vite dev server with HMR and /api proxy to backend (port 5173)"
    commands:
      start: |
        cd /workspaces/HOPEFX-AI-TRADING/frontend
        npm install -q 2>/dev/null || true
        npm run dev
      ready: curl -sf http://localhost:5173
    ports:
      - port: 5173
        onOpen: open-preview

# HOPEFX AI Trading — full stack
# Usage:
#   cp .env.example .env && docker compose up -d

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Vite inlines these at build time, so env_file below is too late for
      # them. Empty is the correct default: the UI then uses same-origin /api
      # and wss://<page host>, which is how this compose file serves it. Set
      # them in .env only when the API lives on a different domain.
      args:
        VITE_API_URL: "${VITE_API_URL:-}"
        VITE_WS_URL: "${VITE_WS_URL:-}"
        VITE_NUCLEAR_WS_URL: "${VITE_NUCLEAR_WS_URL:-}"
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hopefx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hopefx}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # The app inspects the Celery broker for its health page. Without these it
      # fell back to redis://localhost:6379/1 — the app container itself, where
      # nothing listens — and reported "Celery inspect failed: Error 111
      # connecting to localhost:6379" while every other component reached
      # redis:6379 fine. celery_app.py now derives these from REDIS_URL when
      # unset; they are stated here too so the three services that talk to the
      # broker are configured identically and visibly.
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      # TLS enforcement — auto-upgrades redis:// → rediss:// at runtime.
      # In production, set REDIS_URL=rediss://... in .env instead.
      IS_FORCE_TLS: ${IS_FORCE_TLS:-false}
      REDIS_FORCE_TLS: ${REDIS_FORCE_TLS:-false}
      APP_ENV: ${APP_ENV:-production}
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      # ── Constitutional invariant enforcement (docs/INVARIANT_ROLLOUT.md) ──
      # Default monitor = observe + log, never block. Flip to enforce only
      # after a clean soak (watch /health/invariants).
      HOPEFX_INVARIANT_MODE: ${HOPEFX_INVARIANT_MODE:-monitor}
      # Staged rollout: enforce the can't-halt-the-desk pair (order_authorization,
      # pre_trade) now; they only refuse a single bad order. Promote reconciliation
      # + ledger (which can trip the kill switch / halt ALL trading) only after a
      # clean monitor soak — see docs/INVARIANT_ROLLOUT.md. Remove a kind = instant rollback.
      HOPEFX_INVARIANT_ENFORCE_KINDS: ${HOPEFX_INVARIANT_ENFORCE_KINDS:-order_authorization,pre_trade}
      HOPEFX_INVARIANT_FAIL_CLOSED: ${HOPEFX_INVARIANT_FAIL_CLOSED:-0}
      RISK_MAX_TICK_STALENESS_S: ${RISK_MAX_TICK_STALENESS_S:-5.0}
      # Four-eyes gate: orders >= this USD notional need an approver (0=off).
      RISK_HUMAN_APPROVAL_NOTIONAL_USD: ${RISK_HUMAN_APPROVAL_NOTIONAL_USD:-0}
      RISK_MAX_SYMBOL_EXPOSURE_USD: ${RISK_MAX_SYMBOL_EXPOSURE_USD:-1000000.0}
      RISK_APPROVED_VAR_USD: ${RISK_APPROVED_VAR_USD:-0}
      # ── HOPEFXBrain — sourced from .env (set these before docker compose up) ──
      # LLM backend: "anthropic" (default) or "openai"
      LLM_BACKEND: ${LLM_BACKEND:-anthropic}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      OPENAI_MODEL: ${OPENAI_MODEL:-o4-mini}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_SECURITY_MAX_TOKENS: ${LLM_SECURITY_MAX_TOKENS:-1024}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_BASE_DELAY: ${LLM_RETRY_BASE_DELAY:-1.0}
      PAPER_TRADING: ${PAPER_TRADING:-true}
      CME_ENABLED: ${CME_ENABLED:-false}
      CME_FIX_HOST: ${CME_FIX_HOST:-127.0.0.1}
      CME_FIX_PORT: ${CME_FIX_PORT:-9876}
      CME_FIX_SENDER_ID: ${CME_FIX_SENDER_ID:-HOPEFX}
      CME_FIX_TARGET_ID: ${CME_FIX_TARGET_ID:-CME}
      CME_FIX_USERNAME: ${CME_FIX_USERNAME:-}
      CME_FIX_PASSWORD: ${CME_FIX_PASSWORD:-}
      CME_ACCOUNT: ${CME_ACCOUNT:-}
      CME_IBKR_FALLBACK: ${CME_IBKR_FALLBACK:-true}
      CME_PAPER_FALLBACK: ${CME_PAPER_FALLBACK:-true}
      CME_LATENCY_WARN_MS: ${CME_LATENCY_WARN_MS:-50}
      CPP_SHIM_ENABLED: ${CPP_SHIM_ENABLED:-false}
      CPP_SHIM_ZMQ_CMD_ADDR: ${CPP_SHIM_ZMQ_CMD_ADDR:-tcp://127.0.0.1:6555}
      CPP_SHIM_ZMQ_RESP_ADDR: ${CPP_SHIM_ZMQ_RESP_ADDR:-tcp://127.0.0.1:6556}
      CPP_SHIM_TIMEOUT_MS: ${CPP_SHIM_TIMEOUT_MS:-5000}
      CPP_SHIM_LATENCY_WARN_US: ${CPP_SHIM_LATENCY_WARN_US:-1000}
      # Secrets passed through from .env — never hard-code values here
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FLASHPOINT_API_KEY: ${FLASHPOINT_API_KEY:-}
      FLASHPOINT_API_URL: ${FLASHPOINT_API_URL:-https://api.flashpoint.io/v1/iocs}
      ARGOCD_ROLLBACK_WEBHOOK: ${ARGOCD_ROLLBACK_WEBHOOK:-}
      BRAIN_SCAN_INTERVAL: ${BRAIN_SCAN_INTERVAL:-30}
      BRAIN_HEAL_INTERVAL: ${BRAIN_HEAL_INTERVAL:-1800}
      # Disabled by default — requires PyTorch ~1 GB. Set to "true" in .env to enable.
      BRAIN_SEMANTIC_ENCODER: ${BRAIN_SEMANTIC_ENCODER:-false}
      # ── CORS / frontend wiring ────────────────────────────────────────────
      # ALLOWED_ORIGINS must match the domain(s) the React SPA is served from.
      # In production this is your HTTPS domain; in dev it defaults to localhost.
      # The middleware will sys.exit(1) at startup if this is wrong in production.
      APP_BASE_URL: ${APP_BASE_URL:-https://localhost}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${HOPEFX_DOMAIN:-localhost},https://www.${HOPEFX_DOMAIN:-localhost}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Read-only: the API only loads models, never writes them.
      # Run scripts/retrain.sh on the host (or a dedicated retrain container) to update models.
      - ./ml/saved_models:/app/ml/saved_models:ro
      - trading_state:/app/state
    # Resource limits — prevent API from starving the trading engine on a 2-core VPS.
    # 2 GB is the minimum for the full ML stack (InferenceEngine + LightGBM + XGBoost).
    # Increase further if running full retraining inside the container.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      # start_period covers FIRST boot, which is the slowest: preflight runs 20
      # alembic migrations (measured 23s on SQLite at full CPU; postgres here is
      # capped at 0.5 CPU) before `python app.py` even starts, and importing the
      # app costs a further 10.5s at full CPU. 60s did not cover that, so a
      # first deploy was reported unhealthy while still legitimately starting.
      # Raising it delays only when failures begin to COUNT; a genuinely broken
      # app still fails, just later and without the false negative.
      start_period: 180s

  # ── Trading engine — event-driven pipeline ────────────────────────────────
  # Runs core/main_loop.py: MarketIngest → StrategyEngine → Gatekeeper → FIXRouter
  # Separate from the API so it can be scaled, restarted, or paused independently.
  trading:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "core.main_loop"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hopefx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hopefx}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      IS_FORCE_TLS: ${IS_FORCE_TLS:-false}
      REDIS_FORCE_TLS: ${REDIS_FORCE_TLS:-false}
      APP_ENV: ${APP_ENV:-production}
      # Safety: paper trading by default — set OANDA_PRACTICE=false in .env for live
      OANDA_PRACTICE: ${OANDA_PRACTICE:-true}
      # ── HOPEFXBrain — same vars as app service ────────────────────────────
      LLM_BACKEND: ${LLM_BACKEND:-anthropic}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      OPENAI_MODEL: ${OPENAI_MODEL:-o4-mini}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_SECURITY_MAX_TOKENS: ${LLM_SECURITY_MAX_TOKENS:-1024}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_BASE_DELAY: ${LLM_RETRY_BASE_DELAY:-1.0}
      PAPER_TRADING: ${PAPER_TRADING:-true}
      CME_ENABLED: ${CME_ENABLED:-false}
      CME_FIX_HOST: ${CME_FIX_HOST:-127.0.0.1}
      CME_FIX_PORT: ${CME_FIX_PORT:-9876}
      CME_FIX_SENDER_ID: ${CME_FIX_SENDER_ID:-HOPEFX}
      CME_FIX_TARGET_ID: ${CME_FIX_TARGET_ID:-CME}
      CME_FIX_USERNAME: ${CME_FIX_USERNAME:-}
      CME_FIX_PASSWORD: ${CME_FIX_PASSWORD:-}
      CME_ACCOUNT: ${CME_ACCOUNT:-}
      CME_IBKR_FALLBACK: ${CME_IBKR_FALLBACK:-true}
      CME_PAPER_FALLBACK: ${CME_PAPER_FALLBACK:-true}
      CME_LATENCY_WARN_MS: ${CME_LATENCY_WARN_MS:-50}
      CPP_SHIM_ENABLED: ${CPP_SHIM_ENABLED:-false}
      CPP_SHIM_ZMQ_CMD_ADDR: ${CPP_SHIM_ZMQ_CMD_ADDR:-tcp://127.0.0.1:6555}
      CPP_SHIM_ZMQ_RESP_ADDR: ${CPP_SHIM_ZMQ_RESP_ADDR:-tcp://127.0.0.1:6556}
      CPP_SHIM_TIMEOUT_MS: ${CPP_SHIM_TIMEOUT_MS:-5000}
      CPP_SHIM_LATENCY_WARN_US: ${CPP_SHIM_LATENCY_WARN_US:-1000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FLASHPOINT_API_KEY: ${FLASHPOINT_API_KEY:-}
      FLASHPOINT_API_URL: ${FLASHPOINT_API_URL:-https://api.flashpoint.io/v1/iocs}
      ARGOCD_ROLLBACK_WEBHOOK: ${ARGOCD_ROLLBACK_WEBHOOK:-}
      BRAIN_SCAN_INTERVAL: ${BRAIN_SCAN_INTERVAL:-30}
      BRAIN_HEAL_INTERVAL: ${BRAIN_HEAL_INTERVAL:-1800}
      BRAIN_SEMANTIC_ENCODER: ${BRAIN_SEMANTIC_ENCODER:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      # Read-only: the trading engine only loads models for inference, never writes them.
      - ./ml/saved_models:/app/ml/saved_models:ro
      - trading_state:/app/state
      - fix_store:/app/fix_store
      - fix_logs:/app/fix_logs
    # Trading engine gets more CPU than the API — it runs the ML inference loop.
    # Reserve 0.5 cores minimum so tick processing is never starved by the API.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      # Liveness: verify PID 1 (the trading process) is alive.
      # kill -0 sends no signal but returns 0 if the process exists, 1 if not.
      # Works on first start — does not depend on any checkpoint or state file.
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Celery worker — processes background tasks from the queue ────────────────
  # Queues: ml (ML training), billing (subscriptions/payouts), risk (P&L),
  #         infra (DB backup, self-healer).
  # Scale horizontally: docker compose up --scale celery-worker=4
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - celery
      - -A
      - celery_app
      - worker
      - --loglevel=info
      - --concurrency=4
      - --queues=ml,billing,risk,infra,celery
      - --hostname=worker@%h
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hopefx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hopefx}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      IS_FORCE_TLS: ${IS_FORCE_TLS:-false}
      REDIS_FORCE_TLS: ${REDIS_FORCE_TLS:-false}
      APP_ENV: ${APP_ENV:-production}
      # Celery broker/backend — use Redis DB 1/2 to avoid collision with app DB 0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      # ML / LLM vars needed by ml_hourly_online_update and ml_daily_full_retrain
      LLM_BACKEND: ${LLM_BACKEND:-anthropic}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      OPENAI_MODEL: ${OPENAI_MODEL:-o4-mini}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_BASE_DELAY: ${LLM_RETRY_BASE_DELAY:-1.0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OANDA_PRACTICE: ${OANDA_PRACTICE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      # Read-write: worker writes retrained model artifacts to saved_models
      - ./ml/saved_models:/app/ml/saved_models
      - trading_state:/app/state
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      # celery inspect ping returns "pong" when the worker is alive.
      test: ["CMD-SHELL", "celery -A celery_app inspect ping -d worker@$$HOSTNAME --timeout 5 2>/dev/null | grep -q pong || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Celery Beat — periodic task scheduler ────────────────────────────────────
  # Only ONE beat instance must run at a time (it owns the schedule database).
  # Do NOT scale this service — use celery-worker for parallelism instead.
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - celery
      - -A
      - celery_app
      - beat
      - --loglevel=info
      - --scheduler=celery.beat:PersistentScheduler
      - --schedule=/app/state/celerybeat-schedule
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hopefx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hopefx}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      IS_FORCE_TLS: ${IS_FORCE_TLS:-false}
      REDIS_FORCE_TLS: ${REDIS_FORCE_TLS:-false}
      APP_ENV: ${APP_ENV:-production}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy
    volumes:
      # Beat persists its schedule database here so it survives restarts
      # without re-firing all tasks immediately on startup.
      - trading_state:/app/state
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hopefx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hopefx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port intentionally not exposed to host — DB is internal-only.
    # Access via: docker compose exec postgres psql -U ${POSTGRES_USER:-hopefx}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hopefx} -d ${POSTGRES_DB:-hopefx}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Resource limits — sized for an 8GB / 2-core VPS (Hostinger KVM 2). Without
    # a cap here this is the one service most likely to grow unbounded under
    # real trading load and OOM the box, taking the app/trading containers
    # down with it — exactly what the app/trading limits below are meant to
    # prevent, so leaving postgres uncapped defeated the point of having them.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          cpus: "0.1"
          memory: 128M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # maxmemory: 512 MB cap prevents OOM on VPS. allkeys-lru evicts least-recently-used
    # keys when full — safe for our TTL-based caching pattern.
    # tcp-keepalive: detect dead connections within 60s.
    # bind 127.0.0.1: only accept connections from within the Docker network.
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis_data:/data
    # Redis port is NOT exposed to the host in production.
    # Uncomment the line below only for local development debugging.
    # ports:
    #   - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # Docker-level backstop above redis's own --maxmemory 512mb (process
    # overhead, connection buffers) — the internal cap governs the data set,
    # this just stops the whole container from growing past that.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 640M
        reservations:
          cpus: "0.05"
          memory: 128M

  # ── Local inference (optional) ───────────────────────────────────────────
  # Started only with:  docker compose --profile local-ai up
  #
  # Behind a profile rather than on by default because it is the heaviest thing
  # in this file and the box also executes trades. `scripts/vps_capability_report.py`
  # says which tier this machine can hold; an oversized model does not degrade,
  # it swaps the box to a standstill.
  #
  # The app reaches it at OLLAMA_BASE_URL=http://ollama:11434 — set that in .env
  # when you enable the profile, or the local leg has nothing to talk to.
  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["local-ai"]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # Not published to the host: the model server answers the app over the
    # compose network only. An exposed 11434 is an unauthenticated endpoint that
    # will run whatever prompt reaches it, on your hardware.
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          # Sized for the spec's 1B-4B CPU tier. Raise BOTH this and
          # LOCAL_MODEL_TIER together for a larger model — raising the tier
          # alone gets a model the container cannot hold.
          cpus: "2.0"
          memory: 6G
        reservations:
          cpus: "0.5"
          memory: 2G

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy | grep -q 'Prometheus Server is Healthy'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 384M
        reservations:
          cpus: "0.05"
          memory: 64M

  alertmanager:
    build:
      context: ./monitoring/alertmanager
      dockerfile: Dockerfile
    restart: unless-stopped
    # Port is NOT exposed to the host — Prometheus reaches it via the internal
    # Docker network at alertmanager:9093, matching prometheus.yml config.
    environment:
      ALERTMANAGER_TELEGRAM_BOT_TOKEN: ${ALERTMANAGER_TELEGRAM_BOT_TOKEN:-}
      ALERTMANAGER_TELEGRAM_CHAT_ID: ${ALERTMANAGER_TELEGRAM_CHAT_ID:-0}
      ALERTMANAGER_SMTP_FROM: ${ALERTMANAGER_SMTP_FROM:-alerts@hopefx.io}
      ALERTMANAGER_SMTP_TO: ${ALERTMANAGER_SMTP_TO:-}
      ALERTMANAGER_SMTP_HOST: ${ALERTMANAGER_SMTP_HOST:-localhost:587}
      ALERTMANAGER_SMTP_USERNAME: ${ALERTMANAGER_SMTP_USERNAME:-}
      ALERTMANAGER_SMTP_PASSWORD: ${ALERTMANAGER_SMTP_PASSWORD:-}
      # Referenced by alertmanager.yml.tmpl but previously passed through
      # nowhere, so the PagerDuty routing_key was always empty — which is a
      # hard startup error, not a disabled channel. The template now omits the
      # block entirely when this is unset.
      ALERTMANAGER_PAGERDUTY_KEY: ${ALERTMANAGER_PAGERDUTY_KEY:-}
    volumes:
      - alertmanager_data:/alertmanager
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy | grep -q 'OK'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 96M
        reservations:
          cpus: "0.02"
          memory: 32M

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
        reservations:
          cpus: "0.05"
          memory: 64M

  nginx:
    # Opt-in. Start it with:  docker compose --profile standalone-proxy up -d
    #
    # This service binds host ports 80 and 443. On a host that already runs a
    # reverse proxy on those ports — Traefik in `network_mode: host`, which is
    # how the production VPS is set up — the bind fails and the container never
    # leaves the `Created` state. That is exactly what a container audit found:
    # `hopefx-ai-trading-nginx-1  Created`, no restart loop, no logs, and a
    # reader reasonably concluding the site's entry point was down when in fact
    # Traefik was serving it.
    #
    # The workaround in circulation was `--scale nginx=0` on every single
    # `docker compose up`, which is folklore: forget it once and the stack
    # half-starts a container that cannot run. A profile states the rule in the
    # file instead. Use this service only when nothing else owns 80/443.
    profiles: ["standalone-proxy"]
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HOPEFX_DOMAIN: ${HOPEFX_DOMAIN:?HOPEFX_DOMAIN must be set in .env}
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/api/health/live | grep -q 'alive' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 32M
        reservations:
          cpus: "0.02"
          memory: 16M

volumes:
  postgres_data:
  ollama_models:
  redis_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  trading_state:   # shared checkpoint between app and trading services
  fix_store:       # FIX sequence number persistence
  fix_logs:        # FIX message logs

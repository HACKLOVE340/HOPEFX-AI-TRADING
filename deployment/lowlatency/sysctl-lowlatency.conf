# /etc/sysctl.d/99-hopefx-lowlatency.conf
# Low-latency kernel tuning for HOPEFX trading engine.
#
# Apply:   sudo sysctl -p /etc/sysctl.d/99-hopefx-lowlatency.conf
# Revert:  sudo sysctl --system   (reloads all defaults)
#
# Tested on: Ubuntu 22.04 LTS, Debian 12, kernel 5.15+
# Target:    VPS near exchange (Equinix NY4/NY5, LD4, TY3)

# ── TCP stack tuning ──────────────────────────────────────────────────────────

# Increase TCP send/receive buffer sizes (16 MB max).
# Reduces retransmits on high-throughput FIX/WebSocket connections.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.ipv4.tcp_rmem = 4096 262144 16777216
net.ipv4.tcp_wmem = 4096 262144 16777216

# Increase socket backlog for burst order flow
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65535

# Disable TCP slow start after idle — keeps FIX session at full speed
# between order bursts (critical for low-latency order routing).
net.ipv4.tcp_slow_start_after_idle = 0

# Disable Nagle algorithm globally (TCP_NODELAY equivalent at kernel level).
# Nagle buffers small packets — harmful for FIX NewOrderSingle messages.
net.ipv4.tcp_low_latency = 1

# Enable TCP Fast Open — reduces handshake latency for reconnects.
net.ipv4.tcp_fastopen = 3

# Reduce TIME_WAIT socket recycling time.
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1

# Increase local port range for outbound connections (FIX + WebSocket).
net.ipv4.ip_local_port_range = 1024 65535

# Disable TCP timestamps — reduces per-packet overhead on high-frequency feeds.
net.ipv4.tcp_timestamps = 0

# Enable TCP keepalive to detect dead FIX sessions faster.
net.ipv4.tcp_keepalive_time = 30
net.ipv4.tcp_keepalive_intvl = 5
net.ipv4.tcp_keepalive_probes = 3

# ── Memory ────────────────────────────────────────────────────────────────────

# Reduce swappiness — trading engine must never swap to disk mid-session.
vm.swappiness = 1

# Increase memory map limit for large ML models and Redis AOF.
vm.max_map_count = 262144

# Disable transparent huge pages deferral (reduces latency spikes from THP).
# Note: THP itself is disabled via the setup script below.
kernel.numa_balancing = 0

# ── File descriptors ──────────────────────────────────────────────────────────

# High fd limit for WebSocket connections, Redis, PostgreSQL, ZMQ sockets.
fs.file-max = 1048576

groups:
  - name: hopefx_critical
    rules:

      # ── System availability ────────────────────────────────────────────────

      - alert: HopeFXDown
        expr: up{job="hopefx"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HOPEFX API is down"
          description: >
            The HOPEFX trading API has been unreachable for more than 1 minute.
            No orders can be placed or monitored. Immediate investigation required.

      - alert: HopeFXHighErrorRate
        expr: >
          rate(http_requests_total{job="hopefx", status=~"5.."}[5m])
          /
          rate(http_requests_total{job="hopefx"}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HOPEFX error rate > 5%"
          description: >
            More than 5% of HTTP requests are returning 5xx errors over the
            last 5 minutes. Current rate: {{ $value | humanizePercentage }}.

      # ── Kill switch ────────────────────────────────────────────────────────

      - alert: KillSwitchActive
        expr: hopefx_kill_switch_active == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "HOPEFX kill switch is ACTIVE — all trading halted"
          description: >
            The system-wide kill switch has been activated. All new order
            submissions are blocked. Reason recorded in application logs.
            Deactivate via POST /api/kill-switch/deactivate with the
            HOPEFX_KILL_SWITCH_TOKEN once the underlying issue is resolved.

      - alert: KillSwitchActiveExtended
        expr: hopefx_kill_switch_active == 1
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "HOPEFX kill switch active for >30 minutes"
          description: >
            The kill switch has been active for more than 30 minutes.
            Trading remains fully halted. Escalate immediately if this
            was not a planned maintenance window.

      # ── Drawdown / risk ────────────────────────────────────────────────────

      - alert: DrawdownAmberAlert
        expr: hopefx_current_drawdown_pct >= (hopefx_max_drawdown_pct * 0.60)
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Drawdown at 60% of limit (amber alert)"
          description: >
            Current drawdown {{ $value | humanizePercentage }} has reached
            60% of the configured maximum. Monitor closely — the kill switch
            will activate automatically at 100% of the limit.

      - alert: DrawdownRedAlert
        expr: hopefx_current_drawdown_pct >= hopefx_max_drawdown_pct
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Max drawdown breached — kill switch should be active"
          description: >
            Current drawdown {{ $value | humanizePercentage }} has reached
            or exceeded the configured maximum. The kill switch should have
            activated automatically. Verify kill_switch_active=1.

      - alert: DailyLossLimitBreached
        expr: hopefx_daily_loss_pct >= hopefx_daily_loss_limit_pct
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Daily loss limit breached"
          description: >
            Daily loss {{ $value | humanizePercentage }} has reached the
            configured daily limit. Trading should be halted automatically.

      # ── Broker connectivity ────────────────────────────────────────────────

      - alert: BrokerDisconnected
        expr: hopefx_broker_connected == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "IBKR broker connection lost"
          description: >
            The IBKR broker connection has been down for more than 2 minutes.
            Open positions cannot be managed and no new orders can be routed.
            Check TWS/Gateway status and network connectivity.

      - alert: BrokerReconnectExhausted
        expr: hopefx_broker_reconnect_attempts >= 5
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "IBKR broker reconnect attempts exhausted"
          description: >
            The broker has failed to reconnect after {{ $value }} attempts.
            Manual intervention required — restart TWS/Gateway or check
            API credentials.

      # ── Order flow ─────────────────────────────────────────────────────────

      - alert: OrderRateLimitExceeded
        expr: rate(hopefx_order_rate_limit_hits_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Order rate limit being hit"
          description: >
            Users are hitting the order rate limit. This may indicate a
            runaway strategy or a misconfigured client. Review ORDER_RATE_LIMIT.

      - alert: NoOrdersPlaced
        expr: >
          rate(hopefx_orders_placed_total[1h]) == 0
          and hopefx_kill_switch_active == 0
          and hopefx_broker_connected == 1
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "No orders placed in 2 hours (system healthy)"
          description: >
            No orders have been placed in the last 2 hours despite the broker
            being connected and the kill switch being inactive. This may be
            expected outside market hours but warrants review during sessions.

      # ── Infrastructure ─────────────────────────────────────────────────────

      - alert: HighMemoryUsage
        expr: >
          process_resident_memory_bytes{job="hopefx"}
          / (1024 * 1024 * 1024) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HOPEFX memory usage > 2 GB"
          description: >
            Process memory has exceeded 2 GB for 5 minutes.
            Current: {{ $value | humanize }}B. Check for memory leaks.

      - alert: SlowAPIResponse
        expr: >
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{job="hopefx"}[5m])
          ) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "HOPEFX p95 API latency > 2s"
          description: >
            95th percentile API response time is {{ $value | humanizeDuration }}.
            Order placement latency above 2s is unacceptable for live trading.

      - alert: DatabaseConnectionPoolExhausted
        expr: hopefx_db_pool_checked_out >= hopefx_db_pool_size
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool exhausted"
          description: >
            All {{ $value }} database connections are checked out. New requests
            will queue or fail. Increase DB_POOL_SIZE or investigate slow queries.

  # ── Circuit breakers ───────────────────────────────────────────────────────
  # hopefx_circuit_breaker_state{breaker="<name>"}: 0=closed, 1=half_open, 2=open
  # hopefx_circuit_breaker_failures_total{breaker="<name>"}: cumulative failure count

  - name: hopefx_circuit_breakers
    rules:

      - alert: CircuitBreakerOpen
        expr: hopefx_circuit_breaker_state == 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker OPEN: {{ $labels.breaker }}"
          description: >
            The {{ $labels.breaker }} circuit breaker has opened after repeated
            failures. All calls to this service are being rejected immediately.
            Check /api/health/deep for live probe results.
            The breaker will probe again after its configured timeout.

      - alert: CircuitBreakerOpenExtended
        expr: hopefx_circuit_breaker_state == 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker OPEN >5 min: {{ $labels.breaker }}"
          description: >
            The {{ $labels.breaker }} circuit breaker has been open for more
            than 5 minutes. The underlying service has not recovered.
            Manual intervention may be required.

      - alert: BrokerCircuitBreakerOpen
        expr: hopefx_circuit_breaker_state{breaker="broker"} == 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Broker circuit breaker OPEN — order execution halted"
          description: >
            The broker circuit breaker is open. No orders can be placed or
            managed. Check broker connectivity (TWS/Gateway/OANDA) and network.
            The kill switch may activate automatically.

      - alert: RedisCircuitBreakerOpen
        expr: hopefx_circuit_breaker_state{breaker="redis"} == 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Redis circuit breaker OPEN — cache and pub/sub unavailable"
          description: >
            The Redis circuit breaker is open. Session store, kill switch
            pub/sub, and rate limiting are degraded. Check Redis connectivity.

      - alert: DatabaseCircuitBreakerOpen
        expr: hopefx_circuit_breaker_state{breaker="database"} == 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Database circuit breaker OPEN — persistence unavailable"
          description: >
            The database circuit breaker is open. Trade records, user data,
            and audit logs cannot be persisted. Check PostgreSQL connectivity.

      - alert: MLCircuitBreakerOpen
        expr: hopefx_circuit_breaker_state{breaker="ml_model"} == 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "ML model circuit breaker OPEN — signals degraded"
          description: >
            The ML model circuit breaker is open. Signal generation is
            degraded or disabled. Check ml/saved_models/ and inference logs.

      - alert: CircuitBreakerHalfOpenStuck
        expr: hopefx_circuit_breaker_state == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker stuck in HALF_OPEN: {{ $labels.breaker }}"
          description: >
            The {{ $labels.breaker }} circuit breaker has been in HALF_OPEN
            state for more than 10 minutes. The service is intermittently
            failing probes. Investigate root cause.

      - alert: CircuitBreakerFailureRateHigh
        expr: rate(hopefx_circuit_breaker_failures_total[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker failure rate high: {{ $labels.breaker }}"
          description: >
            The {{ $labels.breaker }} circuit breaker is recording
            {{ $value | humanize }} failures/second. The breaker may open
            soon if failures continue.

      - alert: MultipleCircuitBreakersOpen
        expr: count(hopefx_circuit_breaker_state == 2) >= 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Multiple circuit breakers open ({{ $value }} services down)"
          description: >
            {{ $value }} circuit breakers are simultaneously open, indicating
            a systemic failure. The kill switch may activate automatically.
            Immediate investigation required.

  # ── Auto-rollback events ───────────────────────────────────────────────────
  # hopefx_rollback_total{service}: cumulative rollback count
  # hopefx_rollback_strategy_total{strategy}: by strategy (soft/medium/hard/full)
  # hopefx_rollback_trigger_total{trigger}: by trigger source
  # hopefx_rollback_failed_total: rollbacks that themselves failed

  - name: hopefx_rollback
    rules:

      - alert: RollbackTriggered
        expr: increase(hopefx_rollback_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Auto-rollback triggered on {{ $labels.service }}"
          description: >
            An automatic rollback has been triggered on {{ $labels.service }}.
            {{ $value }} rollback(s) in the last 5 minutes.
            Check logs/app.log and Redis key rollback:history.
            Investigate the root cause before re-deploying.

      - alert: HardRollbackTriggered
        expr: increase(hopefx_rollback_strategy_total{strategy=~"hard|full"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "HARD/FULL rollback triggered — code reverted"
          description: >
            A {{ $labels.strategy }} rollback has been executed. Code changes
            have been reverted via git and the process has been restarted.
            Verify the system is stable before re-deploying the failed version.

      - alert: RollbackRateHigh
        expr: rate(hopefx_rollback_total[30m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Rollback rate high — repeated failures detected"
          description: >
            More than 3 rollbacks in the last 30 minutes. The system is
            repeatedly failing and rolling back. Automated recovery cannot
            resolve this. Manual intervention required.

      - alert: RollbackFromCircuitBreaker
        expr: increase(hopefx_rollback_trigger_total{trigger="circuit_breaker_open"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Rollback triggered by circuit breaker opening"
          description: >
            An automatic rollback was triggered because a circuit breaker
            opened. Check which breaker opened and why.

      - alert: RollbackFromKillSwitch
        expr: increase(hopefx_rollback_trigger_total{trigger="kill_switch_activated"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Rollback triggered by kill switch activation"
          description: >
            An automatic rollback was triggered because the kill switch was
            activated. Trading is halted. Investigate the kill switch reason
            before deactivating.

      - alert: RollbackFromHealthCheck
        expr: increase(hopefx_rollback_trigger_total{trigger="health_check_failed"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Rollback triggered by post-deploy health check failure"
          description: >
            A post-deploy health check failed and triggered an automatic
            rollback. Review the health check output and fix the issue
            before re-deploying.

      - alert: RollbackFailed
        expr: increase(hopefx_rollback_failed_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Auto-rollback FAILED — system in unknown state"
          description: >
            An automatic rollback was attempted but failed. The system may
            be in an inconsistent state. Immediate manual intervention is
            required. Check logs/app.log for rollback error details.

  # ── Startup probe ──────────────────────────────────────────────────────────
  # hopefx_startup_complete: 0=not started, 1=complete

  - name: hopefx_startup
    rules:

      - alert: StartupSlow
        expr: hopefx_startup_complete == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "HOPEFX startup taking more than 3 minutes"
          description: >
            The application has been starting for more than 3 minutes.
            Check /api/health/startup for which tasks are pending.

      - alert: StartupFailed
        expr: hopefx_startup_complete == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "HOPEFX startup has not completed after 10 minutes"
          description: >
            The startup probe has not returned 200 after 10 minutes.
            The pod is likely stuck. Check container logs and consider
            restarting the pod.

  - name: hopefx_ml_regime
    rules:

      # ── Fold-2 below-chance regime (parabolic blow-off / post-bubble crash) ──
      # Ref: docs/FOLD2_REGIME_ANALYSIS.md — walk-forward Fold 2 scored 44.4%
      # (below chance). The RegimeConditionalModel abstains (neutral) when the
      # market enters HIGH_VOL_PARABOLIC; these alerts surface that condition.
      - alert: HopeFXFold2ParabolicRegime
        expr: hopefx_regime_conditional_regime_fraction{regime="high_vol_parabolic"} > 0.20
        for: 30m
        labels:
          severity: warning
          component: ml-regime
        annotations:
          summary: "Market in Fold-2 below-chance regime (HIGH_VOL_PARABOLIC)"
          description: >
            {{ $value | humanizePercentage }} of recent bars match the documented
            Fold-2 parabolic / post-bubble regime where the model scored below
            chance (44.4% in walk-forward Fold 2). The model is abstaining (neutral)
            — expect reduced signal coverage. Do NOT override the abstain.
            Ref: docs/FOLD2_REGIME_ANALYSIS.md.

      - alert: HopeFXFold2AbstainActive
        expr: rate(hopefx_regime_conditional_predict_total{regime="high_vol_parabolic"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
          component: ml-regime
        annotations:
          summary: "Model abstaining on live signals (Fold-2 parabolic regime)"
          description: >
            Live predictions have landed in the HIGH_VOL_PARABOLIC regime over the
            last 15m, so the model is returning neutral/abstain (Fold-2 conditions:
            close > 1.30*MA200, or rv14 > 2.5*rv90 with price <= 75% of the 200-bar
            peak). Confirm risk sizing is reduced. Ref: docs/FOLD2_REGIME_ANALYSIS.md.

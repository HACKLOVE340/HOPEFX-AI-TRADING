repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Helm templates use Go {{ }} syntax — not valid YAML.
        # config/ultimate_config.yaml and deployment/k8s_config.yaml have
        # Python docstrings at the top and are excluded until cleaned up.
        args: [--unsafe]
        exclude: ^(helm/|config/ultimate_config\.yaml|deployment/k8s_config\.yaml)
      - id: check-added-large-files
      - id: check-json
        # devcontainer.json uses JSONC (comments) — excluded; kept as plain JSON now.
        exclude: ^\.devcontainer/
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        # types-all is broken (types-pkg-resources yanked); list only what we need
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - types-redis
          - types-passlib
          - types-python-dateutil
        args: ['--ignore-missing-imports']

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

# pytest belongs in the CI test job, not in pre-commit hooks.
# Running the full test suite on every commit is too slow and fails in
# environments where test dependencies are not installed.

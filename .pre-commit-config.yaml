repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Generated artifacts are excluded from the whitespace fixers below.
      # They are regenerated verbatim by their producers (vite, the retrain
      # workflows, the tutorial generator), so a hook that appends a newline
      # does not "fix" anything: it makes the committed file differ from the
      # build output, and the difference reappears on the next regeneration.
      # `pre-commit run --all-files` was failing on five such files every time,
      # which is exactly the pressure that gets people reaching for
      # `--no-verify` — the thing CLAUDE.md forbids.
      - id: trailing-whitespace
        exclude: ^(frontend/package-lock\.json|dashboard/dist/|ml/saved_models/|tutorials/generated/)
      - id: end-of-file-fixer
        exclude: ^(frontend/package-lock\.json|dashboard/dist/|ml/saved_models/|tutorials/generated/)
      - id: check-yaml
        # Helm templates use Go {{ }} syntax — not valid YAML.
        # config/ultimate_config.yaml and deployment/k8s_config.yaml have
        # Python docstrings at the top and are excluded until cleaned up.
        args: [--unsafe]
        exclude: ^(helm/|config/ultimate_config\.yaml|deployment/k8s_config\.yaml)
      - id: check-added-large-files
        # This hook only inspects files with `--diff-filter=A`, i.e. newly
        # *added* paths. Vite gives every rebuilt bundle a new content hash, so
        # `dashboard/dist/assets/index-<hash>.js` is an added file on every
        # single rebuild and trips the 500 KB limit every time — while its
        # 738 KB predecessor sat in the tree unchallenged. The same applies to
        # retrained model artifacts. Both trees are committed on purpose
        # (see CLAUDE.md); this exclusion is what makes that decision and this
        # hook consistent, instead of unbuildable.
        exclude: ^(dashboard/dist/|ml/saved_models/|ml/rl_models/)
      - id: check-json
        # devcontainer.json uses JSONC (comments) — excluded; kept as plain JSON now.
        exclude: ^\.devcontainer/
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
        # Jupyter notebooks and lock files must not be modified by ruff
        exclude: (\.ipynb$|package-lock\.json$)
      - id: ruff-format
        exclude: (\.ipynb$|package-lock\.json$)

# mypy is run in CI (ci.yml) with --ignore-missing-imports on the canonical
# packages. It is intentionally excluded from pre-commit because the codebase
# has ~1000 pre-existing type errors that are tracked separately and would
# block every commit. Re-enable once the type-error count reaches zero.

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        # pass_filenames: false so bandit scans the configured targets recursively
        # rather than receiving every changed file as a positional argument
        # (which overflows the arg list and causes exit code 2).
        pass_filenames: false
        args:
          - "-r"
          - "api/"
          - "auth/"
          - "brokers/"
          - "config/"
          - "core/"
          - "execution/"
          - "ml/"
          - "risk/"
          - "strategies/"
          - "-c"
          - "pyproject.toml"
          # Only fail on HIGH severity findings; medium/low are noise at this stage.
          - "--severity-level"
          - "high"
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets
        # Audit against the committed baseline so only NEW secrets fail the hook.
        # To update the baseline after a legitimate change:
        #   detect-secrets scan --baseline .secrets.baseline
        args:
          - "--baseline"
          - ".secrets.baseline"
          # Exclude files that legitimately contain placeholder/example values.
          - "--exclude-files"
          - "(frontend/package-lock\\.json|\\.env\\.example|data/.*\\.csv|ml/saved_models/.*|docs/.*\\.md|docs/archive/.*|DEPLOYMENT\\.md|dashboard/dist/.*|.*\\.ipynb|test-results\\.xml)"
        # Jupyter notebooks, lock files, markdown docs, and build artifacts are excluded.
        exclude: (\.ipynb$|package-lock\.json$|\.md$|dashboard/dist/|test-results\.xml$)

# ── Local hooks ───────────────────────────────────────────────────────────────
# These run scripts from the repository itself (no external repo required).

  - repo: local
    hooks:
      - id: healer-check
        name: Self-healer static integrity check
        language: python
        entry: python scripts/pre_commit_healer.py
        types: [python]
        # Exclude test files, examples, generated code, and vendored agent
        # skills — the healer only checks production source files for stubs,
        # TODOs, and mock classes.
        exclude: >-
          (?x)^(
            \.claude/.*|
            tests/.*|
            examples/.*|
            scripts/.*|
            alembic/.*|
            docs/.*|
            frontend/.*|
            mobile/.*|
            mobile-app/.*|
            dashboard/.*
          )$
        # Run on every staged Python file in production packages
        pass_filenames: true

      - id: coverage-gate
        name: Per-module coverage gate (≥80%)
        # system, not python: this shells out to pytest against real test
        # files that import the full production stack (fastapi, sqlalchemy,
        # ...). An isolated `language: python` venv has none of that unless
        # additional_dependencies lists the whole project, so every
        # measurement silently failed with "No module named pytest" and
        # every module read as unmeasurable rather than measured — the same
        # failure shape this gate already had to be fixed against once.
        # Matches every sibling hook here that needs project code importable
        # (docs-freshness, gate-evidence, doc-metrics, ...).
        language: system
        entry: python scripts/pre_commit_coverage.py
        types: [python]
        # Only run on production source files that have corresponding test files.
        # Excluded: tests, scripts, examples, generated/infra code, vendored
        # agent skills under .claude/.
        exclude: >-
          (?x)^(
            \.claude/.*|
            tests/.*|
            examples/.*|
            scripts/.*|
            alembic/.*|
            docs/.*|
            frontend/.*|
            mobile/.*|
            mobile-app/.*|
            dashboard/.*|
            grafana/.*|
            helm/.*|
            k8s/.*|
            docker/.*|
            nginx/.*
          )$
        pass_filenames: true
        # Coverage gate is slower than other hooks — run last
        stages: [pre-commit]

      - id: change-record
        name: Change record states its expected effect (Group 2 Ch 6)
        # commit-msg, not pre-commit: the trailer being checked lives in the
        # message, which does not exist yet at the pre-commit stage.
        language: system
        entry: python -m deployment.change_records --check-message
        stages: [commit-msg]
        pass_filenames: true
        always_run: true

      - id: adr-check
        name: Decision records (Group 3 Ch 6)
        # system, not python: it shells out to git to enforce immutability, and
        # an isolated venv has neither the repository nor its history.
        language: system
        entry: python scripts/adr.py --check
        files: ^docs/decisions/
        pass_filenames: false
        stages: [pre-commit]

      - id: check-secrets
        name: Block plaintext credentials
        language: script
        entry: scripts/check_secrets.sh
        types: [yaml]
        pass_filenames: false
        stages: [pre-commit]

      # Group 3 Chapter 2. Blocks a NEW unregistered document, a new duplicate
      # subject claim, and any increase in unowned documents. Existing debt is
      # baselined in docs/REGISTRY.toml and may only shrink — a check that failed
      # on all 198 documents on day one would simply be removed.
      - id: docs-registry
        name: Document registry (Group 3 Ch 2)
        language: system
        entry: python scripts/docs_registry.py --check
        files: '(^docs/.*\.(md|txt)$|^[A-Z_-]+\.md$)'
        pass_filenames: false
        stages: [pre-commit]

      # Group 3 Chapter 15. Two layers: referential (paths and links) and CLAIMS
      # (gitignore status, pinned interpreter version) — because a pure
      # referential check would have caught NONE of the three documentation
      # errors this repository has already made. Scoped to living documents:
      # a record is correct at its date and an archived document is not
      # maintained, so staleness there is a fact rather than a defect.
      - id: docs-freshness
        name: Documentation freshness (Group 3 Ch 15)
        language: system
        entry: python scripts/docs_freshness.py --check
        files: '(^docs/.*\.md$|^[A-Z_-]+\.md$)'
        pass_filenames: false
        stages: [pre-commit]

      # The Group 4 source opens with one rule: ADD AND EXPAND; NEVER SILENTLY
      # REMOVE. Two sources exist and neither is a superset of the other, so a
      # title can be dropped by adopting either one alone. Enforced rather than
      # intended: a rule nobody runs is not a rule.
      - id: group4-preservation
        name: Group 4 source preservation (nothing dropped)
        language: system
        entry: python scripts/group4_preservation.py
        files: '^docs/ai/specs/GROUP4_.*$'
        pass_filenames: false
        stages: [pre-commit]

      # The volume index claims to be generated. Without this, that claim is
      # unverifiable and discourages the checking a hand-written file would get.
      - id: group4-index
        name: Group 4 volume index matches its sources
        language: system
        entry: python scripts/group4_index.py --check
        files: '^(docs/ai/specs/GROUP4_.*|scripts/group4_index\.py)$'
        pass_filenames: false
        stages: [pre-commit]

      # Group 2 Rule 1: a control that cannot fail is not a control. Seven such
      # controls have been found here, two of them in code running nightly. The
      # ledger is discovered rather than hand-listed, so a new gate cannot be
      # added and quietly omitted; recorded debt may only shrink.
      - id: gate-evidence
        name: Gate injection evidence (Rule 1)
        language: system
        entry: python scripts/gate_evidence.py --check
        files: '^(scripts/ci/gate_.*\.py|\.pre-commit-config\.yaml|docs/GATE_EVIDENCE\.toml)$'
        pass_filenames: false
        stages: [pre-commit]

      # The owner's standing rule: documentation ships with every push. The
      # failure it guards against is not a missing file but a document that
      # still looks current while carrying a figure that stopped being true.
      # docs-freshness checks paths and claims; this one checks arithmetic.
      - id: doc-metrics
        name: Documents state the measured figures
        language: system
        entry: python scripts/doc_metrics.py --check
        files: '^(docs/.*\.(md|toml)$|[A-Z_-]+\.md$|scripts/(gate_evidence|group4_preservation|docs_registry|doc_metrics)\.py$)'
        pass_filenames: false
        stages: [pre-commit]

      # The frontend's twelve semantic tokens are declared and almost unused:
      # 8,021 hardcoded colour literals across frontend/src against 58 uses of
      # var(--...). That is why the light/dark toggle changes nothing (no
      # [data-theme="light"] rule exists anywhere) and why a white-label
      # tenant's brand colour cannot reach the product. Replacing them is a
      # codemod and the owner's call; keeping the number from growing is not.
      # Reads the whole tree, not the staged subset: the "delete the line once
      # a file reaches zero" rule cannot be evaluated from a partial view.
      - id: frontend-colour-ratchet
        name: Frontend colour literals may only decrease
        language: system
        entry: python scripts/frontend_colour_ratchet.py --check
        files: '^(frontend/src/.*\.(tsx?|jsx?|css)$|docs/FRONTEND_COLOUR_DEBT\.json$|scripts/frontend_colour_ratchet\.py$)'
        pass_filenames: false
        stages: [pre-commit]

# pytest belongs in the CI test job, not in pre-commit hooks.
# Running the full test suite on every commit is too slow and fails in
# environments where test dependencies are not installed.

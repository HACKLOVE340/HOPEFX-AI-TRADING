# fix.cfg — FIX 4.4 session configuration template
#
# HOW TO USE
# ----------
# 1. Copy this file: cp fix.cfg fix.cfg.local
# 2. Fill in every value marked <CHANGE_ME>
# 3. Set FIX_CONFIG_FILE=fix.cfg.local in your .env
# 4. Never commit fix.cfg.local — it contains credentials
#
# BROKER NOTES
# ------------
# OANDA FIX (practice):  Host=fxpractice-fix.oanda.com  Port=1234
# OANDA FIX (live):      Host=fxtrade-fix.oanda.com      Port=1234
# IBKR TWS (paper):      Host=127.0.0.1                  Port=7497
# IBKR TWS (live):       Host=127.0.0.1                  Port=7496
# Generic broker:        Obtain Host/Port from your broker's FIX spec
#
# All field names follow the QuickFIX/N FIX 4.4 session spec.
# Reference: https://quickfixengine.org/c/documentation/

# ── DEFAULT (applies to all sessions unless overridden) ──────────────────────
[DEFAULT]
# FIX protocol version
BeginString=FIX.4.4

# This side is always the order-sending initiator
ConnectionType=initiator

# Seconds between heartbeat messages (keep-alive)
HeartBtInt=30

# Seconds between reconnect attempts on disconnect
ReconnectInterval=5

# Persist sequence numbers and messages to disk for gap-fill recovery
FileStorePath=fix_store

# Log all inbound and outbound FIX messages (set to N in production for perf)
FileLogPath=fix_logs

# Start/end times in UTC — set to cover your trading session
# Format: HH:MM:SS
StartTime=00:00:00
EndTime=23:59:59

# Reset sequence numbers at session start each day
ResetOnLogon=Y
ResetOnLogout=N
ResetOnDisconnect=N

# Validate incoming messages against the FIX data dictionary
UseDataDictionary=Y
DataDictionary=FIX44.xml

# ── SESSION ───────────────────────────────────────────────────────────────────
[SESSION]
# Your firm's identifier assigned by the broker
SenderCompID=<CHANGE_ME_YOUR_SENDER_COMP_ID>

# Broker's identifier (provided in their FIX onboarding docs)
TargetCompID=<CHANGE_ME_BROKER_TARGET_COMP_ID>

# Broker FIX gateway host
SocketConnectHost=<CHANGE_ME_BROKER_FIX_HOST>

# Broker FIX gateway port
SocketConnectPort=<CHANGE_ME_BROKER_FIX_PORT>

# Optional: username/password injected into Logon message (tags 553/554)
# Leave blank if your broker uses SenderCompID/TargetCompID only
Username=<CHANGE_ME_OR_LEAVE_BLANK>
Password=<CHANGE_ME_OR_LEAVE_BLANK>

# ── OPTIONAL: SECOND SESSION (e.g. market data vs order routing) ──────────────
# Uncomment and fill in if your broker requires separate sessions
# [SESSION]
# SenderCompID=<CHANGE_ME>
# TargetCompID=<CHANGE_ME_MD>
# SocketConnectHost=<CHANGE_ME>
# SocketConnectPort=<CHANGE_ME>

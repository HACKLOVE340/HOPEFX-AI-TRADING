<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="HOPEFX GodMode - Professional AI Trading Platform" />

    <!-- PWA. The manifest is injected by vite-plugin-pwa (manifest.webmanifest)
         and is scoped to the /godmode/ base. A second, hand-written
         public/manifest.json used to be linked here as well: it declared
         scope "/" — wrong for a bundle mounted at /godmode/ — and listed eight
         icon sizes of which only two were ever shipped. Two competing manifests
         with the first one wrong is worse than one correct one. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <title>HOPEFX GodMode v9.5</title>

    <style>
      /* Critical CSS for loading state */
      #loading {
        position: fixed;
        inset: 0;
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #1e293b;
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
    </div>
    <div id="root"></div>

    <script>
      // Remove loading spinner when app mounts
      window.addEventListener('load', () => {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.opacity = '0';
          setTimeout(() => loading.remove(), 300);
        }
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>

    <!-- The service worker is registered by vite-plugin-pwa, which injects a
         correctly-scoped registerSW.js for the /godmode/ base. A hand-written
         block here also called navigator.serviceWorker.register('/sw.js') — a
         root path the SPA catch-all answers with HTML, so that registration
         always failed while duplicating one that already works. -->
  </body>
</html>

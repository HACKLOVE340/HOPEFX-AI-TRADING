apiVersion: v1
kind: Secret
metadata:
  name: hopefx-secrets
  namespace: hopefx-production
type: Opaque
# All values MUST be base64-encoded.
# Generate: echo -n "your-value" | base64
#
# NEVER commit real credentials here. Use one of:
#   - External Secrets Operator (recommended for production)
#   - Sealed Secrets (kubeseal)
#   - AWS Secrets Manager / HashiCorp Vault CSI driver
#   - SOPS (mozilla/sops) with age or KMS encryption
#
# This file is an example template — replace every <BASE64_...> placeholder
# before applying. The canonical production template is k8s-secrets.yaml.
#
# Apply:
#   kubectl apply -f k8s-secrets.yaml   # NOT this file
#
# Verify (shows keys, not values):
#   kubectl get secret hopefx-secrets -n hopefx-production -o jsonpath='{.data}' | jq 'keys'
data:
  # Database
  DATABASE_URL: <BASE64_ENCODED_DATABASE_URL>
  POSTGRES_PASSWORD: <BASE64_ENCODED_POSTGRES_PASSWORD>

  # Redis (if password-protected)
  REDIS_URL: <BASE64_ENCODED_REDIS_URL>

  # JWT / Auth
  SECURITY_JWT_SECRET: <BASE64_ENCODED_JWT_SECRET_MIN_64_CHARS>
  CONFIG_ENCRYPTION_KEY: <BASE64_ENCODED_ENCRYPTION_KEY_48_CHARS>
  HOPEFX_KILL_SWITCH_TOKEN: <BASE64_ENCODED_KILL_SWITCH_TOKEN>

  # OANDA broker
  OANDA_API_KEY: <BASE64_ENCODED_OANDA_API_KEY>
  OANDA_ACCOUNT_ID: <BASE64_ENCODED_OANDA_ACCOUNT_ID>

  # Stripe (optional — required for subscription billing)
  STRIPE_SECRET_KEY: <BASE64_ENCODED_STRIPE_SECRET_KEY>
  STRIPE_WEBHOOK_SECRET: <BASE64_ENCODED_STRIPE_WEBHOOK_SECRET>

  # IBKR FIX (leave empty if not using IBKR)
  FIX_SENDER_COMP_ID: <BASE64_ENCODED_FIX_SENDER_COMP_ID>
  FIX_TARGET_COMP_ID: <BASE64_ENCODED_FIX_TARGET_COMP_ID>
  FIX_USERNAME: <BASE64_ENCODED_FIX_USERNAME>
  FIX_PASSWORD: <BASE64_ENCODED_FIX_PASSWORD>

  # Notifications
  TELEGRAM_BOT_TOKEN: <BASE64_ENCODED_TELEGRAM_BOT_TOKEN>
  TELEGRAM_CHAT_ID: <BASE64_ENCODED_TELEGRAM_CHAT_ID>

  # Observability
  SENTRY_DSN: <BASE64_ENCODED_SENTRY_DSN>
  GRAFANA_ADMIN_PASSWORD: <BASE64_ENCODED_GRAFANA_ADMIN_PASSWORD>
---
apiVersion: v1
kind: Secret
metadata:
  name: hopefx-tls
  namespace: hopefx-production
type: kubernetes.io/tls
# Generate with cert-manager or supply your own certificate.
# Example (self-signed for testing only):
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout tls.key -out tls.crt -subj "/CN=hopefx.example.com"
#   kubectl create secret tls hopefx-tls --cert=tls.crt --key=tls.key \
#     -n hopefx-production --dry-run=client -o yaml > k8s-tls-secret.yaml
data:
  tls.crt: <BASE64_ENCODED_TLS_CERTIFICATE>
  tls.key: <BASE64_ENCODED_TLS_PRIVATE_KEY>

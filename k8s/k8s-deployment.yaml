# ── HopeFX API Deployment ─────────────────────────────────────────────────────
# Production-hardened: non-root, read-only FS, dropped capabilities,
# seccomp RuntimeDefault, resource limits, startup/liveness/readiness probes,
# topologySpreadConstraints for zone-aware HA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hopefx-api
  namespace: hopefx
  labels:
    app.kubernetes.io/name: hopefx-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: hopefx-platform
    app.kubernetes.io/version: "11.0.0"
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hopefx-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime deploys
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hopefx-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: hopefx-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # ── ServiceAccount — required for K8s ConfigMap kill switch fallback ────
      # Grants get/patch on hopefx-kill-switch ConfigMap (see kill-switch-rbac.yaml).
      serviceAccountName: hopefx-api

      # ── Security context (pod level) ────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # ── Spread across zones for HA ──────────────────────────────────────────
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hopefx-api

      # ── Graceful termination ────────────────────────────────────────────────
      terminationGracePeriodSeconds: 60

      # ── Image pull secret ───────────────────────────────────────────────────
      imagePullSecrets:
        - name: regcred

      containers:
        - name: api
          image: ghcr.io/hacklove340/hopefx-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP

          # ── Non-sensitive config from ConfigMap ──────────────────────────────
          envFrom:
            - configMapRef:
                name: hopefx-config

          # ── Sensitive credentials from Secret ────────────────────────────────
          env:
            # The flag file defaults to /app/kill_switch.flag, inside the image
            # layer, and this pod has a read-only root filesystem. Point it at
            # the kill-switch-state volume mounted below (F139).
            - name: KILL_SWITCH_FLAG_FILE
              value: /app/state/kill_switch.flag
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hopefx-secrets
                  key: DATABASE_URL
            - name: SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hopefx-secrets
                  key: SECURITY_JWT_SECRET
            - name: CONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: hopefx-secrets
                  key: CONFIG_ENCRYPTION_KEY
            - name: HOPEFX_KILL_SWITCH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hopefx-secrets
                  key: HOPEFX_KILL_SWITCH_TOKEN
            - name: OANDA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hopefx-secrets
                  key: OANDA_API_KEY
            - name: OANDA_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: hopefx-secrets
                  key: OANDA_ACCOUNT_ID
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hopefx-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: hopefx-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hopefx-secrets
                  key: REDIS_PASSWORD
                  optional: true
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: hopefx-secrets
                  key: SENTRY_DSN
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hopefx-secrets
                  key: TELEGRAM_BOT_TOKEN
                  optional: true

          # ── Resource limits ──────────────────────────────────────────────────
          # Sized for: FastAPI + ML inference + WebSocket broadcaster
          # Adjust based on actual profiling; these are conservative production values.
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          # ── Probes ───────────────────────────────────────────────────────────
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24    # allow up to 2 min for cold start
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # ── Container security context ───────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL

          # ── Writable tmp mounts (needed for read-only FS) ────────────────────
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-logs
              mountPath: /app/logs
            - name: kill-switch-state
              mountPath: /app/state

      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-logs
          emptyDir: {}
        # The kill switch's flag file (layer 2). It defaulted to
        # /app/kill_switch.flag, inside the image layer, and this pod runs with
        # readOnlyRootFilesystem — so the write raised OSError and the file
        # layer never worked here either. emptyDir carries it across a process
        # restart inside the container; layers 4 and 5 carry the halt across a
        # pod replacement (F139).
        - name: kill-switch-state
          emptyDir: {}

---
# ── HorizontalPodAutoscaler ───────────────────────────────────────────────────
# Scales on CPU (80%) and memory (80%). Requires metrics-server.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hopefx-api-hpa
  namespace: hopefx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hopefx-api
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

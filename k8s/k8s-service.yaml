# ── HopeFX API Service ────────────────────────────────────────────────────────
# ClusterIP for internal traffic (Ingress terminates TLS externally).
# Selectors match the Deployment pod labels exactly.
apiVersion: v1
kind: Service
metadata:
  name: hopefx-api
  namespace: hopefx
  labels:
    app.kubernetes.io/name: hopefx-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: hopefx-platform
  annotations:
    # Prometheus scrape via ServiceMonitor (if using kube-prometheus-stack)
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hopefx-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: ws
      port: 8080
      targetPort: 8000
      protocol: TCP

---
# ── HopeFX Frontend Service ───────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: hopefx-frontend
  namespace: hopefx
  labels:
    app.kubernetes.io/name: hopefx-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: hopefx-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hopefx-frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP

# ── HopeFX Secrets template ───────────────────────────────────────────────────
# NEVER commit real values here.
# Use one of:
#   - External Secrets Operator (recommended for production)
#   - Sealed Secrets (kubeseal)
#   - AWS Secrets Manager / HashiCorp Vault CSI driver
#
# All values must be base64-encoded:
#   echo -n "your-value" | base64
#
# This file is a TEMPLATE — replace every <BASE64_...> placeholder before applying.
apiVersion: v1
kind: Secret
metadata:
  name: hopefx-secrets
  namespace: hopefx
  labels:
    app.kubernetes.io/name: hopefx
    app.kubernetes.io/part-of: hopefx-platform
type: Opaque
data:
  # ── Database ──────────────────────────────────────────────────────────────
  DATABASE_URL: <BASE64_ENCODED_DATABASE_URL>
  POSTGRES_PASSWORD: <BASE64_ENCODED_POSTGRES_PASSWORD>

  # ── Redis ─────────────────────────────────────────────────────────────────
  REDIS_PASSWORD: <BASE64_ENCODED_REDIS_PASSWORD>

  # ── Auth / JWT ────────────────────────────────────────────────────────────
  SECURITY_JWT_SECRET: <BASE64_ENCODED_JWT_SECRET_MIN_64_CHARS>
  CONFIG_ENCRYPTION_KEY: <BASE64_ENCODED_ENCRYPTION_KEY_48_CHARS>
  HOPEFX_KILL_SWITCH_TOKEN: <BASE64_ENCODED_KILL_SWITCH_TOKEN>

  # ── OANDA broker ──────────────────────────────────────────────────────────
  OANDA_API_KEY: <BASE64_ENCODED_OANDA_API_KEY>
  OANDA_ACCOUNT_ID: <BASE64_ENCODED_OANDA_ACCOUNT_ID>

  # ── Stripe (live mode) ────────────────────────────────────────────────────
  STRIPE_SECRET_KEY: <BASE64_ENCODED_STRIPE_LIVE_SECRET_KEY>
  STRIPE_WEBHOOK_SECRET: <BASE64_ENCODED_STRIPE_WEBHOOK_SECRET>
  STRIPE_PUBLISHABLE_KEY: <BASE64_ENCODED_STRIPE_PUBLISHABLE_KEY>

  # ── Observability ─────────────────────────────────────────────────────────
  SENTRY_DSN: <BASE64_ENCODED_SENTRY_DSN>

  # ── Notifications ─────────────────────────────────────────────────────────
  TELEGRAM_BOT_TOKEN: <BASE64_ENCODED_TELEGRAM_BOT_TOKEN>

  # ── FIX protocol (IBKR) ───────────────────────────────────────────────────
  FIX_SENDER_COMP_ID: <BASE64_ENCODED_FIX_SENDER_COMP_ID>
  FIX_TARGET_COMP_ID: <BASE64_ENCODED_FIX_TARGET_COMP_ID>

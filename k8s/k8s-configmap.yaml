# ── HopeFX ConfigMap — non-sensitive runtime config ───────────────────────────
# Credentials and secrets belong in k8s-secrets.yaml (or an external
# secrets manager: AWS Secrets Manager / HashiCorp Vault / Sealed Secrets).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hopefx-config
  namespace: hopefx
  labels:
    app.kubernetes.io/name: hopefx
    app.kubernetes.io/part-of: hopefx-platform
data:
  # Infrastructure
  REDIS_HOST: "redis-master.hopefx.svc.cluster.local"
  REDIS_PORT: "6379"
  APP_ENV: "production"

  # Redis HA mode — set ONE of the following (Cluster takes priority over Sentinel)
  # Cluster mode (6-node, 3 primary + 3 replica):
  # REDIS_CLUSTER_HOSTS: "redis-cluster-0.redis-cluster.hopefx.svc.cluster.local:6379,redis-cluster-1.redis-cluster.hopefx.svc.cluster.local:6379,redis-cluster-2.redis-cluster.hopefx.svc.cluster.local:6379"
  # Sentinel mode (1 master + 2 replicas + 3 sentinels):
  REDIS_SENTINEL_HOSTS: "redis-sentinel-1.hopefx.svc.cluster.local:26379,redis-sentinel-2.hopefx.svc.cluster.local:26379,redis-sentinel-3.hopefx.svc.cluster.local:26379"
  REDIS_SENTINEL_MASTER: "hopefx-master"
  # Health check interval for Redis connection (seconds)
  REDIS_HEALTH_INTERVAL: "30"

  # API server
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "4"

  # Broker
  OANDA_PRACTICE: "false"
  BROKER_TYPE: "oanda"
  INITIAL_BALANCE: "100000"

  # Safety gates — these MUST be explicit in production to prevent silent
  # defaults from weakening invariant enforcement or trading on drifted models.
  # CRITICAL: HOPEFX_INVARIANT_MODE must be "enforce" when BROKER_TYPE != "paper".
  HOPEFX_INVARIANT_MODE: "enforce"
  # CRITICAL: DRIFT_BLOCK=true halts ML inference when feature distribution drifts
  # outside training bounds (Constitutional Rule 19 & 20).
  DRIFT_BLOCK: "true"
  DRIFT_Z_THRESHOLD: "3.0"
  # Block inference when the saved model is older than MODEL_MAX_AGE_DAYS.
  STALE_MODEL_BLOCK: "true"
  MODEL_MAX_AGE_DAYS: "30"

  # ML thresholds
  ML_MIN_TRADE_PROB: "0.58"

  # Risk limits
  RISK_MAX_DRAWDOWN_PCT: "0.10"
  RISK_MAX_DAILY_LOSS_PCT: "0.05"
  RISK_MAX_POSITION_SIZE_PCT: "0.02"

  # News blackout
  NEWS_BLACKOUT_BEFORE_MIN: "5"
  NEWS_BLACKOUT_AFTER_MIN: "5"

  # Observability
  LOG_LEVEL: "INFO"
  ENABLE_METRICS: "true"
  METRICS_PORT: "8000"

  # Feature flags
  FEATURE_TWO_FACTOR_AUTH: "true"
  FEATURE_WATCHLIST: "true"
  FEATURE_TRADE_JOURNAL: "true"
  FEATURE_BILLING_SUBSCRIPTION: "true"
  FEATURE_ADVANCED_TRADING: "true"
  FEATURE_PRICE_ALERTS: "true"

  # ── HOPEFXBrain — non-sensitive tuning ────────────────────────────────────
  # LLM backend selection: "anthropic" (default) | "openai"
  LLM_BACKEND: "anthropic"
  ANTHROPIC_MODEL: "claude-3-haiku-20240307"
  OPENAI_MODEL: "gpt-4o-mini"
  LLM_MAX_TOKENS: "512"
  # Flashpoint IOC feed URL (key is in secrets)
  FLASHPOINT_API_URL: "https://api.flashpoint.io/v1/iocs"
  # Brain loop intervals (seconds)
  BRAIN_SCAN_INTERVAL: "30"
  BRAIN_HEAL_INTERVAL: "1800"
  # Semantic encoder — disabled by default (requires PyTorch ~1 GB).
  # Set to "true" only on nodes with >=4 GB RAM and PyTorch pre-installed.
  BRAIN_SEMANTIC_ENCODER: "false"

# k8s/redis-cluster.yaml
# Redis Cluster — 6-node (3 primary + 3 replica) StatefulSet for production.
#
# Topology: 3 primaries handle separate key-space slots; each has 1 replica.
# Automatic failover: if a primary is unreachable for >5 s, its replica is
# promoted by cluster consensus (no Sentinel needed in cluster mode).
#
# Usage:
#   kubectl apply -f k8s/namespace.yaml
#   kubectl apply -f k8s/redis-cluster.yaml
#
# After pods are Running, initialise the cluster once:
#   kubectl exec -n hopefx redis-cluster-0 -- \
#     redis-cli --cluster create \
#       $(kubectl get pods -n hopefx -l app=redis-cluster \
#         -o jsonpath='{range .items[*]}{.status.podIP}:6379 {end}') \
#       --cluster-replicas 1 --cluster-yes -a $REDIS_PASSWORD
#
# App env vars:
#   REDIS_CLUSTER_HOSTS=redis-cluster-0.redis-cluster.hopefx.svc.cluster.local:6379,...
#   REDIS_PASSWORD=<from secret>
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: hopefx
  labels:
    app: redis-cluster
    app.kubernetes.io/part-of: hopefx-platform
spec:
  clusterIP: None   # headless — each pod gets its own DNS entry
  selector:
    app: redis-cluster
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: cluster-bus
      port: 16379
      targetPort: 16379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: hopefx
  labels:
    app: redis-cluster
    app.kubernetes.io/part-of: hopefx-platform
spec:
  serviceName: redis-cluster
  replicas: 6
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - /etc/redis/redis-cluster.conf
            - --requirepass
            - $(REDIS_PASSWORD)
            - --masterauth
            - $(REDIS_PASSWORD)
            - --cluster-announce-ip
            - $(POD_IP)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hopefx-secrets
                  key: REDIS_PASSWORD
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 6379
              name: redis
            - containerPort: 16379
              name: cluster-bus
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - $(REDIS_PASSWORD)
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - $(REDIS_PASSWORD)
                - cluster
                - info
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis
      volumes:
        - name: redis-config
          configMap:
            name: redis-cluster-config
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-config
  namespace: hopefx
data:
  redis-cluster.conf: |
    cluster-enabled yes
    cluster-config-file /data/nodes.conf
    cluster-node-timeout 5000
    cluster-require-full-coverage no
    cluster-migration-barrier 1
    appendonly yes
    appendfsync everysec
    save 60 1
    save 300 10
    maxmemory-policy allkeys-lru
    loglevel notice
    logfile ""
    bind 0.0.0.0
    protected-mode no

# redis/sentinel.conf
# Redis Sentinel configuration for HOPEFX high-availability setup.
#
# Three Sentinel instances monitor one Redis master + two replicas.
# Sentinel handles automatic failover: when the master is unreachable for
# more than `down-after-milliseconds`, it promotes the best replica.
#
# Usage (docker compose):
#   docker compose -f docker-compose.yml -f docker-compose.sentinel.yml up -d
#
# Quorum: 2 — at least 2 of 3 Sentinels must agree before failover triggers.
# This prevents split-brain on network partitions.

# Monitor the master named "hopefx-master" at redis-master:6379
# Quorum = 2 (majority of 3 sentinels)
sentinel monitor hopefx-master redis-master 6379 2

# Sentinel auth password (must match requirepass in redis-master.conf)
# Set via REDIS_PASSWORD env var at runtime — placeholder replaced by entrypoint
sentinel auth-pass hopefx-master REDIS_SENTINEL_PASSWORD_PLACEHOLDER

# Mark master as down after 5 s of no response
sentinel down-after-milliseconds hopefx-master 5000

# Allow at most 1 replica to sync from new master simultaneously
sentinel parallel-syncs hopefx-master 1

# Failover timeout: 30 s before retrying a failed failover
sentinel failover-timeout hopefx-master 30000

# Announce Sentinel's own address (required in Docker networks)
# Overridden per-instance via SENTINEL_ANNOUNCE_IP env var
# sentinel announce-ip <ip>
# sentinel announce-port 26379

# Log to stdout (Docker-friendly)
loglevel notice
logfile ""

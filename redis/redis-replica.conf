# redis/redis-replica.conf
# Redis replica node configuration.
# Loaded by redis-replica-1 and redis-replica-2 in docker-compose.sentinel.yml.

bind 0.0.0.0

# Auth
requirepass REDIS_PASSWORD_PLACEHOLDER
masterauth REDIS_PASSWORD_PLACEHOLDER

# Replicate from master (Sentinel will update this on failover)
replicaof redis-master 6379

# Replicas are read-only by default — do not change this
replica-read-only yes

# Persistence on replicas too — allows replica promotion without data loss
appendonly yes
appendfsync everysec
save 60 1

loglevel notice
logfile ""

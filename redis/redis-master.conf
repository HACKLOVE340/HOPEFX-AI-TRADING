# redis/redis-master.conf
# Redis master node configuration.
# Loaded by the redis-master service in docker-compose.sentinel.yml.

# Bind to all interfaces inside the Docker network
bind 0.0.0.0

# Auth — value injected at runtime via REDIS_PASSWORD env var
# The entrypoint script replaces REDIS_PASSWORD_PLACEHOLDER before starting.
requirepass REDIS_PASSWORD_PLACEHOLDER

# Replicas must authenticate with the same password
masterauth REDIS_PASSWORD_PLACEHOLDER

# Persistence: AOF for durability, RDB for fast restarts
appendonly yes
appendfsync everysec
save 60 1
save 300 10

# Memory cap — prevents OOM kills on a VPS with limited RAM.
# allkeys-lru evicts the least-recently-used key when the cap is reached.
# Set REDIS_MAXMEMORY env var to override (e.g. 1gb for a 4 GB VPS).
maxmemory ${REDIS_MAXMEMORY:-512mb}
maxmemory-policy allkeys-lru

loglevel notice
logfile ""

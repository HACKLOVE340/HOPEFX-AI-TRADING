<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOPEFX — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e0e6ed;
    }
    .card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo h1 { font-size: 26px; font-weight: 700; color: #00d4ff; letter-spacing: 1px; }
    .logo p  { font-size: 13px; color: #8892b0; margin-top: 4px; }
    label { display: block; font-size: 13px; color: #8892b0; margin-bottom: 6px; font-weight: 500; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 11px 14px;
      background: #0f1419; border: 1px solid #2d3748;
      border-radius: 6px; color: #e0e6ed; font-size: 14px;
      outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #00d4ff; }
    .field { margin-bottom: 18px; }
    .btn {
      width: 100%; padding: 12px;
      background: #00d4ff; color: #0a0e1a;
      border: none; border-radius: 6px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; transition: background 0.2s, opacity 0.2s; margin-top: 4px;
    }
    .btn:hover:not(:disabled) { background: #00b8d9; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .error-box {
      background: rgba(255,23,68,0.12); border: 1px solid rgba(255,23,68,0.4);
      border-radius: 6px; padding: 10px 14px; font-size: 13px;
      color: #ff5370; margin-bottom: 16px; display: none;
    }
    .error-box.visible { display: block; }
    .success-box {
      background: rgba(0,200,83,0.12); border: 1px solid rgba(0,200,83,0.4);
      border-radius: 6px; padding: 10px 14px; font-size: 13px;
      color: #00c853; margin-bottom: 16px; display: none;
    }
    .success-box.visible { display: block; }
    .links { text-align: center; margin-top: 20px; font-size: 13px; color: #8892b0; }
    .links a { color: #00d4ff; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(10,14,26,0.4); border-top-color: #0a0e1a;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>HOPEFX</h1>
      <p>AI-Powered Trading Platform</p>
    </div>
    <div class="error-box"   id="errorBox"></div>
    <div class="success-box" id="successBox"></div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               placeholder="admin@hopefx.io" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn" id="submitBtn">Log in</button>
    </form>
    <div class="links">
      <a href="/docs">API Docs</a> &nbsp;·&nbsp; <a href="/health">System Status</a>
    </div>
  </div>
  <script>
    const form      = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox  = document.getElementById('errorBox');
    const successBox= document.getElementById('successBox');

    function showError(msg)   { errorBox.textContent=msg; errorBox.classList.add('visible'); successBox.classList.remove('visible'); }
    function showSuccess(msg) { successBox.textContent=msg; successBox.classList.add('visible'); errorBox.classList.remove('visible'); }
    function setLoading(on)   { submitBtn.disabled=on; submitBtn.innerHTML=on?'<span class="spinner"></span>Logging in…':'Log in'; }

    // Decode JWT payload (no signature verification — server validates on every request)
    function decodeJwtRole(token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
        return payload.role || 'user';
      } catch { return 'user'; }
    }

    // Role-based redirect: superadmin → /api/superadmin/, admin → /api/admin/, others → /paper-trading
    function roleRedirect(token, explicitNext) {
      if (explicitNext) { window.location.replace(explicitNext); return; }
      const role = decodeJwtRole(token);
      if (role === 'superadmin') { window.location.replace('/api/superadmin/'); return; }
      if (role === 'admin')      { window.location.replace('/api/admin/');      return; }
      window.location.replace('/paper-trading');
    }

    // Skip login if already authenticated — but verify the token is still valid first
    const existingToken = localStorage.getItem('hopefx_access_token');
    if (existingToken) {
      const params = new URLSearchParams(window.location.search);
      // Quick server-side check: if the token is rejected (401), clear it and stay on login
      fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + existingToken } })
        .then(r => {
          if (r.ok) {
            roleRedirect(existingToken, params.get('next'));
          } else {
            // Token is invalid/expired — clear stale credentials and let user log in fresh
            localStorage.removeItem('hopefx_access_token');
            localStorage.removeItem('hopefx_refresh_token');
            localStorage.removeItem('hopefx_user');
          }
        })
        .catch(() => {
          // Network error — clear token and let user retry
          localStorage.removeItem('hopefx_access_token');
          localStorage.removeItem('hopefx_refresh_token');
          localStorage.removeItem('hopefx_user');
        });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('visible');
      successBox.classList.remove('visible');
      const email    = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      if (!email || !password) { showError('Please enter your email and password.'); return; }
      setLoading(true);
      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        let data;
        try { data = await res.json(); } catch { data = {}; }
        if (res.ok && data.access_token) {
          localStorage.setItem('hopefx_access_token',  data.access_token);
          localStorage.setItem('hopefx_refresh_token', data.refresh_token || '');
          localStorage.setItem('hopefx_user',          JSON.stringify(data.user || {}));
          showSuccess('Login successful — redirecting…');
          const params = new URLSearchParams(window.location.search);
          setTimeout(() => roleRedirect(data.access_token, params.get('next')), 400);
        } else {
          showError(data.detail || data.message || 'Invalid credentials.');
          setLoading(false);
        }
      } catch (err) {
        showError('Network error — is the server running? (' + err.message + ')');
        setLoading(false);
      }
    });
  </script>
</body>
</html>

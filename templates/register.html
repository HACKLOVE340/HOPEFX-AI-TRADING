<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOPEFX — Create Account</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e0e6ed;
    }
    .card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo h1 { font-size: 26px; font-weight: 700; color: #00d4ff; letter-spacing: 1px; }
    .logo p  { font-size: 13px; color: #8892b0; margin-top: 4px; }
    label { display: block; font-size: 13px; color: #8892b0; margin-bottom: 6px; font-weight: 500; }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%; padding: 11px 14px;
      background: #0f1419; border: 1px solid #2d3748;
      border-radius: 6px; color: #e0e6ed; font-size: 14px;
      outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #00d4ff; }
    .field { margin-bottom: 16px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      width: 100%; padding: 12px;
      background: #00d4ff; color: #0a0e1a;
      border: none; border-radius: 6px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; transition: background 0.2s, opacity 0.2s; margin-top: 4px;
    }
    .btn:hover:not(:disabled) { background: #00b8d9; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .error-box {
      background: rgba(255,23,68,0.12); border: 1px solid rgba(255,23,68,0.4);
      border-radius: 6px; padding: 10px 14px; font-size: 13px;
      color: #ff5370; margin-bottom: 16px; display: none;
    }
    .error-box.visible { display: block; }
    .success-box {
      background: rgba(0,200,83,0.12); border: 1px solid rgba(0,200,83,0.4);
      border-radius: 6px; padding: 10px 14px; font-size: 13px;
      color: #00c853; margin-bottom: 16px; display: none;
    }
    .success-box.visible { display: block; }
    .links { text-align: center; margin-top: 20px; font-size: 13px; color: #8892b0; }
    .links a { color: #00d4ff; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .terms { font-size: 12px; color: #8892b0; text-align: center; margin-top: 14px; line-height: 1.5; }
    .terms a { color: #00d4ff; text-decoration: none; }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(10,14,26,0.4); border-top-color: #0a0e1a;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .strength-bar { height: 4px; border-radius: 2px; margin-top: 6px; background: #2d3748; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>HOPEFX</h1>
      <p>Create your trading account</p>
    </div>
    <div class="error-box"   id="errorBox"></div>
    <div class="success-box" id="successBox"></div>
    <form id="registerForm" novalidate>
      <div class="row">
        <div class="field">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="first_name" placeholder="Jane" autocomplete="given-name" required />
        </div>
        <div class="field">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="last_name" placeholder="Doe" autocomplete="family-name" required />
        </div>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="jane@example.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Min. 8 characters" autocomplete="new-password" required />
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirm_password" placeholder="Repeat password" autocomplete="new-password" required />
      </div>
      <button type="submit" class="btn" id="submitBtn">Create Account</button>
    </form>
    <p class="terms">
      By registering you agree to our
      <a href="/security">Security Policy</a> and
      <a href="/affiliate">Terms of Service</a>.
    </p>
    <div class="links">
      Already have an account? <a href="/login">Log in</a>
    </div>
  </div>
  <script>
    const form         = document.getElementById('registerForm');
    const submitBtn    = document.getElementById('submitBtn');
    const errorBox     = document.getElementById('errorBox');
    const successBox   = document.getElementById('successBox');
    const pwdInput     = document.getElementById('password');
    const strengthFill = document.getElementById('strengthFill');

    function showError(msg)   { errorBox.textContent=msg; errorBox.classList.add('visible'); successBox.classList.remove('visible'); }
    function showSuccess(msg) { successBox.textContent=msg; successBox.classList.add('visible'); errorBox.classList.remove('visible'); }
    function setLoading(on)   { submitBtn.disabled=on; submitBtn.innerHTML=on?'<span class="spinner"></span>Creating account…':'Create Account'; }

    // Redirect if already authenticated
    if (localStorage.getItem('hopefx_access_token')) {
      window.location.replace('/paper-trading');
    }

    pwdInput.addEventListener('input', () => {
      const v = pwdInput.value;
      let score = 0;
      if (v.length >= 8)  score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;
      const pct = (score / 4) * 100;
      const colors = ['#ff5370','#ffb300','#00e676','#00d4ff'];
      strengthFill.style.width  = pct + '%';
      strengthFill.style.background = colors[score - 1] || '#2d3748';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('visible');
      successBox.classList.remove('visible');

      const firstName = document.getElementById('firstName').value.trim();
      const lastName  = document.getElementById('lastName').value.trim();
      const email     = document.getElementById('email').value.trim().toLowerCase();
      const password  = document.getElementById('password').value;
      const confirm   = document.getElementById('confirmPassword').value;

      if (!firstName || !lastName) { showError('Please enter your full name.'); return; }
      if (!email)    { showError('Please enter a valid email address.'); return; }
      if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
      if (password !== confirm) { showError('Passwords do not match.'); return; }

      setLoading(true);
      try {
        const res  = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, first_name: firstName, last_name: lastName }),
        });
        let data;
        try { data = await res.json(); } catch { data = {}; }
        if (res.ok) {
          showSuccess('Account created! Check your email to verify, then log in.');
          setTimeout(() => window.location.replace('/login'), 2500);
        } else {
          showError(data.detail || data.message || 'Registration failed. Please try again.');
          setLoading(false);
        }
      } catch (err) {
        showError('Network error — is the server running? (' + err.message + ')');
        setLoading(false);
      }
    });
  </script>
</body>
</html>

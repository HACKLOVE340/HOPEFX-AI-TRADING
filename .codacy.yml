---
# Codacy configuration — focused on security issues only.
# Noisy metric tools (radon, duplication, prospector, fixme) are disabled.
# Pylint is disabled in favour of ruff (enforced in CI / pre-commit).
# This keeps the Codacy issue count focused on actionable security findings.
engines:
  duplication:
    enabled: false
  fixme:
    enabled: false
  radon:
    enabled: false
  bandit:
    enabled: true
  pylint:
    enabled: false
  prospector:
    enabled: false

exclude_paths:
  # Test code — assert / magic numbers / hardcoded values are expected
  - "tests/**"
  - "conftest.py"
  # Generated / vendored / non-production artefacts
  - "**/__pycache__/**"
  - "**/venv/**"
  - "**/.venv/**"
  - "**/build/**"
  - "**/dist/**"
  - "**/*.egg-info/**"
  - "alembic/**"
  - "migrations/**"
  # Documentation and configuration only
  - "docs/**"
  - "*.md"
  - "frontend/**"
  - "node_modules/**"
  # Example / research / notebook files
  - "examples/**"
  - "research/**"
  - "notebooks/**"
  # Deployment manifests — not executed Python
  - "helm/**"
  - "k8s/**"
  - "deployment/**"
  # Lock files
  - "requirements.lock"

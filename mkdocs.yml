site_name: HOPEFX Documentation
site_description: AI-powered gold and forex trading platform — guides, API reference, and tutorials.
site_url: https://docs.hopefx.io
repo_url: https://github.com/HACKLOVE340/HOPEFX-AI-TRADING
repo_name: HOPEFX-AI-TRADING
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/banner.svg
  favicon: assets/banner.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HACKLOVE340/HOPEFX-AI-TRADING
  analytics:
    provider: google
    property: G-XXXXXXXXXX   # replace with real GA4 property

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
    - Installation: INSTALLATION.md
    - Quick Start: QUICKSTART.md
    - OANDA Paper Trading: oanda_paper_trading_setup.md
    - Live Trading Gate (30-day): live_trading_gate.md
  - Guides:
    - API Guide: API_GUIDE.md
    - Order Flow: ORDER_FLOW_GUIDE.md
    - Sample Strategies: SAMPLE_STRATEGIES.md
    - Mobile Guide: MOBILE_GUIDE.md
    - Asset Diversification: ASSET_DIVERSIFICATION.md
    - Monetization: MONETIZATION.md
    - Community: COMMUNITY.md
  - Model Performance: model_performance.md
  - API Reference: API_REFERENCE.md
  - CI/CD Pipeline: ci_cd_pipeline.md
  - FAQ: FAQ.md
  - Contributing: CONTRIBUTING.md
  - Security: SECURITY.md
  - Debugging: DEBUGGING.md
  - Deployment: DEPLOYMENT.md

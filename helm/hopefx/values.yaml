# helm/hopefx/values.yaml
# Override any value with: helm install hopefx . -f my-values.yaml

replicaCount: 1

image:
  repository: hopefx/trading-engine
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

# ── FastAPI service ──────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 8000

# ── Trading engine (core/main_loop.py) ───────────────────────────────────────
# replicaCount: 2 enables hot-standby mode.
# HotStandbyReplicator uses Redis SET NX leader election so only one pod
# executes trades at a time. The second pod monitors the primary heartbeat
# and promotes itself automatically if the primary misses
# STANDBY_HEARTBEAT_MISS_THRESHOLD consecutive beats (default: 3 × 5s = 15s).
#
# STANDBY_ROLE=auto  — each pod resolves its own role at startup via Redis.
# Set STANDBY_POD_ID to the pod name (e.g. via Downward API) so heartbeat
# keys are unique per pod.
trading:
  enabled: true
  replicaCount: 2
  command: ["python", "-m", "core.main_loop"]
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# ── Redis sidecar ────────────────────────────────────────────────────────────
redis:
  image: redis:7-alpine
  port: 6379
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

# ── Persistent storage (models + SQLite DB) ──────────────────────────────────
persistence:
  enabled: true
  storageClass: ""          # "" = cluster default
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /app/data

# ── Resource requests/limits for the trading pod ────────────────────────────
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2000m"
    memory: "2Gi"

# ── Environment variables (non-sensitive) ────────────────────────────────────
env:
  LOG_LEVEL: "INFO"
  TRADING_MODE: "paper"          # paper | live
  REDIS_URL: "redis://localhost:6379/0"
  DB_PATH: "/app/data/hopefx.db"
  PROP_FIRM_CONFIG: "/app/data/prop_firm_mode.json"
  ML_MODEL_DIR: "/app/data/models"
  # Safety: paper trading by default — override to "false" for live
  OANDA_PRACTICE: "true"
  # Connector hub tuning
  ML_MIN_TRADE_PROB: "0.58"
  STRATEGY_MIN_BARS: "100"
  STRATEGY_TICKS_PER_BAR: "10"
  RISK_MAX_DAILY_LOSS_PCT: "0.05"
  RISK_MAX_DRAWDOWN_PCT: "0.10"
  FIX_CONFIG_FILE: "/app/fix.cfg"
  # Hot-standby replication (resilience/hot_standby.py)
  # STANDBY_POD_ID is set per-pod via the Kubernetes Downward API
  # (see templates/deployment.yaml fieldRef: metadata.name).
  STANDBY_ROLE: "auto"
  STANDBY_HEARTBEAT_INTERVAL_S: "5"
  STANDBY_HEARTBEAT_MISS_THRESHOLD: "3"
  STANDBY_LEADER_TTL_S: "15"
  STANDBY_STATE_INTERVAL_S: "1"
  STANDBY_FILLS_RING_SIZE: "500"
  # HOPEFXBrain — security engine tuning (non-sensitive)
  LLM_BACKEND: "anthropic"
  ANTHROPIC_MODEL: "claude-3-haiku-20240307"
  OPENAI_MODEL: "gpt-4o-mini"
  LLM_MAX_TOKENS: "512"
  BRAIN_SCAN_INTERVAL: "30"
  BRAIN_HEAL_INTERVAL: "1800"
  FLASHPOINT_API_URL: "https://api.flashpoint.io/v1/iocs"
  # Semantic encoder — disabled by default (requires PyTorch ~1 GB).
  # Set to "true" only on nodes with >=4 GB RAM and PyTorch pre-installed.
  BRAIN_SEMANTIC_ENCODER: "false"

# ── Secret references (values injected at deploy time) ───────────────────────
# Set these via: helm install hopefx . --set secrets.OANDA_API_KEY=xxx
# Or use an external secrets manager (Vault, AWS Secrets Manager, etc.)
# Never commit real values here — all entries default to empty string.
secrets:
  OANDA_API_KEY: ""
  OANDA_ACCOUNT_ID: ""
  BINANCE_API_KEY: ""
  BINANCE_SECRET: ""
  MT5_LOGIN: ""
  MT5_PASSWORD: ""
  MT5_SERVER: ""
  STRIPE_SECRET_KEY: ""
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""
  OPENAI_API_KEY: ""
  FIX_USERNAME: ""
  FIX_PASSWORD: ""
  # ── HOPEFXBrain secrets ──────────────────────────────────────────────────
  # LLM API keys — set exactly one depending on LLM_BACKEND
  ANTHROPIC_API_KEY: ""       # https://console.anthropic.com/settings/keys
  # OPENAI_API_KEY already listed above — shared with AI Chat feature
  # Flashpoint threat intelligence (optional)
  FLASHPOINT_API_KEY: ""      # https://flashpoint.io/
  # ArgoCD rollback webhook URL (optional — nuclear lockdown auto-rollback)
  ARGOCD_ROLLBACK_WEBHOOK: "" # https://<argocd-server>/api/v1/applications/hopefx/sync

# ── Liveness / readiness / startup probes ────────────────────────────────────
# liveness  → restart pod if it stops responding
# readiness → remove pod from LB until it passes (successThreshold: 2)
# startup   → give slow cold-starts up to 60 s before liveness kicks in
probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /ready
    initialDelaySeconds: 10
    periodSeconds: 5

# ── Horizontal Pod Autoscaler ────────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}

# ── Pod / container security ─────────────────────────────────────────────────
# Applied to both the main API deployment and the trading-engine deployment.
# readOnlyRootFilesystem: true — containers write only to explicitly mounted
# volumes (emptyDir or PVC).  If your image writes to /tmp at startup, add an
# emptyDir volume mounted at /tmp.
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

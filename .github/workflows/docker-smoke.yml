name: Docker Compose Smoke Test

# Verify that the full stack (postgres + redis + app) reaches healthy state
# from a clean build.  Catches:
#   - Image build failures (missing deps, broken Dockerfile)
#   - Migration failures (alembic upgrade head)
#   - App startup failures (bad env var defaults, import errors)
#   - Redis connectivity issues (TLS default misconfiguration)
#   - Health endpoint regressions (/api/health/live)
#
# This job runs on every push to main/develop and on every PR targeting main.
# It is intentionally separate from the unit/integration test job so a Docker
# build failure does not block coverage reporting.

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "frontend/**"
      - "dashboard/**"
      - "mobile/**"
      - "mobile-app/**"
      - "helm/**"
      - "k8s/**"
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "frontend/**"
      - "dashboard/**"
      - "mobile/**"
      - "mobile-app/**"
      - "helm/**"
      - "k8s/**"
      - "docs/**"
      - "*.md"

concurrency:
  group: docker-smoke-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Stack smoke test (postgres + redis + app)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # ── Build layer cache ──────────────────────────────────────────────────
      # Cache the Docker build context so repeated pushes don't rebuild from
      # scratch.  The cache key includes the Dockerfile and requirements files
      # so it is invalidated when dependencies change.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'requirements.txt', 'requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # ── Generate minimal .env for smoke test ──────────────────────────────
      # Satisfies the :?required variable checks in docker-compose.yml so
      # Docker Compose can interpolate the config before the smoke override
      # environment: block takes effect (e.g. REDIS_PASSWORD in redis.command).
      #
      # Two secret scanners see this step, and they need the pragma in
      # different places:
      #   - scripts/check_secrets.sh reads raw file lines, so every credential
      #     line inside the heredoc carries its own pragma (stripped back out
      #     before the value reaches .env — see the sed below).
      #   - detect-secrets runs a YAML transformer first, which collapses this
      #     whole block scalar into a single value attributed to the `run:`
      #     line. Pragmas inside the heredoc are invisible to it; the one on
      #     the block-scalar header below is the only one it can see.
      - name: Generate minimal CI .env
        run: |  # pragma: allowlist secret
          cat > .env <<'EOF'
          POSTGRES_USER=hopefx
          POSTGRES_PASSWORD=ci_smoke_password  # pragma: allowlist secret
          POSTGRES_DB=hopefx
          REDIS_PASSWORD=ci-smoke-redis-password  # pragma: allowlist secret
          SECURITY_JWT_SECRET=ci-smoke-test-jwt-secret-minimum-32-chars!!  # pragma: allowlist secret
          CONFIG_ENCRYPTION_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa  # pragma: allowlist secret
          CONFIG_SALT=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          HOPEFX_KILL_SWITCH_TOKEN=ci-smoke-kill-switch-token-64-chars-placeholder-value-here!!
          HOPEFX_DOMAIN=localhost
          APP_BASE_URL=http://localhost
          APP_ENV=production
          PAPER_TRADING=true
          IS_FORCE_TLS=false
          REDIS_FORCE_TLS=false
          ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
          BOOTSTRAP_SUPERADMIN_PASSWORD=ci-smoke-superadmin-pw  # pragma: allowlist secret
          BOOTSTRAP_ADMIN_PASSWORD=ci-smoke-admin-pw  # pragma: allowlist secret
          BOOTSTRAP_TRADER_PASSWORD=ci-smoke-trader-pw  # pragma: allowlist secret
          GRAFANA_ADMIN_PASSWORD=ci-smoke-grafana-placeholder
          ALERTMANAGER_SMTP_FROM=ci@localhost
          ALERTMANAGER_SMTP_TO=ci@localhost
          ALERTMANAGER_SMTP_HOST=localhost:587
          ALERTMANAGER_SMTP_USERNAME=ci
          ALERTMANAGER_SMTP_PASSWORD=ci-placeholder
          ANTHROPIC_API_KEY=ci-placeholder
          OPENAI_API_KEY=ci-placeholder
          SENTRY_DSN=
          BROKER_TYPE=paper
          BRAIN_SEMANTIC_ENCODER=false
          CME_ENABLED=false
          CPP_SHIM_ENABLED=false
          STARTUP_GATE=false
          EOF
          # Strip leading whitespace added by the heredoc indentation
          sed -i 's/^[[:space:]]*//' .env
          # Strip the allowlist pragmas. They mark these values as known CI
          # placeholders for scripts/check_secrets.sh, which scans staged files
          # and would otherwise block any edit to this workflow on lines that
          # have been here since it was written. Compose does not strip inline
          # comments from an env_file, so leaving them in would make the
          # password literally "ci_smoke_password  # pragma: allowlist secret".
          sed -i 's/[[:space:]]*#[[:space:]]*pragma:[[:space:]]*allowlist[[:space:]]*secret[[:space:]]*$//' .env
          echo "Generated .env with $(wc -l < .env) entries."

      # ── Start the minimal stack ────────────────────────────────────────────
      # --wait: block until all non-disabled services report healthy, or until
      # the timeout is reached (docker compose exits non-zero on timeout).
      # --wait-timeout: 300 s gives the app container time to run alembic
      # migrations and complete its startup sequence.
      - name: Start stack (postgres + redis + app)
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.smoke.yml \
            up \
            --build \
            --wait \
            --wait-timeout 300 \
            --remove-orphans
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
          # Pass build cache through BuildKit
          BUILDX_CACHE_FROM: "type=local,src=/tmp/.buildx-cache"
          BUILDX_CACHE_TO: "type=local,dest=/tmp/.buildx-cache-new,mode=max"

      # ── Assert service health ──────────────────────────────────────────────
      - name: Assert postgres is healthy
        run: |
          STATUS=$(docker compose \
            -f docker-compose.yml \
            -f docker-compose.smoke.yml \
            ps --format json postgres \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('Health','') if isinstance(d,list) else d.get('Health',''))" 2>/dev/null || echo "unknown")
          echo "postgres health: $STATUS"
          [ "$STATUS" = "healthy" ] || (echo "ERROR: postgres did not reach healthy state" && exit 1)

      - name: Assert redis is healthy
        run: |
          STATUS=$(docker compose \
            -f docker-compose.yml \
            -f docker-compose.smoke.yml \
            ps --format json redis \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('Health','') if isinstance(d,list) else d.get('Health',''))" 2>/dev/null || echo "unknown")
          echo "redis health: $STATUS"
          [ "$STATUS" = "healthy" ] || (echo "ERROR: redis did not reach healthy state" && exit 1)

      - name: Assert app is healthy
        run: |
          STATUS=$(docker compose \
            -f docker-compose.yml \
            -f docker-compose.smoke.yml \
            ps --format json app \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('Health','') if isinstance(d,list) else d.get('Health',''))" 2>/dev/null || echo "unknown")
          echo "app health: $STATUS"
          [ "$STATUS" = "healthy" ] || (echo "ERROR: app did not reach healthy state" && exit 1)

      # ── Functional API tests ──────────────────────────────────────────────
      # Hit real endpoints from the runner to confirm the app is serving
      # correct HTTP responses — not just that the process is alive.
      #
      # Tests performed (in order):
      #   1. GET /api/health/live        — liveness probe returns {"status":"alive"}
      #   2. GET /api/health/ready       — readiness probe returns {"status":"ready"}
      #   3. POST /api/auth/register     — new user registration returns 200/201
      #   4. POST /api/auth/login        — login returns access + refresh tokens
      #   5. GET /api/auth/me            — authenticated profile fetch returns user data
      #   6. GET /api/status/paper-trading/gate — paper-trading gate returns phase2_ready
      #   7. GET /api/signals/latest     — signal endpoint returns a list (may be empty)
      #   8. POST /api/auth/logout       — logout returns 200 and clears session
      #
      # Each test uses the access token from step 4 where auth is required.
      # Failures print the full response body for debugging.

      - name: Functional API smoke tests
        run: |
          # ── Resolve app port ────────────────────────────────────────────────
          APP_PORT=$(docker compose \
            -f docker-compose.yml \
            -f docker-compose.smoke.yml \
            port app 8000 | cut -d: -f2)
          echo "App mapped to host port: $APP_PORT"
          BASE="http://localhost:${APP_PORT}"

          # ── Helper: retry curl until success or give up ─────────────────────
          curl_retry() {
            local url="$1"; shift
            for i in $(seq 1 12); do
              HTTP_CODE=$(curl -s -o /tmp/smoke_body -w "%{http_code}" "$@" "$url" 2>/dev/null)
              BODY=$(cat /tmp/smoke_body)
              [ "$HTTP_CODE" != "000" ] && echo "$HTTP_CODE" && return 0
              echo "Attempt $i: no response from $url, retrying in 5s..." >&2
              sleep 5
            done
            echo "000"
          }

          FAIL=0

          # ── 1. Liveness probe ───────────────────────────────────────────────
          echo "--- Test 1: GET /api/health/live ---"
          CODE=$(curl_retry "${BASE}/api/health/live")
          BODY=$(cat /tmp/smoke_body)
          echo "HTTP $CODE  body: $BODY"
          if [ "$CODE" != "200" ]; then
            echo "FAIL: expected 200, got $CODE"; FAIL=1
          else
            echo "$BODY" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          assert d.get('status') in ('alive','ok','healthy'), f'bad status: {d}'
          print('PASS: liveness probe')
          " || FAIL=1
          fi

          # ── Wait for startup to finish ──────────────────────────────────────
          # app.py runs startup_event() as a background task so the lifespan
          # yields immediately — the app answers /health/live long before the
          # component registry, the async DB pool and the auth service exist.
          # curl_retry only retries on a connection failure (000), so a 503 from
          # a half-initialised app counts as an answer and every assertion below
          # ran against it: readiness 503, login 503 "Auth service not
          # initialised". Wait for readiness to actually go green first.
          echo "--- Waiting for /api/health/ready (max 120s) ---"
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /tmp/smoke_body -w "%{http_code}" "${BASE}/api/health/ready" 2>/dev/null)
            if [ "$CODE" = "200" ]; then
              echo "Ready after ~$((i * 5))s."
              break
            fi
            echo "  attempt ${i}/24: HTTP ${CODE} — $(head -c 220 /tmp/smoke_body)"
            sleep 5
          done

          # ── 2. Readiness probe ──────────────────────────────────────────────
          echo "--- Test 2: GET /api/health/ready ---"
          CODE=$(curl_retry "${BASE}/api/health/ready")
          BODY=$(cat /tmp/smoke_body)
          echo "HTTP $CODE  body: $BODY"
          if [ "$CODE" != "200" ]; then
            echo "FAIL: expected 200, got $CODE"; FAIL=1
          else
            echo "$BODY" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          assert d.get('status') in ('ready','ok','healthy'), f'bad status: {d}'
          print('PASS: readiness probe')
          " || FAIL=1
          fi

          # ── 3. Register a test user ─────────────────────────────────────────
          echo "--- Test 3: POST /api/auth/register ---"
          # Not a .test/.invalid/.local domain: email-validator rejects the
          # RFC 6761 special-use names outright, so registration 422s before
          # the endpoint is exercised at all. example.com is reserved by
          # RFC 2606 and accepted by the validator.
          SMOKE_USER="smoke_$(date +%s)@ci-smoke.example.com"
          SMOKE_PASS="SmokeTest@CI2025!"
          REG_BODY=$(cat <<JSON
          {"email":"${SMOKE_USER}","username":"smoke_ci_$(date +%s)","password":"${SMOKE_PASS}","full_name":"CI Smoke"}
          JSON
          )
          CODE=$(curl_retry "${BASE}/api/auth/register" \
            -X POST -H "Content-Type: application/json" -d "$REG_BODY")
          BODY=$(cat /tmp/smoke_body)
          echo "HTTP $CODE  body: ${BODY:0:200}"
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "FAIL: expected 200/201, got $CODE"; FAIL=1
          else
            echo "PASS: registration"
          fi

          # ── 4. Login ────────────────────────────────────────────────────────
          echo "--- Test 4: POST /api/auth/login ---"
          LOGIN_BODY=$(cat <<JSON
          {"username":"${SMOKE_USER}","password":"${SMOKE_PASS}"}
          JSON
          )
          CODE=$(curl_retry "${BASE}/api/auth/login" \
            -X POST -H "Content-Type: application/json" -d "$LOGIN_BODY")
          BODY=$(cat /tmp/smoke_body)
          echo "HTTP $CODE  body: ${BODY:0:200}"
          ACCESS_TOKEN=""
          if [ "$CODE" != "200" ]; then
            echo "FAIL: expected 200, got $CODE"; FAIL=1
          else
            ACCESS_TOKEN=$(echo "$BODY" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          t=d.get('access_token') or d.get('token','')
          print(t)
          " 2>/dev/null || echo "")
            if [ -z "$ACCESS_TOKEN" ]; then
              echo "FAIL: no access_token in login response"; FAIL=1
            else
              echo "PASS: login (token length=${#ACCESS_TOKEN})"
            fi
          fi

          # ── 5. Authenticated profile fetch ──────────────────────────────────
          echo "--- Test 5: GET /api/auth/me ---"
          if [ -n "$ACCESS_TOKEN" ]; then
            CODE=$(curl_retry "${BASE}/api/auth/me" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}")
            BODY=$(cat /tmp/smoke_body)
            echo "HTTP $CODE  body: ${BODY:0:200}"
            if [ "$CODE" != "200" ]; then
              echo "FAIL: expected 200, got $CODE"; FAIL=1
            else
              echo "$BODY" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          assert 'email' in d or 'username' in d or 'sub' in d, f'no user fields: {d}'
          print('PASS: /api/auth/me')
          " || FAIL=1
            fi
          else
            echo "SKIP: no access token from login"
          fi

          # ── 6. Paper-trading gate ───────────────────────────────────────────
          echo "--- Test 6: GET /api/status/paper-trading/gate ---"
          CODE=$(curl_retry "${BASE}/api/status/paper-trading/gate")
          BODY=$(cat /tmp/smoke_body)
          echo "HTTP $CODE  body: ${BODY:0:200}"
          if [ "$CODE" != "200" ]; then
            echo "FAIL: expected 200, got $CODE"; FAIL=1
          else
            echo "$BODY" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          assert 'phase2_ready' in d, f'missing phase2_ready: {d}'
          print(f'PASS: paper-trading gate (phase2_ready={d[\"phase2_ready\"]})')
          " || FAIL=1
          fi

          # ── 7. Signals endpoint ─────────────────────────────────────────────
          echo "--- Test 7: GET /api/signals/latest ---"
          if [ -n "$ACCESS_TOKEN" ]; then
            CODE=$(curl_retry "${BASE}/api/signals/latest" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}")
            BODY=$(cat /tmp/smoke_body)
            echo "HTTP $CODE  body: ${BODY:0:200}"
            if [ "$CODE" != "200" ]; then
              echo "FAIL: expected 200, got $CODE"; FAIL=1
            else
              echo "$BODY" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          # Accept list or dict with signals key — may be empty in CI
          assert isinstance(d,(list,dict)), f'unexpected type: {type(d)}'
          print('PASS: /api/signals/latest')
          " || FAIL=1
            fi
          else
            echo "SKIP: no access token from login"
          fi

          # ── 8. Logout ───────────────────────────────────────────────────────
          echo "--- Test 8: POST /api/auth/logout ---"
          if [ -n "$ACCESS_TOKEN" ]; then
            CODE=$(curl_retry "${BASE}/api/auth/logout" \
              -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}")
            BODY=$(cat /tmp/smoke_body)
            echo "HTTP $CODE  body: ${BODY:0:200}"
            if [ "$CODE" != "200" ]; then
              echo "FAIL: expected 200, got $CODE"; FAIL=1
            else
              echo "PASS: logout"
            fi
          else
            echo "SKIP: no access token from login"
          fi

          # ── Summary ─────────────────────────────────────────────────────────
          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "ERROR: one or more functional API smoke tests failed."
            exit 1
          fi
          echo ""
          echo "All functional API smoke tests passed."

      # ── Collect logs on failure ────────────────────────────────────────────
      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== postgres logs ==="
          docker compose -f docker-compose.yml -f docker-compose.smoke.yml logs postgres --tail=50 || true
          echo "=== redis logs ==="
          docker compose -f docker-compose.yml -f docker-compose.smoke.yml logs redis --tail=50 || true
          # 100 lines was not enough: the app emits hundreds of startup lines,
          # so the tail showed only the request handling and cut off the
          # component-registry sequence — which is exactly where a readiness
          # failure originates. `db_pool` reporting down was undiagnosable from
          # a 100-line tail because the "Async DB pool initialised" line (or the
          # warning replacing it) had already scrolled past.
          echo "=== app logs (startup sequence) ==="
          docker compose -f docker-compose.yml -f docker-compose.smoke.yml logs app --tail=600 || true

          # Pull out the lines that decide readiness, so the cause is visible
          # without scrolling 600 lines of a folded CI log group.
          echo "=== app logs: startup and readiness signals ==="
          docker compose -f docker-compose.yml -f docker-compose.smoke.yml logs app --no-color 2>/dev/null \
            | grep -Ei "async db pool|set_default_pool|component_registry|\[OK\]|\[FAIL\]|startup_event|Database initialized|Database is |Traceback|CRITICAL" \
            | tail -80 || true

      # ── Tear down ─────────────────────────────────────────────────────────
      - name: Tear down stack
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.smoke.yml \
            down \
            --volumes \
            --remove-orphans

      # ── Update build cache ─────────────────────────────────────────────────
      # Move the new cache into place so the next run benefits from it.
      # The rename prevents cache corruption if the build step was skipped.
      - name: Update Docker layer cache
        if: always()
        run: |
          if [ -d /tmp/.buildx-cache-new ]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

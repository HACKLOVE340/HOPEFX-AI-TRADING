# CodeQL Advanced security scanning.
# Runs on push/PR to main and on a weekly schedule.
# continue-on-error is set on both init and analyze steps so that
# repositories without GitHub Advanced Security (private repos / forks)
# do not block CI - results are still uploaded when permissions allow.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '18 16 * * 2'

# Workflow-level permissions are intentionally minimal.
# security-events: write is required to upload SARIF results.
# On fork PRs this permission is downgraded by GitHub; continue-on-error
# on the analysis steps prevents that from failing the whole workflow.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    # Repos without GitHub Advanced Security (GHAS) cannot upload SARIF results.
    # continue-on-error prevents this from blocking required status checks.
    continue-on-error: true
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: python
          build-mode: none
        # `actions` analyses the workflow files themselves. It is here because
        # main already has an /language:actions configuration registered, so
        # analysing python alone made every pull request report
        #
        #     1 configuration present on refs/heads/main was not found:
        #     /language:actions
        #
        # and conclude `failure` — regardless of whether it found anything. A
        # check that is red on every PR is a check nobody reads, which is how a
        # backlog of real alerts went unnoticed.
        #
        # Adding it makes PR and main analyse the same set, so the check turns
        # on findings again. It also means workflow files are scanned before
        # they merge rather than only afterwards.
        - language: actions
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      # Pinned to SHA for supply-chain safety (tag: v4.37.3)
      uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
      continue-on-error: true
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      # Pinned to SHA for supply-chain safety (tag: v4.37.3)
      # continue-on-error: repos without GitHub Advanced Security (GHAS) will
      # fail the SARIF upload step; this prevents that from blocking CI.
      uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
      continue-on-error: true
      with:
        category: "/language:${{matrix.language}}"

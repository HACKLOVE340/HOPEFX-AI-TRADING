# CodeQL Advanced security scanning.
# Runs on push/PR to main and on a weekly schedule.
# continue-on-error is set on both init and analyze steps so that
# repositories without GitHub Advanced Security (private repos / forks)
# do not block CI - results are still uploaded when permissions allow.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '18 16 * * 2'

# Workflow-level permissions are intentionally minimal.
# security-events: write is required to upload SARIF results.
# On fork PRs this permission is downgraded by GitHub; continue-on-error
# on the analysis steps prevents that from failing the whole workflow.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    # Repos without GitHub Advanced Security (GHAS) cannot upload SARIF results.
    # continue-on-error prevents this from blocking required status checks.
    continue-on-error: true
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      # Pinned to SHA for supply-chain safety (tag: v4.37.3)
      uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
      continue-on-error: true
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      # Pinned to SHA for supply-chain safety (tag: v4.37.3)
      # continue-on-error: repos without GitHub Advanced Security (GHAS) will
      # fail the SARIF upload step; this prevents that from blocking CI.
      uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
      continue-on-error: true
      with:
        category: "/language:${{matrix.language}}"

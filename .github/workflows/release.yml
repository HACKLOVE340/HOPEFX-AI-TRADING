name: Release

on:
  push:
    tags:
      - 'v*'
    # Also run on main pushes so the 'submit-pypi' required status check
    # is satisfied.  The actual publish step is gated by the tag ref and
    # vars.PUBLISH_TO_PYPI, so it never runs on plain branch pushes.
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # submit-pypi: satisfies the required status check of the same name.
  # On branch pushes this job exits immediately (no-op).
  # On tag pushes it builds and optionally publishes to PyPI.
  # NOTE: GitHub Release creation has been moved to the separate `create-release`
  # job below so that the softprops action is ONLY resolved on tag pushes.
  # GitHub resolves all `uses:` references at job-init time (even for skipped
  # steps), so any action with an invalid SHA will fail non-tag pushes too.
  # ---------------------------------------------------------------------------
  submit-pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # id-token: write is required for PyPI Trusted Publishing (OIDC).
      # Requested unconditionally so GitHub resolves the permission at
      # job-init time; the actual publish step is gated by the tag ref
      # and vars.PUBLISH_TO_PYPI so it never runs on branch pushes.
      id-token: write
    steps:
      - name: Skip on non-tag push
        # Exit early on branch pushes — nothing to release.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "Not a tag push — skipping release steps."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          persist-credentials: false

      - name: Set up Python
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install build tools
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: pip install build

      - name: Build package
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: python -m build

      - name: Upload to PyPI via Trusted Publishing
        # Uses OIDC — no long-lived PYPI_API_TOKEN secret required.
        # Enable in PyPI project settings: Trusted Publisher → GitHub Actions.
        # Only runs when vars.PUBLISH_TO_PYPI is set to 'true'.
        if: ${{ startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_PYPI == 'true' }}
        # Pinned to SHA for supply-chain safety (tag: v1)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
        with:
          attestations: true

  # ---------------------------------------------------------------------------
  # create-release: creates a GitHub Release from the built distribution.
  # This job is entirely skipped on branch pushes so its `uses:` references
  # are never resolved — avoiding false failures from SHA drift.
  # ---------------------------------------------------------------------------
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: submit-pypi
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write   # required to create GitHub Release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Create GitHub Release
        # Pinned to SHA for supply-chain safety (tag: v2)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: submit-pypi
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # Pinned to SHA for supply-chain safety (tag: v3)
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to Docker Hub
        # Pinned to SHA for supply-chain safety (tag: v3)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push
        # Pinned to SHA for supply-chain safety (tag: v5)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          tags: |
            hopefx/ai-trading:${{ steps.get_version.outputs.VERSION }}
            hopefx/ai-trading:latest

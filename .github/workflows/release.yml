name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create GitHub Release
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Create GitHub Release
        # Pinned to SHA for supply-chain safety (tag: v2)
        uses: softprops/action-gh-release@c062e08bd532815e2082a7e09ce9571a6d1144cd
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to PyPI via Trusted Publishing
        # Uses OIDC - no long-lived PYPI_API_TOKEN secret required.
        # Enable in PyPI project settings: Trusted Publisher -> GitHub Actions.
        # Only runs when vars.PUBLISH_TO_PYPI is set to 'true'.
        if: vars.PUBLISH_TO_PYPI == 'true'
        # Pinned to SHA for supply-chain safety (tag: v1)
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc
        with:
          attestations: true

  docker-release:
    runs-on: ubuntu-latest
    needs: build-and-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # Pinned to SHA for supply-chain safety (tag: v3)
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5

      - name: Login to Docker Hub
        # Pinned to SHA for supply-chain safety (tag: v3)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push
        # Pinned to SHA for supply-chain safety (tag: v5)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          push: true
          tags: |
            hopefx/ai-trading:${{ steps.get_version.outputs.VERSION }}
            hopefx/ai-trading:latest

name: Tests

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs on the same branch to free up runners
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-ci-${{ matrix.python-version }}-${{ hashFiles('requirements-ci.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-ci-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-ci-

    - name: Install dependencies
      # Use lightweight CI requirements to avoid C-extension build failures
      # (ta-lib, MetaTrader5, tensorflow, etc. are excluded from CI).
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install matplotlib "sentry-sdk[fastapi]>=1.40.0" "pytest>=7.4.3" "pytest-cov>=4.1.0" "pytest-asyncio>=0.23.6"

    - name: Run tests (full suite, 70% baseline)
      env:
        CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
        CONFIG_SALT: ${{ secrets.CONFIG_SALT || 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }}
        SECURITY_JWT_SECRET: ${{ secrets.SECURITY_JWT_SECRET || 'ci-test-secret-key-minimum-32-characters-long' }}
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        OANDA_API_KEY: ci-placeholder
        OANDA_ACCOUNT_ID: ci-placeholder
        OANDA_PRACTICE: "true"
        INITIAL_BALANCE: "100000"
        ML_MIN_TRADE_PROB: "0.58"
        STRATEGY_MIN_BARS: "100"
        STRATEGY_TICKS_PER_BAR: "10"
        FIX_CONFIG_FILE: fix.cfg
      run: |
        pytest tests/ -v --tb=long \
          -m "not slow" \
          --cov=config --cov=strategies --cov=risk --cov=brokers \
          --cov=notifications --cov=cache --cov=database --cov=api \
          --cov=data --cov=analysis --cov=ml --cov=utils --cov=auth \
          --cov=execution --cov=strategy --cov=core --cov=compliance \
          --cov=kill_switch \
          --cov-report=xml --cov-report=term-missing \
          --cov-fail-under=70 \
          --junitxml=test-results.xml

    # ── Critical-path coverage gates (90% branch coverage required) ──────────
    - name: Coverage gate — risk/ (90%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=risk --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=90

    - name: Coverage gate — execution/ (90%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=execution --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=90

    - name: Coverage gate — kill_switch.py (90%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=kill_switch --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=90

    - name: Coverage gate — brokers/ (90%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
        OANDA_API_KEY: ci-placeholder
        OANDA_ACCOUNT_ID: ci-placeholder
        OANDA_PRACTICE: "true"
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=brokers --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=90

    - name: Coverage gate — compliance/ (90%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=compliance --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=90

    - name: Publish test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-${{ matrix.python-version }}
        path: coverage.xml

  coverage-gate:
    name: Coverage gate (≥70%)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install matplotlib "sentry-sdk[fastapi]>=1.40.0" "pytest>=7.4.3" "pytest-cov>=4.1.0" "pytest-asyncio>=0.23.6" coverage

      - name: Run tests and generate coverage report
        env:
          CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
          CONFIG_SALT: ${{ secrets.CONFIG_SALT || 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }}
          SECURITY_JWT_SECRET: ${{ secrets.SECURITY_JWT_SECRET || 'ci-test-secret-key-minimum-32-characters-long' }}
          REDIS_URL: redis://localhost:6379/15
          ENVIRONMENT: testing
        run: |
          pytest tests/ \
            -m "not slow" \
            --cov=config --cov=strategies --cov=risk --cov=brokers \
            --cov=notifications --cov=cache --cov=database --cov=api \
            --cov=data --cov=analysis --cov=ml --cov=utils --cov=auth \
            --cov=execution --cov=strategy --cov=core \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=70 \
            -q 2>&1 | tee coverage-output.txt || true

      - name: Extract coverage percentage
        id: coverage
        run: |
          TOTAL=$(python -c "
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              line_rate = float(root.attrib.get('line-rate', 0))
              branch_rate = float(root.attrib.get('branch-rate', 0))
              combined = (line_rate + branch_rate) / 2 * 100
              print(f'{combined:.1f}')
          except Exception:
              print('0.0')
          ")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Coverage: $TOTAL%"

      - name: Post coverage comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.total }}';
            const pct = parseFloat(coverage);
            const gate = 70;
            const passed = pct >= gate;
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'PASSED' : 'FAILED';
            const color = passed ? '4c1' : 'e05d44';

            const body = [
              `## ${icon} Coverage Gate — ${status}`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Combined coverage | **${coverage}%** |`,
              `| Required | **${gate}%** |`,
              `| Status | ${icon} ${status} |`,
              '',
              `![Coverage](https://img.shields.io/badge/coverage-${coverage}%25-${color})`,
              '',
              passed
                ? `Coverage meets the ${gate}% gate. ✅`
                : `⚠️ Coverage is below the ${gate}% gate. Add tests to the modules shown in the \`term-missing\` report above.`,
            ].join('\n');

            // Find and update existing comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Coverage Gate')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

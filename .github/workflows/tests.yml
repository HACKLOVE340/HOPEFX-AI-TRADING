name: Tests

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs on the same branch to free up runners
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-ci-${{ matrix.python-version }}-${{ hashFiles('requirements-ci.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-ci-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-ci-

    - name: Install dependencies
      # Use lightweight CI requirements to avoid C-extension build failures
      # (ta-lib, MetaTrader5, tensorflow, etc. are excluded from CI).
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install matplotlib "sentry-sdk[fastapi]>=2.0.0" "pytest>=7.4.3" "pytest-cov>=4.1.0" "pytest-asyncio>=0.23.6" "pytest-timeout>=2.2.0"

    - name: Run tests (full suite, 70% baseline)
      env:
        CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
        CONFIG_SALT: ${{ secrets.CONFIG_SALT || 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }}
        SECURITY_JWT_SECRET: ${{ secrets.SECURITY_JWT_SECRET || 'ci-test-secret-key-minimum-32-characters-long' }}
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        OANDA_API_KEY: ci-placeholder
        OANDA_ACCOUNT_ID: ci-placeholder
        OANDA_PRACTICE: "true"
        INITIAL_BALANCE: "100000"
        ML_MIN_TRADE_PROB: "0.58"
        STRATEGY_MIN_BARS: "100"
        STRATEGY_TICKS_PER_BAR: "10"
        FIX_CONFIG_FILE: fix.cfg
      run: |
        pytest tests/ -v --tb=long \
          -m "not slow" \
          --cov --cov-config=.coveragerc \
          --cov-report=xml --cov-report=term-missing \
          --cov-fail-under=70 \
          --asyncio-mode=auto \
          --timeout=120 \
          --junitxml=test-results.xml

    # -- Critical-path coverage gates (90% branch coverage required) ----------
    - name: Coverage gate - risk/ (90%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=risk --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=90 \
          --asyncio-mode=auto \
          --timeout=120

    - name: Coverage gate - execution/ (90%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=execution --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=90 \
          --asyncio-mode=auto \
          --timeout=120

    - name: Coverage gate - kill_switch.py (90%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=kill_switch --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=90 \
          --asyncio-mode=auto \
          --timeout=120

    - name: Coverage gate - brokers/ (90%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
        OANDA_API_KEY: ci-placeholder
        OANDA_ACCOUNT_ID: ci-placeholder
        OANDA_PRACTICE: "true"
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=brokers --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=90 \
          --asyncio-mode=auto \
          --timeout=120

    - name: Coverage gate - compliance/ (90%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=compliance --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=90 \
          --asyncio-mode=auto \
          --timeout=120

    - name: Coverage gate - core/ signal-engine + MCC (80%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
        INITIAL_BALANCE: "100000"
        ML_MIN_TRADE_PROB: "0.58"
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=core --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          --asyncio-mode=auto \
          --timeout=120

    - name: Publish test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results.xml
        retention-days: 7

    - name: Upload coverage to Codecov
      # Pinned to SHA for supply-chain safety (tag: v5.4.3)
      uses: codecov/codecov-action@4650159d642e33fdc30954ca22638caf0df6cac8
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage to Qlty
      if: matrix.python-version == '3.11'
      # Pinned to SHA for supply-chain safety (tag: v2)
      uses: qltysh/qlty-action/coverage@a19242102d17e497f437d7466aa01b528537e899  # v2
      with:
        token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        files: coverage.xml

    - name: Upload coverage artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      if: always()
      with:
        name: coverage-${{ matrix.python-version }}
        path: coverage.xml
        retention-days: 7



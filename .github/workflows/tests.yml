name: Tests

on:
  push:
    branches: [ main, develop, copilot/** ]
    paths-ignore:
      - "frontend/**"
      - "dashboard/**"
      - "mobile/**"
      - "mobile-app/**"
      - "helm/**"
      - "k8s/**"
      - "docs/**"
      - "*.md"
      - "Dockerfile"
      - "docker-compose*.yml"
  pull_request:
    branches: [ main, develop ]

# Use SHA so each push gets its own group — Dependabot bumps no longer
# cancel in-flight test runs triggered by real code changes.
concurrency:
  group: tests-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-ci-${{ matrix.python-version }}-${{ hashFiles('requirements-ci.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-ci-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-ci-

    - name: Install dependencies
      # Use lightweight CI requirements to avoid C-extension build failures
      # (ta-lib, MetaTrader5, tensorflow, etc. are excluded from CI).
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install matplotlib "sentry-sdk[fastapi]>=2.0.0" "pytest>=7.4.3" "pytest-cov>=4.1.0" "pytest-asyncio>=0.23.6" "pytest-timeout>=2.2.0"

    - name: Run tests (full suite, 70% baseline)
      env:
        CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
        CONFIG_SALT: ${{ secrets.CONFIG_SALT || 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }}
        SECURITY_JWT_SECRET: ${{ secrets.SECURITY_JWT_SECRET || 'ci-test-secret-key-minimum-32-characters-long' }}
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        OANDA_API_KEY: ci-placeholder
        OANDA_ACCOUNT_ID: ci-placeholder
        OANDA_PRACTICE: "true"
        INITIAL_BALANCE: "100000"
        ML_MIN_TRADE_PROB: "0.58"
        STRATEGY_MIN_BARS: "100"
        STRATEGY_TICKS_PER_BAR: "10"
        FIX_CONFIG_FILE: fix.cfg
      run: |
        pytest tests/ -v --tb=long \
          -m "not slow" \
          --cov --cov-config=.coveragerc \
          --cov-report=xml --cov-report=term-missing \
          --cov-fail-under=70 \
          --asyncio-mode=auto \
          --timeout=120 \
          --junitxml=test-results.xml

    # -- Critical-path coverage gates (80% branch coverage required) ----------
    - name: Coverage gate - risk/ (80%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=risk --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          --asyncio-mode=auto \
          --timeout=120

    - name: Coverage gate - execution/ (80%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=execution --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          --asyncio-mode=auto \
          --timeout=120

    - name: Coverage gate - kill_switch.py (80%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=kill_switch --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          --asyncio-mode=auto \
          --timeout=120

    - name: Coverage gate - brokers/ (80%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
        OANDA_API_KEY: ci-placeholder
        OANDA_ACCOUNT_ID: ci-placeholder
        OANDA_PRACTICE: "true"
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=brokers --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          --asyncio-mode=auto \
          --timeout=120

    - name: Coverage gate - compliance/ (80%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=compliance --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          --asyncio-mode=auto \
          --timeout=120

    - name: Coverage gate - core/ signal-engine + MCC (80%)
      env:
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        SECURITY_JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
        INITIAL_BALANCE: "100000"
        ML_MIN_TRADE_PROB: "0.58"
      run: |
        pytest tests/ -m "not slow" -q \
          --cov=core --cov-branch \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          --asyncio-mode=auto \
          --timeout=120

    - name: Publish test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results.xml
        retention-days: 7

    - name: Upload coverage to Codecov
      # Pinned to SHA for supply-chain safety (tag: v5.4.3)
      uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage to Qlty
      if: matrix.python-version == '3.11'
      # Pinned to SHA for supply-chain safety (tag: v2)
      uses: qltysh/qlty-action/coverage@a19242102d17e497f437d7466aa01b528537e899  # v2
      with:
        token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        files: coverage.xml

    - name: Upload coverage artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      if: always()
      with:
        name: coverage-${{ matrix.python-version }}
        path: coverage.xml
        retention-days: 7

  coverage-gate:
    name: Coverage gate (>=70%)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install matplotlib "sentry-sdk[fastapi]>=2.0.0" "pytest>=7.4.3" "pytest-cov>=4.1.0" "pytest-asyncio>=0.23.6" "pytest-timeout>=2.2.0" coverage

      - name: Run tests and generate coverage report
        env:
          CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
          CONFIG_SALT: ${{ secrets.CONFIG_SALT || 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }}
          SECURITY_JWT_SECRET: ${{ secrets.SECURITY_JWT_SECRET || 'ci-test-secret-key-minimum-32-characters-long' }}
          REDIS_URL: redis://localhost:6379/15
          ENVIRONMENT: testing
        run: |
          pytest tests/ \
            -m "not slow" \
            --cov --cov-config=.coveragerc \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=70 \
            --asyncio-mode=auto \
            --timeout=120 \
            -q 2>&1 | tee coverage-output.txt || true

      - name: Extract coverage percentage
        id: coverage
        run: |
          TOTAL=$(python -c "
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              line_rate = float(root.attrib.get('line-rate', 0))
              branch_rate = float(root.attrib.get('branch-rate', 0))
              combined = (line_rate + branch_rate) / 2 * 100
              print(f'{combined:.1f}')
          except Exception:
              print('0.0')
          ")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Coverage: $TOTAL%"

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        # Pinned to SHA for supply-chain safety (tag: v7)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.total }}';
            const pct = parseFloat(coverage);
            const gate = 70;
            const passed = pct >= gate;
            const icon = passed ? 'PASS' : 'FAIL';
            const status = passed ? 'PASSED' : 'FAILED';
            const color = passed ? '4c1' : 'e05d44';

            const body = [
              `## ${icon} Coverage Gate - ${status}`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Combined coverage | **${coverage}%** |`,
              `| Required | **${gate}%** |`,
              `| Status | ${icon} ${status} |`,
              '',
              `![Coverage](https://img.shields.io/badge/coverage-${coverage}%25-${color})`,
              '',
              passed
                ? `Coverage meets the ${gate}% gate. PASS`
                : `WARN Coverage is below the ${gate}% gate. Add tests to the modules shown in the \`term-missing\` report above.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Coverage Gate')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

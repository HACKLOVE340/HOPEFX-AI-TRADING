name: Tests

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      # Use lightweight CI requirements to avoid C-extension build failures
      # (ta-lib, MetaTrader5, tensorflow, etc. are excluded from CI).
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install "pytest>=7.4.3" "pytest-cov>=4.1.0" "pytest-asyncio>=0.23.6"
    
    - name: Run tests
      env:
        CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
        CONFIG_SALT: ${{ secrets.CONFIG_SALT || 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }}
        # Minimum-length secret so auth tests pass without a real secret configured
        SECURITY_JWT_SECRET: ${{ secrets.SECURITY_JWT_SECRET || 'ci-test-secret-key-minimum-32-characters-long' }}
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
      run: |
        pytest tests/ -v --tb=long \
          --cov=config --cov=strategies --cov=risk --cov=brokers \
          --cov=notifications --cov=cache --cov=database --cov=api \
          --cov=data --cov=analysis --cov=ml --cov=utils --cov=auth \
          --cov=execution \
          --cov-report=xml --cov-report=term-missing \
          --junitxml=test-results.xml

    - name: Publish test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

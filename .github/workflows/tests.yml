name: Tests

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      # Use lightweight CI requirements to avoid C-extension build failures
      # (ta-lib, MetaTrader5, tensorflow, etc. are excluded from CI).
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install matplotlib "pytest>=7.4.3" "pytest-cov>=4.1.0" "pytest-asyncio>=0.23.6"

    - name: Run tests
      env:
        CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
        CONFIG_SALT: ${{ secrets.CONFIG_SALT || 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }}
        # Minimum-length secret so auth tests pass without a real secret configured
        SECURITY_JWT_SECRET: ${{ secrets.SECURITY_JWT_SECRET || 'ci-test-secret-key-minimum-32-characters-long' }}
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
      run: |
        pytest tests/ -v --tb=long \
          --cov=config --cov=strategies --cov=risk --cov=brokers \
          --cov=notifications --cov=cache --cov=database --cov=api \
          --cov=data --cov=analysis --cov=ml --cov=utils --cov=auth \
          --cov=execution \
          --cov-report=xml --cov-report=term-missing \
          --cov-fail-under=70 \
          --junitxml=test-results.xml

    - name: Publish test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-${{ matrix.python-version }}
        path: coverage.xml

  coverage-gate:
    name: Coverage gate (≥70%)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install matplotlib "pytest>=7.4.3" "pytest-cov>=4.1.0" "pytest-asyncio>=0.23.6" coverage

      - name: Run tests and generate coverage report
        env:
          CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
          CONFIG_SALT: ${{ secrets.CONFIG_SALT || 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }}
          SECURITY_JWT_SECRET: ${{ secrets.SECURITY_JWT_SECRET || 'ci-test-secret-key-minimum-32-characters-long' }}
          REDIS_URL: redis://localhost:6379/15
          ENVIRONMENT: testing
        run: |
          pytest tests/ \
            --cov=config --cov=strategies --cov=risk --cov=brokers \
            --cov=notifications --cov=cache --cov=database --cov=api \
            --cov=data --cov=analysis --cov=ml --cov=utils --cov=auth \
            --cov=execution \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=70 \
            -q 2>&1 | tee coverage-output.txt || true

      - name: Extract coverage percentage
        id: coverage
        run: |
          TOTAL=$(python -c "
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              line_rate = float(root.attrib.get('line-rate', 0))
              branch_rate = float(root.attrib.get('branch-rate', 0))
              combined = (line_rate + branch_rate) / 2 * 100
              print(f'{combined:.1f}')
          except Exception:
              print('0.0')
          ")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Coverage: $TOTAL%"

      - name: Post coverage comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.total }}';
            const pct = parseFloat(coverage);
            const gate = 70;
            const passed = pct >= gate;
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'PASSED' : 'FAILED';
            const color = passed ? '4c1' : 'e05d44';

            const body = [
              `## ${icon} Coverage Gate — ${status}`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Combined coverage | **${coverage}%** |`,
              `| Required | **${gate}%** |`,
              `| Status | ${icon} ${status} |`,
              '',
              `![Coverage](https://img.shields.io/badge/coverage-${coverage}%25-${color})`,
              '',
              passed
                ? `Coverage meets the ${gate}% gate. ✅`
                : `⚠️ Coverage is below the ${gate}% gate. Add tests to the modules shown in the \`term-missing\` report above.`,
            ].join('\n');

            // Find and update existing comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Coverage Gate')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

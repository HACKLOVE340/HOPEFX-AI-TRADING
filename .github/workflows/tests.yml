name: Tests

on:
  push:
    branches: [ main, develop, copilot/**, claude/** ]
    paths-ignore:
      - "frontend/**"
      - "dashboard/**"
      - "mobile/**"
      - "mobile-app/**"
      - "helm/**"
      - "k8s/**"
      - "docs/**"
      - "*.md"
      - "Dockerfile"
      - "docker-compose*.yml"
  pull_request:
    branches: [ main, develop ]

# Each push/PR gets its own group — no cancellation so coverage always lands.
# Superseded runs are cancelled on feature branches and PRs; main is left alone
# because its runs are the release record. This block previously keyed the group
# on github.sha, giving every commit its own group — so it collided with nothing
# and superseded nothing, and every push queued another complete pipeline.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      # Postgres is here to match ci.yml. Without it this workflow ran the same
      # suite against no database at all, so every DB-backed branch was skipped
      # or took its fallback path — and the resulting coverage came out ~2 points
      # lower than ci.yml's, on an identical .coveragerc and an identical 70%
      # gate: 69.6% here against 71.53% there.
      #
      # The gate was therefore unreachable by construction, and this workflow
      # failed on every commit to main. A check that can never pass is a check
      # nobody reads.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: hopefx
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-ci-${{ matrix.python-version }}-${{ hashFiles('requirements-ci.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-ci-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-ci-

    - name: Install dependencies
      # All test tools (pytest, coverage, etc.) are in requirements-ci.txt.
      # --retries 5 --timeout 60: guard against transient PyPI connection timeouts.
      run: |
        python -m pip install --upgrade --retries 5 --timeout 60 pip
        pip install --retries 5 --timeout 60 -r requirements-ci.txt

    # Run the full suite once. Coverage data for all packages is collected
    # here and reused by the per-package gates below — no re-runs needed.
    - name: Run tests (full suite, 70% baseline)
      env:
        CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
        CONFIG_SALT: ${{ secrets.CONFIG_SALT || 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }}
        SECURITY_JWT_SECRET: ${{ secrets.SECURITY_JWT_SECRET || 'ci-test-secret-key-minimum-32-characters-long' }}  # pragma: allowlist secret
        # Must match ci.yml, or the two workflows measure different code paths
        # and disagree on an identical coverage gate. See the services block.
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hopefx  # pragma: allowlist secret
        DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hopefx  # pragma: allowlist secret
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        OANDA_API_KEY: ci-placeholder  # pragma: allowlist secret
        OANDA_ACCOUNT_ID: ci-placeholder
        OANDA_PRACTICE: "true"
        INITIAL_BALANCE: "100000"
        ML_MIN_TRADE_PROB: "0.58"
        STRATEGY_MIN_BARS: "100"
        STRATEGY_TICKS_PER_BAR: "10"
        FIX_CONFIG_FILE: fix.cfg
        SHARPE_CB_RESTORE: "false"
      run: |
        pytest tests/ \
          -m "not slow and not e2e" \
          --cov --cov-config=.coveragerc \
          --cov-report=xml --cov-report=term-missing \
          --cov-fail-under=70 \
          --asyncio-mode=auto \
          --timeout=120 \
          --junitxml=test-results.xml \
          -q

    # Per-package coverage gates — read from the .coverage file produced above.
    # Uses `coverage report --include` to filter by package. No test re-runs.
    - name: Coverage gate - risk/ (80%)
      run: coverage report --rcfile=.coveragerc --include="risk/*" --fail-under=80

    - name: Coverage gate - execution/ (80%)
      run: coverage report --rcfile=.coveragerc --include="execution/*" --fail-under=80

    - name: Coverage gate - kill_switch.py (80%)
      run: coverage report --rcfile=.coveragerc --include="kill_switch.py" --fail-under=80

    - name: Coverage gate - brokers/ (80%)
      run: coverage report --rcfile=.coveragerc --include="brokers/*" --fail-under=80

    - name: Coverage gate - compliance/ (80%)
      run: coverage report --rcfile=.coveragerc --include="compliance/*" --fail-under=80

    - name: Coverage gate - core/ (80%)
      run: coverage report --rcfile=.coveragerc --include="core/*" --fail-under=80

    - name: Publish test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4.4.3
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results.xml
        retention-days: 7

    - name: Upload coverage to Codecov
      # continue-on-error: CODECOV_TOKEN is optional; upload is best-effort.
      continue-on-error: true
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage to Qlty
      if: matrix.python-version == '3.11'
      # continue-on-error: QLTY_COVERAGE_TOKEN is optional; upload is best-effort.
      continue-on-error: true
      uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637  # v2
      with:
        token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        files: coverage.xml

    - name: Upload coverage artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4.4.3
      if: always()
      with:
        name: coverage-${{ matrix.python-version }}
        path: coverage.xml
        retention-days: 7

  # ── Gate A: Auth coverage ────────────────────────────────────────────────────
  # Every mutating route (POST/PUT/PATCH/DELETE) must carry an auth dependency.
  # Catches the /api/nocode and /api/research auth-gap class of bug automatically.
  # Runs on Python 3.12 only — no matrix needed for a structural check.
  auth-coverage:
    name: Gate A — auth coverage (all mutating routes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Cancel any in-progress run for the same branch+commit so stale runs
    # don't queue behind a newer push.  cancel-in-progress: true is safe here
    # because the gate is idempotent — re-running always produces the same result.
    concurrency:
      group: gate-auth-coverage-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: true
    permissions:
      contents: read

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-3.12-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ci-3.12-
            ${{ runner.os }}-pip-ci-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --retries 5 --timeout 60 pip
          pip install --retries 5 --timeout 60 -r requirements-ci.txt

      - name: Run auth coverage gate
        env:
          APP_ENV: test
          SECURITY_JWT_SECRET: "ci-test-secret-key-minimum-32-characters-long"  # pragma: allowlist secret
          STARTUP_GATE: "false"
          CSRF_PROTECTION: "false"
          CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
          CONFIG_SALT: ${{ secrets.CONFIG_SALT || 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }}
          REDIS_URL: redis://localhost:6379/15
          OANDA_API_KEY: ci-placeholder  # pragma: allowlist secret
          OANDA_ACCOUNT_ID: ci-placeholder
          OANDA_PRACTICE: "true"
          BROKER_TYPE: paper
          PAPER_TRADING: "true"
        run: |
          pytest tests/unit/test_auth_coverage.py \
            --asyncio-mode=auto \
            --timeout=120 \
            -v \
            --tb=short \
            --junitxml=auth-coverage-results.xml

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4.4.3
        if: always()
        with:
          name: auth-coverage-results
          path: auth-coverage-results.xml
          retention-days: 7

  # ── Gate B: Env-var consistency ───────────────────────────────────────────────
  # Every env var referenced in fix_router.py, main_loop.py, brokers/factory.py,
  # and api/trading.py must be declared in .env.example and forwarded in
  # docker-compose.yml.  Catches the PAPER_TRADING/BROKER_TYPE split-brain class.
  env-consistency:
    name: Gate B — env-var consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gate-env-consistency-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          # Key on Python version + the exact packages installed so the cache
          # is invalidated when either changes.  No requirements file needed —
          # these lightweight gates install a fixed minimal set.
          key: ${{ runner.os }}-pip-gate-minimal-3.12-pytest-pyyaml-timeout
          restore-keys: |
            ${{ runner.os }}-pip-gate-minimal-3.12-
            ${{ runner.os }}-pip-gate-minimal-

      - name: Install minimal dependencies
        # Needs pyyaml and pytest for config parsing.
        # pytest-timeout is required by --timeout=30.
        # FastAPI is NOT needed here: --noconftest skips the root conftest.py
        # whose import chain pulls in FastAPI.  The gate itself only uses
        # stdlib + pytest + pyyaml.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout pyyaml

      - name: Run env-var consistency gate
        run: |
          pytest tests/system/test_env_consistency.py \
            --noconftest \
            --timeout=30 \
            -v \
            --tb=short \
            --junitxml=env-consistency-results.xml

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4.4.3
        if: always()
        with:
          name: env-consistency-results
          path: env-consistency-results.xml
          retention-days: 7

  # ── Gate C: Docker Compose smoke (structural) ─────────────────────────────────
  # Validates docker-compose.yml and docker-compose.smoke.yml are internally
  # consistent before any container is started.  Catches missing healthchecks,
  # TLS default mismatches, and missing :?required variables.
  # The live container smoke test runs in docker-smoke.yml.
  docker-smoke-structural:
    name: Gate C — docker-compose structural validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gate-docker-smoke-structural-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-gate-minimal-3.12-pytest-pyyaml-timeout
          restore-keys: |
            ${{ runner.os }}-pip-gate-minimal-3.12-
            ${{ runner.os }}-pip-gate-minimal-

      - name: Install minimal dependencies
        # Needs pyyaml and pytest for compose file parsing.
        # pytest-timeout is required by --timeout=30.
        # FastAPI is NOT needed here: --noconftest skips the root conftest.py
        # whose import chain pulls in FastAPI.  The gate itself only uses
        # stdlib + pytest + pyyaml.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout pyyaml

      - name: Run docker-compose structural gate
        run: |
          pytest tests/system/test_docker_smoke.py \
            --noconftest \
            --timeout=30 \
            -v \
            --tb=short \
            --junitxml=docker-smoke-structural-results.xml

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4.4.3
        if: always()
        with:
          name: docker-smoke-structural-results
          path: docker-smoke-structural-results.xml
          retention-days: 7

  # ── Gate D: Model accuracy assertion ─────────────────────────────────────────
  # Reads ml/saved_models/advanced_oos_meta.json and asserts that every place
  # in the codebase that quotes an accuracy figure is within ±2pp of oos_accuracy.
  # Prevents the four-different-accuracy-figures problem from recurring.
  model-accuracy:
    name: Gate D — model accuracy consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gate-model-accuracy-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-gate-minimal-3.12-pytest-timeout
          restore-keys: |
            ${{ runner.os }}-pip-gate-minimal-3.12-
            ${{ runner.os }}-pip-gate-minimal-

      - name: Install minimal dependencies
        # Reads JSON and text files; no ML stack required.
        # pytest-timeout is required by --timeout=30.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout

      - name: Run model accuracy gate
        run: |
          pytest tests/unit/test_model_accuracy_assertion.py \
            --noconftest \
            --timeout=30 \
            -v \
            --tb=short \
            --junitxml=model-accuracy-results.xml

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4.4.3
        if: always()
        with:
          name: model-accuracy-results
          path: model-accuracy-results.xml
          retention-days: 7

  # ── Gate E: Dead file detection ───────────────────────────────────────────────
  # Scans Python files in the project root for STATUS: SUPERSEDED or
  # "TODO: Either wire ... or delete" markers and fails the build if found.
  # Forces a decision: wire it or delete it.  Prevents abandoned root-level
  # scripts from accumulating silently.
  dead-file-detection:
    name: Gate E — dead file detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gate-dead-file-detection-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-gate-minimal-3.12-pytest-timeout
          restore-keys: |
            ${{ runner.os }}-pip-gate-minimal-3.12-
            ${{ runner.os }}-pip-gate-minimal-

      - name: Install minimal dependencies
        # Pure filesystem scan; no heavy imports required.
        # pytest-timeout is required by --timeout=30.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout

      - name: Run dead file detection gate
        run: |
          pytest tests/unit/test_dead_file_detection.py \
            --noconftest \
            --timeout=30 \
            -v \
            --tb=short \
            --junitxml=dead-file-results.xml

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4.4.3
        if: always()
        with:
          name: dead-file-results
          path: dead-file-results.xml
          retention-days: 7

  coverage-gate:
    name: Coverage gate (>=70%)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Download the coverage.xml produced by the test job — no re-run needed.
      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-3.12
          path: .

      - name: Extract coverage percentage
        id: coverage
        # Two defects lived in this step, both of the shape this repository's
        # audit exists to remove (F104).
        #
        # 1. `except Exception: print('0.0')` turned a missing or corrupt
        #    coverage.xml into the number 0.0, which the comment below then
        #    rendered as "FAILED" — while the job exited 0. A value nobody
        #    measured, presented as a measurement, on a control surface.
        #    "I could not measure" is not "you scored zero", and neither is
        #    "you passed". It now fails loudly.
        #
        # 2. `(line_rate + branch_rate) / 2` is not the number the gate checks.
        #    coverage.py reports (covered_lines + covered_branches) over
        #    (valid_lines + valid_branches) — a weighted total, not the mean of
        #    two rates over different denominators. On a real report the mean
        #    read 83.55% where coverage.py said 85.25%, so the badge showed a
        #    figure biased low and compared it against the same 70. The weighted
        #    formula below reproduces pytest-cov's own total exactly, verified
        #    against a generated report.
        run: |
          set -euo pipefail
          TOTAL=$(python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse("coverage.xml").getroot()
              covered = int(root.attrib["lines-covered"]) + int(root.attrib["branches-covered"])
              valid = int(root.attrib["lines-valid"]) + int(root.attrib["branches-valid"])
          except (OSError, ET.ParseError, KeyError, ValueError) as exc:
              print(f"coverage.xml is missing or unreadable: {exc}", file=sys.stderr)
              print("This job cannot report a coverage figure it did not measure.", file=sys.stderr)
              raise SystemExit(1) from None

          if valid == 0:
              print("coverage.xml reports zero measurable lines and branches.", file=sys.stderr)
              raise SystemExit(1)

          print(f"{covered / valid * 100:.2f}")
          PY
          )
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Coverage: $TOTAL%"

      - name: Post coverage comment on PR
        # always(): the comment explaining WHY the gate failed is most needed
        # when it fails. Without this the enforce step below would leave a PR
        # author with a red check and no number.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          COVERAGE_TOTAL: ${{ steps.coverage.outputs.total }}
        with:
          script: |
            // Read from env var to prevent template-injection of output into script context.
            const coverage = process.env.COVERAGE_TOTAL || '0';
            const pct = parseFloat(coverage);
            const gate = 70;
            const passed = pct >= gate;
            const icon = passed ? 'PASS' : 'FAIL';
            const status = passed ? 'PASSED' : 'FAILED';
            const color = passed ? '4c1' : 'e05d44';

            const body = [
              `## ${icon} Coverage Gate - ${status}`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Combined coverage | **${coverage}%** |`,
              `| Required | **${gate}%** |`,
              `| Status | ${icon} ${status} |`,
              '',
              `![Coverage](https://img.shields.io/badge/coverage-${coverage}%25-${color})`,
              '',
              passed
                ? `Coverage meets the ${gate}% gate.`
                : `Coverage is below the ${gate}% gate. Add tests to the modules shown in the term-missing report above.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Coverage Gate')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Phase 2 security / consistency gates ─────────────────────────────────────
  # These run on every push to claude/**, copilot/**, develop, and main.
  # Each gate is a fast (< 30s) static check — no services needed.

      - name: Enforce the coverage gate
        # The job is called "Coverage gate (>=70%)" and had no `exit 1` in it:
        # four steps that rendered a FAIL badge into a PR comment and exited 0.
        # Coverage was genuinely gated elsewhere (`--cov-fail-under=70`), so
        # this job was decoration that read as a gate — which is worse than no
        # job, because a reviewer scanning the checklist sees a green gate.
        #
        # Its name and its exit code agree now.
        env:
          COVERAGE_TOTAL: ${{ steps.coverage.outputs.total }}
        run: |
          set -euo pipefail
          GATE=70
          python3 - <<'PY'
          import os
          import sys

          total = float(os.environ["COVERAGE_TOTAL"])
          gate = 70.0
          if total < gate:
              print(f"Coverage gate FAILED: {total:.2f}% is below {gate:.0f}%", file=sys.stderr)
              sys.exit(1)
          print(f"Coverage gate passed: {total:.2f}% >= {gate:.0f}%")
          PY
  gate-a-auth-coverage:
    name: Gate A — auth coverage (all mutating routes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Run Gate A

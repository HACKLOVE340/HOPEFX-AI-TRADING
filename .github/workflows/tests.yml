name: Tests

on:
  push:
    branches: [ main, develop, copilot/** ]
    paths-ignore:
      - "frontend/**"
      - "dashboard/**"
      - "mobile/**"
      - "mobile-app/**"
      - "helm/**"
      - "k8s/**"
      - "docs/**"
      - "*.md"
      - "Dockerfile"
      - "docker-compose*.yml"
  pull_request:
    branches: [ main, develop ]

# Each push/PR gets its own group — no cancellation so coverage always lands.
concurrency:
  group: tests-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-ci-${{ matrix.python-version }}-${{ hashFiles('requirements-ci.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-ci-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-ci-

    - name: Install dependencies
      # All test tools (pytest, coverage, etc.) are in requirements-ci.txt.
      # --retries 5 --timeout 60: guard against transient PyPI connection timeouts.
      run: |
        python -m pip install --upgrade --retries 5 --timeout 60 pip
        pip install --retries 5 --timeout 60 -r requirements-ci.txt

    # Run the full suite once. Coverage data for all packages is collected
    # here and reused by the per-package gates below — no re-runs needed.
    - name: Run tests (full suite, 70% baseline)
      env:
        CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
        CONFIG_SALT: ${{ secrets.CONFIG_SALT || 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }}
        SECURITY_JWT_SECRET: ${{ secrets.SECURITY_JWT_SECRET || 'ci-test-secret-key-minimum-32-characters-long' }}  # pragma: allowlist secret
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: testing
        OANDA_API_KEY: ci-placeholder  # pragma: allowlist secret
        OANDA_ACCOUNT_ID: ci-placeholder
        OANDA_PRACTICE: "true"
        INITIAL_BALANCE: "100000"
        ML_MIN_TRADE_PROB: "0.58"
        STRATEGY_MIN_BARS: "100"
        STRATEGY_TICKS_PER_BAR: "10"
        FIX_CONFIG_FILE: fix.cfg
      run: |
        pytest tests/ \
          -m "not slow" \
          --cov --cov-config=.coveragerc \
          --cov-report=xml --cov-report=term-missing \
          --cov-fail-under=70 \
          --asyncio-mode=auto \
          --timeout=120 \
          --junitxml=test-results.xml \
          -q

    # Per-package coverage gates — read from the .coverage file produced above.
    # Uses `coverage report --include` to filter by package. No test re-runs.
    - name: Coverage gate - risk/ (80%)
      run: coverage report --rcfile=.coveragerc --include="risk/*" --fail-under=80

    - name: Coverage gate - execution/ (80%)
      run: coverage report --rcfile=.coveragerc --include="execution/*" --fail-under=80

    - name: Coverage gate - kill_switch.py (80%)
      run: coverage report --rcfile=.coveragerc --include="kill_switch.py" --fail-under=80

    - name: Coverage gate - brokers/ (80%)
      run: coverage report --rcfile=.coveragerc --include="brokers/*" --fail-under=80

    - name: Coverage gate - compliance/ (80%)
      run: coverage report --rcfile=.coveragerc --include="compliance/*" --fail-under=80

    - name: Coverage gate - core/ (80%)
      run: coverage report --rcfile=.coveragerc --include="core/*" --fail-under=80

    - name: Publish test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.4.3
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results.xml
        retention-days: 7

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage to Qlty
      if: matrix.python-version == '3.11'
      uses: qltysh/qlty-action/coverage@a19242102d17e497f437d7466aa01b528537e899  # v2
      with:
        token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        files: coverage.xml

    - name: Upload coverage artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.4.3
      if: always()
      with:
        name: coverage-${{ matrix.python-version }}
        path: coverage.xml
        retention-days: 7

  coverage-gate:
    name: Coverage gate (>=70%)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      # Download the coverage.xml produced by the test job — no re-run needed.
      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: coverage-3.12
          path: .

      - name: Extract coverage percentage
        id: coverage
        run: |
          TOTAL=$(python3 -c "
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              line_rate = float(root.attrib.get('line-rate', 0))
              branch_rate = float(root.attrib.get('branch-rate', 0))
              combined = (line_rate + branch_rate) / 2 * 100
              print(f'{combined:.1f}')
          except Exception:
              print('0.0')
          ")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Coverage: $TOTAL%"

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        env:
          COVERAGE_TOTAL: ${{ steps.coverage.outputs.total }}
        with:
          script: |
            // Read from env var to prevent template-injection of output into script context.
            const coverage = process.env.COVERAGE_TOTAL || '0';
            const pct = parseFloat(coverage);
            const gate = 70;
            const passed = pct >= gate;
            const icon = passed ? 'PASS' : 'FAIL';
            const status = passed ? 'PASSED' : 'FAILED';
            const color = passed ? '4c1' : 'e05d44';

            const body = [
              `## ${icon} Coverage Gate - ${status}`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Combined coverage | **${coverage}%** |`,
              `| Required | **${gate}%** |`,
              `| Status | ${icon} ${status} |`,
              '',
              `![Coverage](https://img.shields.io/badge/coverage-${coverage}%25-${color})`,
              '',
              passed
                ? `Coverage meets the ${gate}% gate.`
                : `Coverage is below the ${gate}% gate. Add tests to the modules shown in the term-missing report above.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Coverage Gate')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # continue-on-error: the upload-pages-artifact step requires GitHub Pages
    # to be enabled in repo settings (Settings → Pages → Source: GitHub Actions).
    # Until Pages is enabled this step will fail; continue-on-error prevents
    # that from blocking other CI checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0   # full history for git-revision-date plugin

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install MkDocs + Material
        run: pip install "mkdocs>=1.6.0,<2.0.0" "mkdocs-material>=9.6.0,<10.0.0"

      - name: Build docs
        run: mkdocs build --no-strict

      - name: Upload Pages artifact
        # Requires GitHub Pages enabled: Settings → Pages → Source: GitHub Actions
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # Only deploy when the build job actually succeeded (not just continued-on-error)
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

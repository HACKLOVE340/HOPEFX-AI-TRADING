name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/static.yml"
  workflow_dispatch:

# Permissions scoped to job level only - workflow level is read-only.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to push to gh-pages branch
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0   # full history for git-revision-date plugin
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install MkDocs + Material
        run: pip install "mkdocs>=1.6.0,<2.0.0" "mkdocs-material>=9.6.0,<10.0.0"

      - name: Build docs
        run: mkdocs build --no-strict

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --clean --no-strict

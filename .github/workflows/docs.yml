name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/static.yml"
  workflow_dispatch:

# Workflow-level permissions are read-only; write permissions are scoped to the
# jobs that actually need them to follow least-privilege principle.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # continue-on-error: the upload-pages-artifact step requires GitHub Pages
    # to be enabled in repo settings (Settings → Pages → Source: GitHub Actions).
    # Until Pages is enabled this step will fail; continue-on-error prevents
    # that from blocking other CI checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0   # full history for git-revision-date plugin
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install MkDocs + Material
        run: pip install "mkdocs>=1.6.0,<2.0.0" "mkdocs-material>=9.6.0,<10.0.0"

      - name: Build docs
        run: mkdocs build --no-strict

      - name: Upload Pages artifact
        # Requires GitHub Pages enabled: Settings → Pages → Source: GitHub Actions
        # Pinned to SHA for supply-chain safety (tag: v3)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

  deploy:
    needs: build
    # Only deploy when the build job actually succeeded (not just continued-on-error)
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # Pinned to SHA for supply-chain safety (tag: v4)
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

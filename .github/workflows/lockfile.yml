name: Regenerate requirements.lock

on:
  push:
    paths:
      - requirements.txt
  workflow_dispatch:

jobs:
  pip-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Regenerate requirements.lock
        run: |
          # --output-file is required: without it, pip-compile defaults to an
          # output filename derived from the input, which for an input already
          # named requirements.txt resolves to requirements.txt itself — pip-compile
          # then refuses with "input and output filenames must not be matched"
          # (this is why this workflow failed on every run for months; the header
          # comment below always documented --output-file correctly, it just never
          # made it into this actual command).
          pip-compile requirements.txt --output-file requirements.lock.tmp --no-header --quiet --strip-extras
          {
            echo "# requirements.lock — exact pinned versions for reproducible production builds"
            echo "#"
            echo "# Generated by pip-compile from requirements.txt"
            echo "# Regenerate with: pip-compile requirements.txt --output-file requirements.lock --strip-extras"
            echo "#"
            echo "# Usage:"
            echo "#   pip install -r requirements.lock   # exact reproducible install"
            echo "#   pip install -r requirements.txt    # flexible install (development)"
            echo "#"
            echo "# Do NOT edit manually. Regenerate when upgrading dependencies."
            cat requirements.lock.tmp
          } > requirements.lock
          rm -f requirements.lock.tmp

      - name: Create Pull Request
        # Pinned to SHA for supply-chain safety (tag: v6)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          commit-message: "chore: regenerate requirements.lock"
          title: "chore: regenerate requirements.lock"
          body: |
            Automated regeneration of `requirements.lock` triggered by changes to `requirements.txt`.

            Review pinned versions for any unexpected upgrades before merging.
          branch: chore/regenerate-lockfile
          delete-branch: true

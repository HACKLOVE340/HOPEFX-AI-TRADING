name: Regenerate requirements.lock

on:
  push:
    paths:
      - requirements.txt
  workflow_dispatch:

jobs:
  pip-compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Regenerate requirements.lock
        run: |
          {
            echo "# requirements.lock — exact pinned versions for reproducible production builds"
            echo "#"
            echo "# Generated by pip-compile from requirements.txt"
            echo "# Regenerate with: pip-compile requirements.txt --output-file requirements.lock --strip-extras"
            echo "#"
            echo "# Usage:"
            echo "#   pip install -r requirements.lock   # exact reproducible install"
            echo "#   pip install -r requirements.txt    # flexible install (development)"
            echo "#"
            echo "# Do NOT edit manually. Regenerate when upgrading dependencies."
          } > requirements.lock
          pip-compile requirements.txt --no-header --quiet --strip-extras >> requirements.lock

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: regenerate requirements.lock"
          title: "chore: regenerate requirements.lock"
          body: |
            Automated regeneration of `requirements.lock` triggered by changes to `requirements.txt`.

            Review pinned versions for any unexpected upgrades before merging.
          branch: chore/regenerate-lockfile
          delete-branch: true

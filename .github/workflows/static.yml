# Deploy MkDocs documentation to GitHub Pages.
# Requires GitHub Pages to be enabled in repo Settings → Pages → Source: GitHub Actions.
# Triggers on push to main when docs or config change, or manually.
name: Deploy static content to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install "mkdocs>=1.6.0,<2.0.0" "mkdocs-material>=9.6.0,<10.0.0"

      - name: Build docs site
        # --no-strict: treat warnings as warnings, not errors, to avoid
        # blocking on missing optional plugins or broken external links.
        run: mkdocs build --site-dir site --no-strict

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # continue-on-error: Pages environment must be enabled in repo settings.
        # If not configured, the build artifact is still uploaded for inspection.
        continue-on-error: true

# Deploy documentation to GitHub Pages via MkDocs.
# Triggers on push to main when docs change, or manually via workflow_dispatch.
name: Deploy static content to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install "mkdocs>=1.6.0,<2.0.0" "mkdocs-material>=9.6.0,<10.0.0"

      - name: Build docs site
        # --strict turns warnings into errors so broken links are caught early.
        # Falls back to non-strict if mkdocs.yml has warnings from optional plugins.
        run: mkdocs build --site-dir site || mkdocs build --site-dir site --no-strict

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

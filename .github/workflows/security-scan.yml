name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        # Fails the build on any HIGH-severity finding (exit code 1).
        # Medium findings are reported but do not block (--severity-level high).
        # The previous "|| true" suppressed all findings including the eval() RCE.
        run: |
          bandit -r api/ auth/ brokers/ config/ core/ execution/ ml/ risk/ strategies/ \
            --severity-level high \
            -f json -o bandit-report.json
          bandit -r api/ auth/ brokers/ config/ core/ execution/ ml/ risk/ strategies/ \
            --severity-level high -q

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install safety
        run: pip install safety

      - name: Run safety check
        # Fails the build when any high/critical CVE is found in requirements.txt.
        # The previous "|| true" meant known CVEs never blocked a merge.
        run: |
          safety scan -r requirements.txt --output json > safety-report.json || true
          safety scan -r requirements.txt --severity high

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        # exit-code: '1' makes Trivy return non-zero when HIGH/CRITICAL findings exist.
        # The previous continue-on-error: true meant container CVEs never blocked merges.
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        # SARIF upload requires GitHub Advanced Security on private repos.
        # continue-on-error here is intentional — it only affects the upload
        # step, not the scan step above which already enforced exit-code: 1.
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret Detection
        # Fails the build when verified secrets are found in the diff.
        # Pinned to a specific version — @main is unstable.
        # Removed continue-on-error: true — a verified secret must block the merge.
        uses: trufflesecurity/trufflehog@v3.88.1
        with:
          path: ./
          base: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          head: HEAD
          extra_args: --only-verified

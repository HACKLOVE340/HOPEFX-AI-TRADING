name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        # Reports HIGH-severity findings but does not block CI — the codebase
        # has pre-existing HIGH findings tracked in the security dashboard.
        # Change || true to a hard exit once all HIGH findings are resolved.
        run: |
          bandit -r api/ auth/ brokers/ config/ core/ execution/ ml/ risk/ strategies/ \
            --severity-level high \
            -f json -o bandit-report.json || true
          bandit -r api/ auth/ brokers/ config/ core/ execution/ ml/ risk/ strategies/ \
            --severity-level high -q || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install safety
        run: pip install safety

      - name: Run safety check
        # safety scan requires authentication since Safety CLI 3.x.
        # Falls back to pip-audit (no auth required) when SAFETY_API_KEY is absent.
        # Both paths use || true — CVE reports go to the security dashboard,
        # not as CI blockers, until all transitive CVEs have fixes available.
        run: |
          if [ -n "$SAFETY_API_KEY" ]; then
            safety scan -r requirements.txt --output json > safety-report.json || true
            safety scan -r requirements.txt --severity high || true
          else
            echo "SAFETY_API_KEY not set — using pip-audit as fallback"
            pip install pip-audit
            pip-audit -r requirements.txt --desc --no-deps || true
          fi
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        # exit-code: '0' — report findings but do not block CI.
        # Trivy is used for visibility; Dependabot alerts are the enforcement
        # mechanism. Re-enable exit-code: '1' once all CRITICAL CVEs are resolved.
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Detection
        # Scans only the diff on push; full repo scan on schedule/PR.
        # --only-verified: only fail on secrets that are confirmed live.
        uses: trufflesecurity/trufflehog@v3.88.1
        with:
          path: ./
          base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'HEAD~1' }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

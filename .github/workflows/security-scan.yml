name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        # Fails the build on any HIGH-severity finding (exit code 1).
        # Medium findings are reported but do not block (--severity-level high).
        # The previous "|| true" suppressed all findings including the eval() RCE.
        run: |
          bandit -r api/ auth/ brokers/ config/ core/ execution/ ml/ risk/ strategies/ \
            --severity-level high \
            -f json -o bandit-report.json
          bandit -r api/ auth/ brokers/ config/ core/ execution/ ml/ risk/ strategies/ \
            --severity-level high -q

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install safety
        run: pip install safety

      - name: Run safety check
        # safety scan requires authentication since Safety CLI 3.x.
        # Falls back to pip-audit (no auth required) when SAFETY_API_KEY is absent.
        run: |
          if [ -n "$SAFETY_API_KEY" ]; then
            safety scan -r requirements.txt --output json > safety-report.json || true
            safety scan -r requirements.txt --severity high
          else
            echo "SAFETY_API_KEY not set — using pip-audit as fallback"
            pip install pip-audit
            pip-audit -r requirements.txt --desc --no-deps
          fi
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        # exit-code: '1' blocks on CRITICAL findings only.
        # HIGH findings are reported in SARIF but do not block merges —
        # many HIGH findings in transitive deps have no fix available yet.
        # Raise back to HIGH,CRITICAL once all transitive CVEs are resolved.
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        # SARIF upload requires GitHub Advanced Security on private repos.
        # continue-on-error here is intentional — it only affects the upload
        # step, not the scan step above which already enforced exit-code: 1.
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret Detection
        # Fails the build when verified secrets are found in the diff.
        # Pinned to a specific version — @main is unstable.
        # Removed continue-on-error: true — a verified secret must block the merge.
        uses: trufflesecurity/trufflehog@v3.88.1
        with:
          path: ./
          base: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          head: HEAD
          extra_args: --only-verified

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  bandit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        # Reports HIGH-severity findings but does not block CI — pre-existing
        # HIGH findings are tracked in the security dashboard.
        # Change || true to a hard exit once all HIGH findings are resolved.
        run: |
          bandit -r api/ auth/ brokers/ config/ core/ execution/ ml/ risk/ strategies/ \
            --severity-level high \
            -f json -o bandit-report.json || true
          # Ensure report file always exists so the upload step never errors
          test -f bandit-report.json || echo '{"results":[],"errors":[]}' > bandit-report.json
          bandit -r api/ auth/ brokers/ config/ core/ execution/ ml/ risk/ strategies/ \
            --severity-level high -q || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bandit-report
          path: bandit-report.json
          # Short retention — vulnerability details should not persist publicly
          retention-days: 14

  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install safety and pip-audit
        run: pip install safety pip-audit

      - name: Run safety check
        # safety scan requires authentication since Safety CLI 3.x.
        # Falls back to pip-audit (no auth required) when SAFETY_API_KEY is absent.
        # Both paths use || true — CVE reports go to the security dashboard,
        # not as CI blockers, until all transitive CVEs have fixes available.
        run: |
          if [ -n "$SAFETY_API_KEY" ]; then
            safety scan -r requirements.txt --output json > safety-report.json || true
            safety scan -r requirements.txt --severity high || true
          else
            echo "SAFETY_API_KEY not set — using pip-audit as fallback"
            pip-audit -r requirements.txt --desc --no-deps \
              --format json -o safety-report.json || true
          fi
          # Ensure report file always exists so the upload step never errors
          test -f safety-report.json || echo '[]' > safety-report.json
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: safety-report
          path: safety-report.json
          # Short retention — vulnerability details should not persist publicly
          retention-days: 14

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # security-events: write is required to upload SARIF to the Security tab.
      # On repos without GitHub Advanced Security (GHAS) this permission is
      # downgraded; continue-on-error on the upload step prevents that from
      # failing the whole job.
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        # Download pinned release asset directly — avoids executing a remote
        # shell script from main and makes failures easier to diagnose.
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.69.3"
          curl -sSL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf trivy.tgz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy version
          trivy fs . \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            --ignore-unfixed \
            --format sarif \
            --output trivy-results.sarif || true
          # Ensure file always exists so the upload step never errors
          test -f trivy-results.sarif || echo '{"version":"2.1.0","runs":[]}' > trivy-results.sarif

      - name: Upload Trivy scan results to GitHub Security tab
        # continue-on-error: SARIF upload requires GHAS; fails gracefully
        # on repos without it rather than blocking CI.
        uses: github/codeql-action/upload-sarif@5c8a8a642e79153f5d047b10ec1cba1d1cc65699  # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret Detection
        # Pinned to SHA for supply-chain safety (tag: v3.88.1)
        # continue-on-error: TruffleHog exits non-zero when verified secrets
        # are found; we report but do not block CI until the finding backlog
        # is cleared.  Also handles the zero-SHA edge case on first push to
        # a new branch where github.event.before is all zeros.
        uses: trufflesecurity/trufflehog@47e7b7cd74f578e1e3145d48f669f22fd1330ca6
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'HEAD~1' }}
          head: HEAD
          extra_args: --only-verified

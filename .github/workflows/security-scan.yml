name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install bandit
        run: pip install bandit[toml]
      
      - name: Run bandit
        # src/ was removed in V5; scan the canonical root packages instead.
        run: |
          bandit -r api/ auth/ brokers/ config/ core/ execution/ ml/ risk/ strategies/ \
            -f json -o bandit-report.json || true
          [ -f bandit-report.json ] || echo '{"results":[]}' > bandit-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install safety
        run: pip install safety
      
      - name: Run safety check
        # safety v3+ replaced `check` with `scan`; old syntax fails immediately.
        run: |
          safety scan -r requirements.txt || true
          [ -f safety-report.json ] || echo '{}' > safety-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        # SARIF upload requires GitHub Advanced Security on private repos.
        # continue-on-error prevents this from blocking the workflow.
        continue-on-error: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Secret Detection
        # Pinned to a specific version — @main is unstable and breaks without warning.
        # Null SHA guard prevents failures on first push to a new branch.
        uses: trufflesecurity/trufflehog@v3.88.1
        with:
          path: ./
          base: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

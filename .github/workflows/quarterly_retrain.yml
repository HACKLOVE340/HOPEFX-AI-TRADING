# HOPEFX-AI-TRADING — Quarterly Walk-Forward Retrain
#
# Runs on the first Sunday of each quarter (Jan, Apr, Jul, Oct) at 03:00 UTC.
# Also supports manual dispatch with selectable mode.
#
# Pipeline
# --------
#   1. Feature stability analysis  — drops unstable features before training
#   2. Full 50-year walk-forward retrain (8-year OOS, 6 folds)
#   3. Sharpe gate validation      — blocks promotion if N < 600 or gate fails
#   4. Model integrity check       — ml/verify_model.py
#   5. Registry update             — bumps active_version in registry.json
#   6. Artefact commit             — commits model metadata back to branch
#   7. Failure notification        — opens a GitHub issue on any step failure
#
# Secrets required
# ----------------
#   None for the retrain itself (yfinance is public).
#   SLACK_WEBHOOK_URL — optional Slack notification on failure.

name: Quarterly Walk-Forward Retrain

on:
  schedule:
    # First Sunday of Jan, Apr, Jul, Oct at 03:00 UTC.
    # GitHub Actions does not support "first Sunday of month" natively,
    # so we run every Sunday and the job self-gates on the quarter boundary.
    - cron: "0 3 * * 0"

  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = fast CI validate | full = 50Y retrain | feature_analysis = stability only"
        required: false
        default: "smoke"
        type: choice
        options:
          - smoke
          - full
          - feature_analysis

# Cancel any in-progress quarterly retrain on the same branch
concurrency:
  group: quarterly-retrain-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: "1"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Gate: only proceed on the first Sunday of a quarter month
  # ──────────────────────────────────────────────────────────────────────────
  quarter-gate:
    name: Quarter boundary check
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Check quarter boundary
        id: check
        run: |
          # Manual dispatch always runs
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MONTH=$(date -u +%-m)
          DAY=$(date -u +%-d)

          # Quarter months: 1 (Jan), 4 (Apr), 7 (Jul), 10 (Oct)
          IS_QUARTER_MONTH=false
          case "$MONTH" in
            1|4|7|10) IS_QUARTER_MONTH=true ;;
          esac

          # First Sunday of the month falls on day 1-7
          IS_FIRST_WEEK=$([ "$DAY" -le 7 ] && echo true || echo false)

          if [ "$IS_QUARTER_MONTH" = "true" ] && [ "$IS_FIRST_WEEK" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Quarter boundary confirmed: month=$MONTH day=$DAY"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Not a quarter boundary (month=$MONTH day=$DAY) — skipping retrain."
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Feature stability analysis
  # ──────────────────────────────────────────────────────────────────────────
  feature-stability:
    name: Feature stability analysis
    runs-on: ubuntu-latest
    needs: quarter-gate
    if: >
      needs.quarter-gate.outputs.should_run == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.mode == 'full' ||
       github.event.inputs.mode == 'feature_analysis')
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-quarterly-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: ${{ runner.os }}-pip-quarterly-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run feature stability analysis
        run: python scripts/feature_stability_analysis.py --output ml/saved_models/feature_stability.json
        env:
          PYTHONPATH: .

      - name: Upload stability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: feature-stability-${{ github.run_id }}
          path: ml/saved_models/feature_stability.json
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────
  # Smoke validate — always runs when should_run=true
  # ──────────────────────────────────────────────────────────────────────────
  smoke-validate:
    name: Smoke validate retrain pipeline
    runs-on: ubuntu-latest
    needs: quarter-gate
    if: needs.quarter-gate.outputs.should_run == 'true'
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-quarterly-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: ${{ runner.os }}-pip-quarterly-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Smoke validate retrain pipeline
        run: python scripts/retrain_horizon5.py --smoke
        env:
          PYTHONPATH: .

      - name: Verify model integrity
        run: python -m ml.verify_model
        env:
          PYTHONPATH: .
          ML_CI_MODE: "true"

  # ──────────────────────────────────────────────────────────────────────────
  # Full quarterly retrain — only on schedule or mode=full
  # ──────────────────────────────────────────────────────────────────────────
  full-retrain:
    name: Full quarterly retrain (50Y, 8Y OOS)
    runs-on: ubuntu-latest
    needs: [quarter-gate, smoke-validate, feature-stability]
    if: >
      needs.quarter-gate.outputs.should_run == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full'))
    timeout-minutes: 180

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-quarterly-full-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: ${{ runner.os }}-pip-quarterly-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Download feature stability report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: feature-stability-${{ github.run_id }}
          path: ml/saved_models/
        continue-on-error: true  # retrain proceeds even if stability report is missing

      - name: Run quarterly walk-forward retrain (50Y, OOS 8Y)
        run: |
          python scripts/retrain_model.py \
            --advanced \
            --years 50 \
            --oos-years 8
        env:
          PYTHONPATH: .
          RETRAIN_YEARS: "50"
          RETRAIN_OOS_YEARS: "8"
          RETRAIN_STACKING: "true"

      - name: Validate training artefacts
        run: python scripts/retrain_horizon5.py --verify-only
        env:
          PYTHONPATH: .

      - name: Verify model integrity
        run: python -m ml.verify_model
        env:
          PYTHONPATH: .

      - name: Print OOS metrics summary
        run: |
          python - <<'PYEOF'
          import json, sys
          from pathlib import Path

          meta_path = Path("ml/saved_models/advanced_oos_meta.json")
          if not meta_path.exists():
              print("[WARN] advanced_oos_meta.json not found")
              sys.exit(0)

          meta = json.loads(meta_path.read_text())
          sg = meta.get("sharpe_gate", {})

          print("=" * 60)
          print("QUARTERLY RETRAIN — OOS METRICS SUMMARY")
          print("=" * 60)
          print(f"  Symbol       : {meta.get('symbol', 'GC=F')}")
          print(f"  OOS period   : {meta.get('oos_period', 'unknown')}")
          print(f"  OOS accuracy : {meta.get('oos_accuracy', 0):.4f}  "
                f"(p={meta.get('oos_p_value', 1):.4f}  N={meta.get('oos_n', 0)})")
          print(f"  OOS F1       : {meta.get('oos_f1', 0):.4f}")
          print(f"  OOS AUC      : {meta.get('oos_auc', 0):.4f}")
          gate_status = 'PASSED' if sg.get('gate_passed') else 'FAILED'
          print(f"  Sharpe gate  : {gate_status}  "
                f"(N={sg.get('n_trades', 0)}  SE={sg.get('se', 0):.3f}  "
                f"Sharpe={sg.get('sharpe', 0):.2f})")
          print(f"  Features     : {meta.get('feature_count', '?')}")
          print(f"  Trained at   : {meta.get('trained_at', 'unknown')}")
          print("=" * 60)

          if not sg.get('gate_passed'):
              print("[BLOCKED] Sharpe gate FAILED — model NOT promoted to active.")
              sys.exit(1)
          PYEOF
        env:
          PYTHONPATH: .

      - name: Upload training artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: quarterly-retrain-${{ github.run_id }}
          path: |
            ml/saved_models/advanced_oos.pkl
            ml/saved_models/advanced_training_report.json
            ml/saved_models/advanced_oos_meta.json
            ml/saved_models/registry.json
            ml/saved_models/feature_stats.json
            ml/saved_models/feature_importances.json
            ml/saved_models/feature_stability.json
          retention-days: 365

      - name: Commit updated model registry back to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          QUARTER=$(python3 -c "
          from datetime import date
          d = date.today()
          q = (d.month - 1) // 3 + 1
          print(f'Q{q}-{d.year}')
          ")
          git add \
            ml/saved_models/registry.json \
            ml/saved_models/advanced_training_report.json \
            ml/saved_models/advanced_oos_meta.json \
            ml/saved_models/feature_stats.json \
            ml/saved_models/feature_importances.json \
            ml/saved_models/feature_stability.json || true
          if git diff --cached --quiet; then
            echo "No model registry changes to commit."
          else
            git commit -m "chore(ml): quarterly retrain ${QUARTER} — $(date -u +'%Y-%m-%d')"
            git push origin HEAD
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Notify on failure
  # ──────────────────────────────────────────────────────────────────────────
  notify-failure:
    name: Notify on retrain failure
    runs-on: ubuntu-latest
    needs: [smoke-validate, feature-stability, full-retrain]
    if: failure()

    permissions:
      issues: write

    steps:
      - name: Create GitHub issue on failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v7
        with:
          script: |
            const quarter = (() => {
              const d = new Date();
              const q = Math.floor(d.getMonth() / 3) + 1;
              return `Q${q}-${d.getFullYear()}`;
            })();
            const title = `[ML Quarterly Retrain] Pipeline failed — ${quarter}`;
            const body = [
              `## Quarterly Walk-Forward Retrain Failed`,
              ``,
              `**Quarter:** ${quarter}`,
              `**Workflow run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `**Branch:** ${context.ref}`,
              `**Triggered by:** ${context.eventName}`,
              ``,
              `### Impact`,
              `The production model has NOT been updated. The existing model continues to serve predictions.`,
              `Model trained on data up to the previous quarter will continue to degrade without retraining.`,
              ``,
              `### Next Steps`,
              `1. Review the workflow logs linked above`,
              `2. Check feature stability report for dropped features`,
              `3. Verify data availability (yfinance GC=F 50Y)`,
              `4. Re-trigger: Actions → Quarterly Walk-Forward Retrain → Run workflow → mode=full`,
              ``,
              `### Auto-close`,
              `This issue will be closed automatically when the next quarterly retrain succeeds.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ml', 'automated', 'retrain-failure', 'quarterly'],
            });

      - name: Slack notification (optional)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"⚠️ HOPEFX quarterly ML retrain FAILED on branch ${{ github.ref }}. Run ID: ${{ github.run_id }}\"}"

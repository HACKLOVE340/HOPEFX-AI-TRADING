# This project uses pip, not conda. This workflow is a no-op placeholder.
# Re-enable and populate if a conda environment.yml is ever added.
name: Python Package using Conda

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56745cba8c7296529d2fc39830  # v4
        with:
          persist-credentials: false
      - name: Check for environment.yml
        run: |
          if [ ! -f environment.yml ]; then
            echo "No environment.yml found - conda build not applicable for this project."
            exit 0
          fi
          echo "environment.yml found - running conda build."
          conda env create -f environment.yml

name: Codacy Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"  # Weekly on Monday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Run Codacy Analysis CLI
        # Pinned to SHA for supply-chain safety (tag: v4.4.5)
        # max-allowed-issues set to a realistic ceiling for security-only scan.
        # Lower this number in future PRs as findings are resolved.
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Upload SARIF results file
        # Pinned to SHA for supply-chain safety (tag: v3)
        uses: github/codeql-action/upload-sarif@5c8a8a642e79153f5d047b10ec1cba1d1cc65699  # v3
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
        continue-on-error: true

  # --------------------------------------------------------------------------
  # PR quality gate: run ruff + bandit on only the files changed in the PR.
  # Fails immediately if new lint errors or HIGH-severity security issues are
  # introduced, without being blocked by the existing issue backlog.
  # --------------------------------------------------------------------------
  pr-quality-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: PR Quality Gate (ruff + bandit on changed files)
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install "ruff>=0.9.0,<0.10.0" bandit[toml]

      - name: Get changed Python files
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only "$BASE" "$HEAD" -- '*.py' | \
            grep -v '^tests/' | \
            grep -v '^alembic/' | \
            grep -v '^examples/' | \
            grep -v '^frontend/' | \
            tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed Python files: $FILES"

      - name: ruff — no new lint errors
        if: steps.changed.outputs.files != ''
        # Hard failure: ruff is already clean; any error here is a regression.
        run: ruff check ${{ steps.changed.outputs.files }}

      - name: bandit — no new HIGH/CRITICAL security issues
        if: steps.changed.outputs.files != ''
        # Hard failure on HIGH+ findings in changed files.
        run: |
          bandit ${{ steps.changed.outputs.files }} \
            --severity-level high \
            --confidence-level medium \
            -q

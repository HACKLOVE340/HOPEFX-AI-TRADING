name: Codacy Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"  # Weekly on Monday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs are cancelled on feature branches and PRs; main is left alone
# because its runs are the release record. This block previously keyed the group
# on github.sha, giving every commit its own group — so it collided with nothing
# and superseded nothing, and every push queued another complete pipeline.
concurrency:
  group: codacy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Exists only so the scan job can gate on a secret. `secrets` is unavailable
  # in a job-level `if`, but `needs` is, and a step *can* read a secret into an
  # output.
  token-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      has_token: ${{ steps.probe.outputs.has_token }}
    steps:
      - id: probe
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -n "$CODACY_PROJECT_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "CODACY_PROJECT_TOKEN is not set — skipping the Codacy scan."
          fi

  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The action requires CODACY_PROJECT_TOKEN (Settings → Secrets → Actions) and
    # fails immediately without it. The job used to run anyway and swallow that
    # failure via continue-on-error, so every push checked out the repository and
    # started the action to reach a foregone conclusion.
    #
    # The guard must come through `needs`, not `secrets` directly: the secrets
    # context is not available in a job-level `if`, so `secrets.X != ''` there
    # evaluates as '' != '' and skips the job unconditionally — token or not.
    needs: token-check
    if: needs.token-check.outputs.has_token == 'true'
    # Still non-blocking when it does run: the scan reports findings, it does not
    # gate. pr-quality-gate below is the job in this file with teeth.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Codacy Analysis CLI
        # Pinned to SHA for supply-chain safety (tag: v4.4.5)
        # max-allowed-issues set to a realistic ceiling for security-only scan.
        # Lower this number in future PRs as findings are resolved.
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Upload SARIF results file
        # Pinned to SHA for supply-chain safety (tag: v4.37.3)
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
        continue-on-error: true

  # --------------------------------------------------------------------------
  # PR quality gate: run ruff + bandit on only the files changed in the PR.
  # Fails immediately if new lint errors or HIGH-severity security issues are
  # introduced, without being blocked by the existing issue backlog.
  # --------------------------------------------------------------------------
  pr-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    name: PR Quality Gate (ruff + bandit on changed files)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install "ruff>=0.9.0" bandit[toml]

      - name: Get changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            # On the very first push to a branch, before is all zeros — fall back to HEAD~1
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
          fi
          # --diff-filter=d drops DELETED paths. Without it this list contains
          # files the PR removed, and both ruff and bandit exit 1 with
          # "E902 No such file or directory" on a path that is gone — so any PR
          # that deletes a Python file fails the gate for having deleted it.
          # (Hit by this PR removing the shadowing `websocket/` package, S13-02a.)
          FILES=$(git diff --name-only --diff-filter=d "$BASE" "$HEAD" -- '*.py' | \
            grep -v '^tests/' | \
            grep -v '^alembic/' | \
            grep -v '^examples/' | \
            grep -v '^frontend/' | \
            tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed Python files: $FILES"

      - name: ruff — no new lint errors
        if: steps.changed.outputs.files != ''
        # Route through env var to prevent template-injection of filenames into shell.
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        # Hard failure: ruff is already clean; any error here is a regression.
        run: ruff check $CHANGED_FILES

      - name: bandit — no new HIGH/CRITICAL security issues
        if: steps.changed.outputs.files != ''
        # Route through env var to prevent template-injection of filenames into shell.
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        # Hard failure on HIGH+ findings in changed files.
        run: |
          bandit $CHANGED_FILES \
            --severity-level high \
            --confidence-level medium \
            -q

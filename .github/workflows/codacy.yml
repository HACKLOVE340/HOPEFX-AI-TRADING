name: Codacy Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"  # Weekly on Monday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # continue-on-error: the Codacy action requires CODACY_PROJECT_TOKEN to be
    # set in repo secrets (Settings → Secrets → Actions).  Until the token is
    # configured the action fails immediately; this prevents that from blocking
    # other CI checks.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Codacy Analysis CLI
        # Pinned to SHA for supply-chain safety (tag: v4.4.5)
        # max-allowed-issues set to a realistic ceiling for security-only scan.
        # Lower this number in future PRs as findings are resolved.
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Upload SARIF results file
        # Pinned to SHA for supply-chain safety (tag: v3)
        uses: github/codeql-action/upload-sarif@5c8a8a642e79153f5d047b10ec1cba1d1cc65699  # v3.35.1
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
        continue-on-error: true

  # --------------------------------------------------------------------------
  # PR quality gate: run ruff + bandit on only the files changed in the PR.
  # Fails immediately if new lint errors or HIGH-severity security issues are
  # introduced, without being blocked by the existing issue backlog.
  # --------------------------------------------------------------------------
  pr-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    name: PR Quality Gate (ruff + bandit on changed files)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install "ruff>=0.9.0" bandit[toml]

      - name: Get changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            # On the very first push to a branch, before is all zeros — fall back to HEAD~1
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
          fi
          FILES=$(git diff --name-only "$BASE" "$HEAD" -- '*.py' | \
            grep -v '^tests/' | \
            grep -v '^alembic/' | \
            grep -v '^examples/' | \
            grep -v '^frontend/' | \
            tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed Python files: $FILES"

      - name: ruff — no new lint errors
        if: steps.changed.outputs.files != ''
        # Route through env var to prevent template-injection of filenames into shell.
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        # Hard failure: ruff is already clean; any error here is a regression.
        run: ruff check $CHANGED_FILES

      - name: bandit — no new HIGH/CRITICAL security issues
        if: steps.changed.outputs.files != ''
        # Route through env var to prevent template-injection of filenames into shell.
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        # Hard failure on HIGH+ findings in changed files.
        run: |
          bandit $CHANGED_FILES \
            --severity-level high \
            --confidence-level medium \
            -q

name: Update Docs

on:
  push:
    branches: [main]
    paths:
      # Regenerate cover only when stats, scripts, or the generator itself change
      - "ml/saved_models/training_report.json"
      - "ml/saved_models/advanced_training_report.json"
      - "update_artifacts.py"
      - "README.md"
      - "docs/**"

  workflow_dispatch:   # allow manual trigger from GitHub UI

# Workflow-level permissions are read-only; write is scoped to the job that needs it.
permissions:
  contents: read

jobs:
  update-cover:
    name: Regenerate assets/cover.png
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to commit cover.png back to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # persist-credentials required: this job commits and pushes cover.png
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate cover image
        run: python update_artifacts.py --output assets/cover.png

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cover.png
          # Only commit when the file actually changed
          if git diff --cached --quiet; then
            echo "cover.png unchanged - nothing to commit."
          else
            git commit -m "chore: regenerate assets/cover.png [skip ci]"
            git push
          fi

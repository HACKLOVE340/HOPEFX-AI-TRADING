name: Update Docs

on:
  push:
    branches: [main]
    paths:
      # Regenerate cover only when stats, scripts, or the generator itself change
      - "ml/saved_models/training_report.json"
      - "ml/saved_models/advanced_training_report.json"
      - "update_artifacts.py"
      - "README.md"
      - "docs/**"

  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: write   # needed to commit cover.png back to the repo

jobs:
  update-cover:
    name: Regenerate assets/cover.png
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use a token with write access so the commit push works
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate cover image
        run: python update_artifacts.py --output assets/cover.png

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cover.png
          # Only commit when the file actually changed
          if git diff --cached --quiet; then
            echo "cover.png unchanged — nothing to commit."
          else
            git commit -m "chore: regenerate assets/cover.png [skip ci]"
            git push
          fi

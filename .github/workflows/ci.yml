name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  dependency-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Dependency vulnerability scan
        # Report CVEs but do not block merges — tracked separately in security dashboard.
        run: pip-audit --requirement=requirements.txt --desc || true
      - name: Scan with Trivy (supply-chain)
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Strict gate: risk analytics (VaR / GARCH)
      - name: mypy strict — risk/analytics.py + risk/advanced_analytics.py
        run: |
          mypy risk/analytics.py risk/advanced_analytics.py \
            --strict \
            --ignore-missing-imports \
            --allow-untyped-decorators \
            --no-error-summary

      # Strict gate: api/, risk/, ml/ — all three packages per roadmap
      - name: mypy strict — api/
        run: |
          mypy api/ \
            --strict \
            --ignore-missing-imports \
            --allow-untyped-decorators \
            --no-error-summary

      - name: mypy strict — risk/
        run: |
          mypy risk/ \
            --strict \
            --ignore-missing-imports \
            --allow-untyped-decorators \
            --no-error-summary

      - name: mypy strict — ml/
        run: |
          mypy ml/ \
            --strict \
            --ignore-missing-imports \
            --allow-untyped-decorators \
            --no-error-summary

      # Non-strict: remaining packages (surface regressions, don't block)
      - name: mypy — auth/ brokers/ config/ core/ execution/ strategies/
        run: |
          mypy auth/ brokers/ config/ core/ execution/ strategies/ \
            --ignore-missing-imports \
            --no-error-summary || true

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hopefx
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff (lint + format check)
        run: |
          ruff check api/ auth/ brokers/ config/ core/ execution/ ml/ risk/ strategies/
          ruff format --check api/ auth/ brokers/ config/ core/ execution/ ml/ risk/ strategies/

      - name: Run tests with coverage (full suite, 70% baseline)
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hopefx
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ \
            -m "not slow" \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v \
            --asyncio-mode=auto

      - name: Coverage gate — risk/ (90% required)
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hopefx
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ \
            -m "not slow" \
            --cov=risk \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --asyncio-mode=auto \
            -q

      - name: Coverage gate — execution/ (90% required)
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hopefx
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ \
            -m "not slow" \
            --cov=execution \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --asyncio-mode=auto \
            -q

      - name: Coverage gate — kill_switch.py (90% required)
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hopefx
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ \
            -m "not slow" \
            --cov=kill_switch \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --asyncio-mode=auto \
            -q

      - name: Coverage gate — brokers/ (90% required)
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hopefx
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ \
            -m "not slow" \
            --cov=brokers \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --asyncio-mode=auto \
            -q

      - name: Coverage gate — compliance/ (90% required)
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hopefx
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ \
            -m "not slow" \
            --cov=compliance \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --asyncio-mode=auto \
            -q

      - name: Security scan (bandit)
        run: |
          bandit -r api/ auth/ brokers/ config/ core/ execution/ ml/ risk/ strategies/ \
            -f json -o bandit-report.json || true

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          VITE_API_URL: http://localhost:8000/api
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

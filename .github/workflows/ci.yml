name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "frontend/**"
      - "dashboard/**"
      - "mobile/**"
      - "mobile-app/**"
      - "helm/**"
      - "k8s/**"
      - "docs/**"
      - "*.md"
      - "Dockerfile"
      - "docker-compose*.yml"
  pull_request:
    branches: [main]

# Use SHA so Dependabot bumps get their own group and don't cancel
# runs triggered by real code changes.
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - name: Cache pre-commit envs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit hooks
        # Pinned to SHA for supply-chain safety (tag: v3.0.1)
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install --retries 5 --timeout 60 pip-audit
      - name: Dependency vulnerability scan
        # Blocks on any CVE that has a real, available fix version — pip-audit's
        # own JSON schema has no severity field at all (a vuln's "aliases" are
        # just a plain list of CVE/GHSA ID strings, e.g. ["CVE-2024-23342",
        # "GHSA-wj6h-64fc-37mp"]), so a prior version of this script that tried
        # to read `.get("severity")` off each alias entry crashed with
        # AttributeError on every run that found anything ('str' object has no
        # attribute 'get') — meaning this step has been failing unconditionally
        # regardless of actual severity. There is no way to recover a CRITICAL-
        # only distinction from pip-audit's own data without an extra API call
        # per CVE, so this now blocks on the achievable, honest signal instead:
        # a known vulnerability where upstream has actually shipped a fix.
        # To suppress a false-positive: pip-audit --ignore-vuln GHSA-xxxx-xxxx-xxxx
        run: |
          pip-audit --requirement=requirements.txt --desc \
            --vulnerability-service pypi \
            --format json --output pip-audit-report.json || true
          python - <<'EOF'
          import json, sys
          try:
              data = json.load(open("pip-audit-report.json"))
          except Exception:
              sys.exit(0)  # no report = no vulns
          fixable = [
              v for dep in data.get("dependencies", [])
              for v in dep.get("vulns", [])
              if v.get("fix_versions")  # non-empty list = a real fix exists
          ]
          if fixable:
              print(f"BLOCKED: {len(fixable)} CVE(s) with an available fix:")
              for v in fixable:
                  print(f"  {v['id']}: {v.get('description', '')[:120]}")
              sys.exit(1)
          print("pip-audit: no fixable CVEs found")
          EOF
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4.4.3
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30
      - name: Scan with Trivy (supply-chain)
        # Download pinned release asset directly - avoids executing a remote
        # shell script from main and makes failures easier to diagnose.
        # --exit-code 1 blocks merges on CRITICAL or HIGH findings.
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.69.3"
          curl -sSL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf trivy.tgz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy version
          trivy fs . --severity CRITICAL,HIGH --exit-code 1 --format table

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-3.11-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ci-3.11-

      - name: Install dependencies
        # Use CI requirements - avoids C-extension build failures (quickfix, numba, etc.)
        # --retries 5 --timeout 60: guard against transient PyPI connection timeouts.
        run: |
          python -m pip install --upgrade --retries 5 --timeout 60 pip
          pip install --retries 5 --timeout 60 -r requirements-ci.txt
          pip install --retries 5 --timeout 60 mypy pandas-stubs types-redis types-pyyaml

      # Strict gate: only the two files already fully typed.
      # --follow-imports=silent: check only these two files strictly;
      # transitive imports (charting/, core/, etc.) are silenced so their
      # pre-existing type errors don't block this gate.
      - name: mypy strict - risk/analytics.py + risk/advanced_analytics.py
        run: |
          mypy risk/analytics.py risk/advanced_analytics.py \
            --strict \
            --ignore-missing-imports \
            --allow-untyped-decorators \
            --follow-imports=silent \
            --no-error-summary

      # Non-strict gates: surface regressions but don't block CI
      - name: mypy - api/
        run: mypy api/ --ignore-missing-imports --allow-untyped-decorators --no-error-summary || true

      - name: mypy - risk/
        run: mypy risk/ --ignore-missing-imports --allow-untyped-decorators --no-error-summary || true

      - name: mypy - ml/
        run: mypy ml/ --ignore-missing-imports --allow-untyped-decorators --no-error-summary || true

      - name: mypy - auth/ brokers/ config/ core/ execution/ strategies/
        run: |
          mypy auth/ brokers/ config/ core/ execution/ strategies/ \
            --ignore-missing-imports \
            --no-error-summary || true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: hopefx
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ matrix.python-version }}-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ci-${{ matrix.python-version }}-

      - name: Install dependencies
        # All test/lint tools (pytest, bandit, coverage, etc.) are in requirements-ci.txt.
        # --retries 5 --timeout 60: guard against transient PyPI connection timeouts.
        run: |
          python -m pip install --upgrade --retries 5 --timeout 60 pip
          pip install --retries 5 --timeout 60 -r requirements-ci.txt

      # ── Dead-file gate ────────────────────────────────────────────────────
      # Scan root-level *.py files for STATUS: SUPERSEDED or
      # TODO: Either wire ... or delete markers.  Fails the build immediately
      # so the team is forced to either wire the file into production or
      # delete it — no more silent accumulation of dead code in the root.
      # Requires no dependencies — runs before the full install to fail fast.
      - name: Dead-file detection (root *.py)
        run: |
          python3 - <<'PYEOF'
          import re, sys
          from pathlib import Path

          DEAD_MARKERS = [
              re.compile(r"STATUS:\s*SUPERSEDED", re.IGNORECASE),
              re.compile(r"TODO:\s*Either\s+wire\b", re.IGNORECASE),
          ]

          # Files explicitly exempted — add with justification and target date.
          EXEMPTIONS: set[str] = set()

          dead: list[tuple[str, list[tuple[int, str]]]] = []
          for py_file in sorted(Path(".").glob("*.py")):
              if py_file.name in EXEMPTIONS:
                  continue
              content = py_file.read_text(encoding="utf-8", errors="replace")
              hits = [
                  (lineno, line.strip())
                  for lineno, line in enumerate(content.splitlines(), 1)
                  for pat in DEAD_MARKERS
                  if pat.search(line)
              ]
              if hits:
                  dead.append((py_file.name, hits))

          if dead:
              print(f"\nERROR: {len(dead)} dead/unresolved Python file(s) in project root.")
              print("Resolution: wire into production, delete, or add to EXEMPTIONS")
              print("in tests/unit/test_dead_file_detection.py with a justification.\n")
              for name, hits in dead:
                  print(f"  {name}")
                  for lineno, text in hits:
                      print(f"    line {lineno:4d}: {text[:100]}")
              sys.exit(1)

          print(f"Dead-file check passed — no markers found in {len(list(Path('.').glob('*.py')))} root Python files.")
          PYEOF

      - name: Alembic migration smoke test
        # Verify all migrations apply cleanly to a fresh schema.
        # Uses the sync postgresql:// driver (psycopg2-binary) so Alembic's
        # synchronous engine works without asyncpg.
        # DB_URL uses the asyncpg prefix for the app; we strip it here.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hopefx  # pragma: allowlist secret
        run: alembic upgrade head

      - name: Run ruff (lint + format check)
        run: |
          pip install --retries 5 --timeout 60 "ruff>=0.9.0"
          ruff check \
            api/ auth/ brokers/ cache/ celery_app.py config/ core/ \
            data_feed/ execution/ kill_switch.py ml/ risk/ strategies/ utils/
          ruff format --check \
            api/ auth/ brokers/ cache/ celery_app.py config/ core/ \
            data_feed/ execution/ kill_switch.py ml/ risk/ strategies/ utils/

      # pylint W1300 (bad-format-string): catches %-format argument count
      # mismatches that ruff and mypy do not detect.  Run as a focused gate
      # rather than a full pylint pass to avoid noise from the existing backlog.
      # --disable=all --enable=W1300 ensures only this specific check runs.
      - name: pylint W1300 — bad-format-string gate
        run: |
          pip install --retries 5 --timeout 60 "pylint>=3.2.0,<4.0.0"
          pylint \
            --disable=all \
            --enable=W1300 \
            --rcfile=.pylintrc \
            api/ auth/ brokers/ cache/ celery_app.py config/ core/ \
            data_feed/ execution/ kill_switch.py ml/ risk/ strategies/ utils/ \
            || true
          # Run again without --fail-under fallback to block on W1300 violations.
          pylint \
            --disable=all \
            --enable=W1300 \
            --rcfile=.pylintrc \
            --output-format=text \
            api/ auth/ brokers/ cache/ celery_app.py config/ core/ \
            data_feed/ execution/ kill_switch.py ml/ risk/ strategies/ utils/

      # flake8-bugbear: detects likely bugs and design problems not caught by
      # ruff (mutable defaults, bare except, loop variable capture, etc.).
      # Only B-series checks are enabled; E/W/F codes are handled by ruff.
      # Config lives in .flake8 at the repo root.
      - name: flake8-bugbear gate
        run: |
          pip install --retries 5 --timeout 60 \
            "flake8>=7.0.0,<8.0.0" \
            "flake8-bugbear>=24.0.0,<25.0.0"
          flake8 \
            api/ auth/ brokers/ cache/ celery_app.py config/ core/ \
            data_feed/ execution/ kill_switch.py ml/ risk/ strategies/ utils/

      # Verify model integrity before running the full test suite.
      # Fails fast if the saved model is missing, corrupt, or fails the
      # Sharpe gate — prevents test noise from a broken ML stack.
      - name: Verify ML model integrity (ml/verify_model.py)
        env:
          ENVIRONMENT: testing
          ML_CI_MODE: "true"
        run: python -m ml.verify_model

      # Run the full suite once. Coverage data for all packages is collected
      # here and reused by the per-package gates below — no re-runs needed.
      - name: Run tests with coverage (full suite, 70% baseline)
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hopefx  # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379/0
          CONFIG_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"  # pragma: allowlist secret
          CONFIG_SALT: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"  # pragma: allowlist secret
          SECURITY_JWT_SECRET: "ci-test-secret-key-minimum-32-characters-long"  # pragma: allowlist secret
          ENVIRONMENT: testing
          OANDA_API_KEY: ci-placeholder  # pragma: allowlist secret
          OANDA_ACCOUNT_ID: ci-placeholder
          OANDA_PRACTICE: "true"
          INITIAL_BALANCE: "100000"
          ML_MIN_TRADE_PROB: "0.58"
          STRATEGY_MIN_BARS: "100"
          STRATEGY_TICKS_PER_BAR: "10"
          FIX_CONFIG_FILE: fix.cfg
        run: |
          pytest tests/ \
            -m "not slow and not e2e" \
            --cov --cov-config=.coveragerc \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --asyncio-mode=auto \
            --timeout=120 \
            -q

      # Invariant coverage report — pure introspection (no app boot). Fails the
      # build if a critical component lacks invariant or alert coverage. Cheap
      # meta-gate that catches "we added a component but forgot to protect it".
      - name: Invariant coverage report
        run: python scripts/invariant_coverage.py

      # Runtime invariant check — boots the app, probes endpoints, asserts output
      # invariants and scans the event log so "looks right, behaves wrong" fails
      # the build.  Exit 1 (invariant findings) fails CI; exit 2 (could not boot
      # in this environment) is surfaced as a warning, not a hard failure.
      - name: Runtime invariant check (output invariants)
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hopefx  # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379/0
          CONFIG_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"  # pragma: allowlist secret
          CONFIG_SALT: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"  # pragma: allowlist secret
          SECURITY_JWT_SECRET: "ci-test-secret-key-minimum-32-characters-long"  # pragma: allowlist secret
          ENVIRONMENT: testing
          OANDA_API_KEY: ci-placeholder  # pragma: allowlist secret
          OANDA_ACCOUNT_ID: ci-placeholder
          OANDA_PRACTICE: "true"
          INITIAL_BALANCE: "100000"
          HOPEFX_INVARIANT_MODE: monitor
        run: |
          set +e
          python scripts/runtime_invariant_check.py
          code=$?
          if [ "$code" = "1" ]; then
            echo "::error::Runtime invariant findings detected"
            exit 1
          elif [ "$code" = "2" ]; then
            echo "::warning::runtime_invariant_check could not boot the app (exit 2) — not failing the build"
            exit 0
          fi
          exit 0

      # Per-package coverage gates — read from the .coverage file produced above.
      # Uses `coverage report --include` to filter by package. No test re-runs.
      - name: Coverage gate - risk/ (80% required)
        run: coverage report --rcfile=.coveragerc --include="risk/*" --fail-under=80

      - name: Coverage gate - execution/ (80% required)
        run: coverage report --rcfile=.coveragerc --include="execution/*" --fail-under=80

      - name: Coverage gate - kill_switch.py (80% required)
        run: coverage report --rcfile=.coveragerc --include="kill_switch.py" --fail-under=80

      - name: Coverage gate - brokers/ (80% required)
        run: coverage report --rcfile=.coveragerc --include="brokers/*" --fail-under=80

      - name: Coverage gate - compliance/ (80% required)
        run: coverage report --rcfile=.coveragerc --include="compliance/*" --fail-under=80

      - name: Coverage gate - brain/ (70% required)
        run: coverage report --rcfile=.coveragerc --include="brain/*" --fail-under=70

      - name: Coverage gate - ml/ (70% required)
        run: coverage report --rcfile=.coveragerc --include="ml/*" --fail-under=70

      - name: Coverage gate - news/ (70% required)
        run: coverage report --rcfile=.coveragerc --include="news/*" --fail-under=70

      - name: Security scan (bandit)
        run: |
          bandit -r api/ auth/ brokers/ config/ core/ execution/ ml/ risk/ strategies/ \
            -f json -o bandit-report.json || true

      - name: Upload coverage to Qlty
        if: matrix.python-version == '3.11'
        # continue-on-error: QLTY_COVERAGE_TOKEN is optional; upload is best-effort.
        # Tests must not fail because a coverage reporting secret is absent.
        continue-on-error: true
        uses: qltysh/qlty-action/coverage@a19242102d17e497f437d7466aa01b528537e899  # v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage.xml

  build-cpp-shim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libzmq3-dev libzmq5

      - name: Cache CMake build directory
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: execution/cpp_shim/build
          key: cpp-shim-${{ runner.os }}-${{ hashFiles('execution/cpp_shim/CMakeLists.txt', 'execution/cpp_shim/hopefx_shim.cpp') }}
          restore-keys: |
            cpp-shim-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S execution/cpp_shim \
                -B execution/cpp_shim/build \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_FLAGS="-march=x86-64"

      - name: Build
        run: cmake --build execution/cpp_shim/build --parallel

      - name: Smoke-test binary
        run: |
          binary=execution/cpp_shim/build/hopefx_shim
          test -f "$binary" && test -x "$binary"
          # --health flag exits 0 when the shim starts cleanly
          timeout 5s "$binary" --health || true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # Pinned to Node 20 LTS — "lts/*" is non-deterministic and can
          # resolve to a new major that breaks cached installs mid-sprint.
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Configure npm for peer dep conflicts
        # Dependabot bumps (e.g. vite@8) can introduce peer dep conflicts
        # with plugins that haven't released support yet. --legacy-peer-deps
        # preserves npm v6 behaviour and keeps CI green while the ecosystem catches up.
        run: npm config set legacy-peer-deps true

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # playwright.config.ts builds the app and starts vite preview when CI=true.
        # PLAYWRIGHT_BASE_URL avoids IPv6/localhost resolution quirks.
        run: npx playwright test
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          VITE_API_URL: http://localhost:8000/api

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4.4.3
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch to free up runners
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Cache pre-commit envs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit hooks
        # Pinned to SHA for supply-chain safety (tag: v3.0.1)
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd

  dependency-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Dependency vulnerability scan
        # Report CVEs but do not block merges - tracked in security dashboard.
        run: pip-audit --requirement=requirements.txt --desc || true
      - name: Scan with Trivy (supply-chain)
        # Download pinned release asset directly - avoids executing a remote
        # shell script from main and makes failures easier to diagnose.
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.69.3"
          curl -sSL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf trivy.tgz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy version
          trivy fs . --severity CRITICAL,HIGH --exit-code 0 --format table

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-3.11-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ci-3.11-

      - name: Install dependencies
        # Use CI requirements - avoids C-extension build failures (quickfix, numba, etc.)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install mypy pandas-stubs types-redis types-pyyaml

      # Strict gate: only the two files already fully typed.
      # --follow-imports=silent: check only these two files strictly;
      # transitive imports (charting/, core/, etc.) are silenced so their
      # pre-existing type errors don't block this gate.
      - name: mypy strict - risk/analytics.py + risk/advanced_analytics.py
        run: |
          mypy risk/analytics.py risk/advanced_analytics.py \
            --strict \
            --ignore-missing-imports \
            --allow-untyped-decorators \
            --follow-imports=silent \
            --no-error-summary

      # Non-strict gates: surface regressions but don't block CI
      - name: mypy - api/
        run: mypy api/ --ignore-missing-imports --allow-untyped-decorators --no-error-summary || true

      - name: mypy - risk/
        run: mypy risk/ --ignore-missing-imports --allow-untyped-decorators --no-error-summary || true

      - name: mypy - ml/
        run: mypy ml/ --ignore-missing-imports --allow-untyped-decorators --no-error-summary || true

      - name: mypy - auth/ brokers/ config/ core/ execution/ strategies/
        run: |
          mypy auth/ brokers/ config/ core/ execution/ strategies/ \
            --ignore-missing-imports \
            --no-error-summary || true

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hopefx
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ matrix.python-version }}-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ci-${{ matrix.python-version }}-

      - name: Install dependencies
        # Use lightweight CI requirements - no C-extensions, no GPU deps.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install matplotlib "sentry-sdk[fastapi]>=2.0.0" \
            "pytest>=7.4.3" "pytest-cov>=4.1.0" "pytest-asyncio>=0.23.6" \
            "pytest-timeout>=2.2.0" bandit

      - name: Run ruff (lint + format check)
        run: |
          pip install "ruff>=0.9.0,<0.10.0"
          ruff check api/ auth/ brokers/ config/ core/ execution/ ml/ risk/ strategies/
          ruff format --check api/ auth/ brokers/ config/ core/ execution/ ml/ risk/ strategies/

      - name: Run tests with coverage (full suite, 70% baseline)
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hopefx
          REDIS_URL: redis://localhost:6379/0
          CONFIG_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          CONFIG_SALT: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          SECURITY_JWT_SECRET: "ci-test-secret-key-minimum-32-characters-long"
          ENVIRONMENT: testing
          OANDA_API_KEY: ci-placeholder
          OANDA_ACCOUNT_ID: ci-placeholder
          OANDA_PRACTICE: "true"
          INITIAL_BALANCE: "100000"
          ML_MIN_TRADE_PROB: "0.58"
          STRATEGY_MIN_BARS: "100"
          STRATEGY_TICKS_PER_BAR: "10"
          FIX_CONFIG_FILE: fix.cfg
        run: |
          pytest tests/ \
            -m "not slow" \
            --cov=auth \
            --cov=risk \
            --cov=brokers \
            --cov=execution \
            --cov=market_data \
            --cov=ml \
            --cov=config \
            --cov=kill_switch \
            --cov=compliance \
            --cov=analytics \
            --cov=backtesting \
            --cov-config=.coveragerc \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v \
            --asyncio-mode=auto \
            --timeout=120

      - name: Coverage gate - risk/ (90% required)
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hopefx
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
          SECURITY_JWT_SECRET: "ci-test-secret-key-minimum-32-characters-long"
        run: |
          pytest tests/ -m "not slow" -q \
            --cov=risk --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --asyncio-mode=auto \
            --timeout=120

      - name: Coverage gate - execution/ (90% required)
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hopefx
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
          SECURITY_JWT_SECRET: "ci-test-secret-key-minimum-32-characters-long"
        run: |
          pytest tests/ -m "not slow" -q \
            --cov=execution --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --asyncio-mode=auto \
            --timeout=120

      - name: Coverage gate - kill_switch.py (90% required)
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hopefx
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
          SECURITY_JWT_SECRET: "ci-test-secret-key-minimum-32-characters-long"
        run: |
          pytest tests/ -m "not slow" -q \
            --cov=kill_switch --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --asyncio-mode=auto \
            --timeout=120

      - name: Coverage gate - brokers/ (90% required)
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hopefx
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
          SECURITY_JWT_SECRET: "ci-test-secret-key-minimum-32-characters-long"
          OANDA_API_KEY: ci-placeholder
          OANDA_ACCOUNT_ID: ci-placeholder
          OANDA_PRACTICE: "true"
        run: |
          pytest tests/ -m "not slow" -q \
            --cov=brokers --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --asyncio-mode=auto \
            --timeout=120

      - name: Coverage gate - compliance/ (90% required)
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hopefx
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
          SECURITY_JWT_SECRET: "ci-test-secret-key-minimum-32-characters-long"
        run: |
          pytest tests/ -m "not slow" -q \
            --cov=compliance --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --asyncio-mode=auto \
            --timeout=120

      - name: Security scan (bandit)
        run: |
          bandit -r api/ auth/ brokers/ config/ core/ execution/ ml/ risk/ strategies/ \
            -f json -o bandit-report.json || true

      - name: Upload coverage to Qlty
        if: matrix.python-version == '3.11'
        # Pinned to SHA for supply-chain safety (tag: v2)
        uses: qltysh/qlty-action/coverage@a19242102d17e497f437d7466aa01b528537e899  # v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # playwright.config.ts builds the app and starts vite preview when CI=true.
        # PLAYWRIGHT_BASE_URL avoids IPv6/localhost resolution quirks.
        run: npx playwright test
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          VITE_API_URL: http://localhost:8000/api

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      security-patches:
        patterns:
          - "cryptography"
          - "PyJWT"
          - "passlib"
          - "bcrypt"
          - "pyotp"
          - "starlette"
          - "fastapi"
          - "uvicorn"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pin major versions — review manually before upgrading
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      # Optional deps in requirements-optional.txt — all entries are commented
      # out and not installed in CI. Ignore Dependabot alerts for these until
      # they are promoted to requirements.txt with a supported version.
      - dependency-name: "tensorflow"
      - dependency-name: "torch"
      - dependency-name: "ta-lib"
      - dependency-name: "TA-Lib"
      - dependency-name: "vectorbt"
      - dependency-name: "MetaTrader5"
      - dependency-name: "mlflow"
      - dependency-name: "alpaca-trade-api"
      - dependency-name: "binance-connector"
      - dependency-name: "celery"
      - dependency-name: "asyncio-mqtt"
      - dependency-name: "kaleido"
      - dependency-name: "pandas-ta"
      - dependency-name: "fastapi-offline"
      - dependency-name: "hiredis"
      - dependency-name: "polars"
      - dependency-name: "zipline-reloaded"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # npm (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      frontend-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm (dashboard)
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dashboard-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm (mobile-app) — was previously unmonitored: alerts had been piling up
  # unaddressed (axios, js-yaml, brace-expansion, shell-quote, postcss,
  # body-parser) with no Dependabot config watching this directory at all.
  - package-ecosystem: "npm"
    directory: "/mobile-app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      mobile-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

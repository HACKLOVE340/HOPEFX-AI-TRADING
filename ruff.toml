# ruff.toml — project-wide linting configuration
# https://docs.astral.sh/ruff/configuration/

line-length = 120
target-version = "py311"

exclude = [
    ".git",
    "__pycache__",
    "node_modules",
    "frontend",
    "alembic",
    "venv",
    ".venv",
    ".greptile.py",
    "examples",
]

[lint]

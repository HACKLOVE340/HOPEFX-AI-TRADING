# ruff.toml — project-wide linting configuration
# https://docs.astral.sh/ruff/configuration/

line-length = 120
target-version = "py311"

exclude = [
    ".git",
    "__pycache__",
    "node_modules",
    "frontend",
    "alembic",
    "venv",
    ".venv",
    ".greptile.py",
    "examples",
]

[lint]
select = [
    "E", "W", "F", "B", "S",
    "UP",
    "SIM",
    "RUF",
    "PIE",
    "PLR",
    "PLW",
    "C4",
    "N",
]
ignore = [
    "E501",
    "S101",
    "S603",
    "S607",
    "S608",
    "S324",
    "B008",
    # UP ignores — kept for broad compatibility
    "UP007",
    "UP017",
    "UP035",
    "UP006",
    "UP042",
    "UP036",
    # Noisy / low-value rules deferred to separate passes
    "RUF001", "RUF002", "RUF003",
    "N999",
    "S104",
    "S310",
    "S301",
    "S311",
    "S105",
    "S106",
    "S108",
    "S110",
    "S112",
    "S102",
    "PLR0913",
    "PLR0912",
    "PLR0915",
    "PLR0911",
    "N806",
    "N803",
    "N802",
    "N818",
    "N814",
    "N813",
    "RUF012",
    "RUF013",
    "RUF006",
    "PLW0603",
    "RUF059",
    "RUF022",
    "E402",
    "E741",
    "B023",
    "E712",
    "F403",
    "PLR0206",
    "RUF043",
    "N801",
    "N815",
    "N805",
    "N812",
    "PLR1714",
    "SIM116",
    "SIM101",
    "SIM113",
    "RUF005",
    "RUF015",
    "RUF019",
    "RUF021",
    "RUF023",
    "RUF046",
    "PIE807",
    "PIE808",
    "PIE810",
    "C408",
    "C401",
    "C416",
]

[lint.per-file-ignores]
# PLR2004: HTTP status codes and small numeric literals are acceptable in tests
"tests/**"             = ["S105", "S106", "S107", "S108", "S110", "S112", "S301", "S311", "PLR2004"]
"tests/unit/**"        = ["S105", "S106", "S107", "S108", "S110", "S112", "S301", "S311", "PLR2004"]
"tests/integration/**" = ["S105", "S106", "S107", "S108", "S110", "S112", "PLR2004"]
"scripts/**"           = ["E402"]
"locust/**"            = ["S311"]
"deployment/**"        = ["S105"]
"data_layer/feeds/**"  = ["S311"]

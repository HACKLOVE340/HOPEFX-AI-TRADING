<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HOPEFX — AI-powered gold and forex trading platform" />
    <title>HOPEFX</title>
    <style>
      /* ── CSS design tokens — dark (default) ─────────────────────────────── */
      :root,
      [data-theme="dark"] {
        --bg:            #0f172a;
        --surface:       #1e293b;
        --surface-raised:#243044;
        --border:        #334155;
        --border-subtle: #1e293b;
        --text:          #f1f5f9;
        --text-muted:    #94a3b8;
        --text-faint:    #64748b;
        --accent:        #3b82f6;
        --accent-hover:  #2563eb;
        --success:       #4ade80;
        --warning:       #fbbf24;
        --danger:        #f87171;
        --scrollbar-bg:  #0f172a;
        --scrollbar-thumb: #334155;
        --scrollbar-hover: #475569;
      }

      /* ── CSS design tokens — light ──────────────────────────────────────── */
      [data-theme="light"] {
        --bg:            #f8fafc;
        --surface:       #ffffff;
        --surface-raised:#f1f5f9;
        --border:        #e2e8f0;
        --border-subtle: #f1f5f9;
        --text:          #0f172a;
        --text-muted:    #475569;
        --text-faint:    #94a3b8;
        --accent:        #2563eb;
        --accent-hover:  #1d4ed8;
        --success:       #16a34a;
        --warning:       #d97706;
        --danger:        #dc2626;
        --scrollbar-bg:  #f1f5f9;
        --scrollbar-thumb: #cbd5e1;
        --scrollbar-hover: #94a3b8;
      }

      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background 0.2s, color 0.2s;
      }
      #root { height: 100%; }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: var(--scrollbar-bg); }
      ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

      /* Focus rings */
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button:focus:not(:focus-visible), input:focus:not(:focus-visible) { outline: none; }

      html { scrollbar-gutter: stable; }

      /* Shimmer animation for skeleton loaders */
      @keyframes shimmer {
        0%   { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>HOPEFX — AI-Powered Gold &amp; Forex Trading Platform</title>
    <meta name="description" content="HOPEFX: institutional-grade AI trading signals for gold (XAUUSD) and forex. LSTM + XGBoost models, live macro data, risk management, and strategy marketplace." />
    <meta name="keywords" content="AI trading, gold trading, forex trading, XAUUSD, algorithmic trading, trading signals, backtesting, risk management" />
    <meta name="author" content="HOPEFX" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://hopefx.io/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://hopefx.io/" />
    <meta property="og:title"       content="HOPEFX — AI-Powered Gold &amp; Forex Trading" />
    <meta property="og:description" content="Institutional-grade AI trading signals for gold and forex. LSTM + XGBoost models, live macro data, and a full risk management suite." />
    <meta property="og:image"       content="https://hopefx.io/og-image.png" />
    <meta property="og:site_name"   content="HOPEFX" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@hopefx_io" />
    <meta name="twitter:title"       content="HOPEFX — AI-Powered Gold &amp; Forex Trading" />
    <meta name="twitter:description" content="Institutional-grade AI trading signals for gold and forex. LSTM + XGBoost models, live macro data, and a full risk management suite." />
    <meta name="twitter:image"       content="https://hopefx.io/og-image.png" />

    <!-- Theme colour for mobile browsers -->
    <meta name="theme-color" content="#080c14" />

    <!-- iOS web-app meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HOPEFX" />

    <!-- Preconnect to font CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* ── CSS design tokens — dark (default) ─────────────────────────────── */
      :root,
      [data-theme="dark"] {
        --bg:            #0f172a;
        --surface:       #1e293b;
        --surface-raised:#243044;
        --border:        #334155;
        --border-subtle: #1e293b;
        --text:          #f1f5f9;
        --text-muted:    #94a3b8;
        --text-faint:    #64748b;
        --accent:        #3b82f6;
        --accent-hover:  #2563eb;
        --success:       #4ade80;
        --warning:       #fbbf24;
        --danger:        #f87171;
        --scrollbar-bg:  #0f172a;
        --scrollbar-thumb: #334155;
        --scrollbar-hover: #475569;
        --safe-top:    env(safe-area-inset-top,    0px);
        --safe-right:  env(safe-area-inset-right,  0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left:   env(safe-area-inset-left,   0px);
      }

      /* ── CSS design tokens — light ──────────────────────────────────────── */
      [data-theme="light"] {
        --bg:            #f8fafc;
        --surface:       #ffffff;
        --surface-raised:#f1f5f9;
        --border:        #e2e8f0;
        --border-subtle: #f1f5f9;
        --text:          #0f172a;
        --text-muted:    #475569;
        --text-faint:    #94a3b8;
        --accent:        #2563eb;
        --accent-hover:  #1d4ed8;
        --success:       #16a34a;
        --warning:       #d97706;
        --danger:        #dc2626;
        --scrollbar-bg:  #f1f5f9;
        --scrollbar-thumb: #cbd5e1;
        --scrollbar-hover: #94a3b8;
      }

      /* ── Reset ───────────────────────────────────────────────────────────── */
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      html {
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-gutter: stable;
        -webkit-overflow-scrolling: touch;
      }

      body {
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background 0.2s, color 0.2s;
        overflow-x: hidden;
      }

      #root {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* App shell locks viewport when authenticated layout is active */
      body.app-shell-active {
        overflow: hidden;
        height: 100%;
      }
      body.app-shell-active #root {
        height: 100%;
        overflow: hidden;
      }

      /* ── Custom scrollbar ────────────────────────────────────────────────── */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: var(--scrollbar-bg); }
      ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

      /* ── Focus rings ─────────────────────────────────────────────────────── */
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button:focus:not(:focus-visible),
      input:focus:not(:focus-visible) { outline: none; }

      /* ── Touch targets ───────────────────────────────────────────────────── */
      button, [role="button"] {
        touch-action: manipulation;
      }

      /* ── Shimmer animation for skeleton loaders ──────────────────────────── */
      @keyframes shimmer {
        0%   { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      /* ── Safe-area padding helpers ───────────────────────────────────────── */
      .pb-safe  { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe  { padding-top:    env(safe-area-inset-top,    0px); }
      .pl-safe  { padding-left:   env(safe-area-inset-left,   0px); }
      .pr-safe  { padding-right:  env(safe-area-inset-right,  0px); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

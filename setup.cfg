[tool:pytest]
# Convenience: run with coverage when pytest-cov is installed
# Usage: pytest --cov=. --cov-report=term-missing
# (The --cov flags are NOT in pytest.ini addopts to keep bare `pytest` fast)

[coverage:run]
source =
    config
    strategies
    risk
    brokers
    notifications
    cache
    database
    api
    data
    analysis
    ml
    utils
branch = true
omit =
    */tests/*
    */venv/*
    */.venv/*
    */site-packages/*
    */setup.py
    */conftest.py

[coverage:report]
precision = 2
skip_empty = True
show_missing = True

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml

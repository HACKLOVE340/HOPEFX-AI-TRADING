# pytest config lives in pytest.ini — no [tool:pytest] here.

[mutmut]
# Mutation testing configuration (mutmut v3).
#
# Target: trading-critical packages refactored in this session.
# These contain risk gates, ATR, SL/TP, drawdown, and circuit-breaker logic
# where a single wrong operator (< vs <=, + vs -) causes silent P&L damage.
#
# mutmut v3 requires directory paths, not individual files.
# Use do_not_mutate to exclude non-critical files within each package.
#
# Run:
#   mutmut run                    # mutate all paths_to_mutate
#   mutmut results                # list surviving mutants
#   mutmut show <id>              # inspect a specific survivor
#
# Surviving mutants indicate a test gap. Add a targeted test before merging.
#
# CI gate (fail on survivors):
#   mutmut run && mutmut results --exit-code
#
# Scoped test command (fast feedback — only the three new test files):
pytest_add_cli_args =
    tests/unit/test_property_based.py
    tests/unit/test_concurrency.py
    tests/unit/test_chaos.py
    -x
    -q
    --timeout=30
paths_to_mutate =
    core
    execution
    backtesting
    risk
# Exclude non-critical files within the targeted packages to keep run time
# manageable. Only the refactored modules and their direct helpers are mutated.
do_not_mutate =
    core/app_state.py
    core/lifespan.py
    core/logging_config.py
    core/middleware.py
    core/websocket_manager.py
    execution/algo_orders.py
    execution/oms.py
    execution/tca_recorder.py
    backtesting/data_loader.py
    risk/compliance

[pytest]
# Pytest configuration for HOPEFX AI Trading Framework

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests requiring live broker/network access — skipped in CI with -m "not e2e"
    slow: Slow tests (real ML training, subprocess spawning) — skipped in CI with -m "not slow"
    requires_redis: Tests that require Redis
    asyncio: Async tests (pytest-asyncio)

# pytest-asyncio mode: explicit 'auto' mode so that async test functions are
# handled automatically. This also prevents the INTERNALERROR that
# pytest-asyncio <0.23.6 produces in strict mode when a test module fails to
# import (defense-in-depth alongside the >=0.23.6 pin in requirements.txt).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output options (--cov flags moved to setup.cfg to avoid breaking bare `pytest` runs)
# timeout: 120s covers XGBoost walk-forward + multi-symbol backtest on CI hardware
# CI_FAST=1 is set in conftest.py — reduces XGBoost n_estimators 300→50 in tests
addopts =
    -v
    --strict-markers
    --tb=long
    --disable-warnings
    --timeout=120

filterwarnings =
    ignore

# Coverage configuration (used when pytest-cov is installed)

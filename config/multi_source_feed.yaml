# HOPEFX AI Trading — Multi-Source Tick Feed Configuration
#
# Fallback chain per symbol:
#   1. yFinance   — free, no key required, ~1-2 s polling
#   2. Alpha Vantage — free tier 25 req/day, 5 req/min; key required
#   3. Twelve Data — free tier 800 credits/day; key required
#
# Set API keys via environment variables.  Never commit real keys.
# Placeholder values here are used only when the env var is absent.

multi_source_feed:

  # ── Global settings ─────────────────────────────────────────────────────────

  # Ordered fallback chain — first healthy source wins each poll cycle.
  fallback_order:
    - "yfinance"
    - "alpha_vantage"
    - "twelve_data"

  # Polling interval in seconds (applies to all REST sources).
  refresh_seconds: 2

  # Per-request HTTP timeout (seconds).
  timeout_seconds: 5

  # Maximum retry attempts per provider before marking failure.
  max_retries: 3

  # Consecutive failures before circuit breaker opens.
  circuit_breaker_threshold: 5

  # Seconds before a tripped circuit breaker retries.
  circuit_breaker_cooldown: 60

  # Rolling in-memory tick history per symbol.
  history_size: 5000

  # Stale-data threshold: reject ticks older than this many seconds.
  max_stale_seconds: 30

  # Anomaly guard: reject ticks that jump more than this % from last price.
  anomaly_jump_pct: 5.0

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    host: "${REDIS_HOST:localhost}"
    port: "${REDIS_PORT:6379}"
    db:   "${REDIS_DB:0}"
    # Key pattern for latest tick: tick:SYMBOL  (e.g. tick:XAUUSD)
    tick_key_prefix: "tick"
    # Key TTL in seconds — ensures stale keys expire automatically.
    tick_key_ttl: 30
    # Pub/sub channel pattern: hopefx:tick:SYMBOL
    pubsub_channel_prefix: "hopefx:tick"
    # Legacy price_queue list key (NuclearStreamer compatibility).
    legacy_queue_key: "price_queue"

  # ── Symbols ──────────────────────────────────────────────────────────────────
  # Each symbol maps to its provider-specific ticker strings.
  # price_min / price_max define the plausible range for anomaly rejection.
  # Symbols with an empty alpha_vantage_symbol or twelve_data_symbol are
  # automatically skipped by the respective adapter.
  symbols:

    # ── Precious metals ───────────────────────────────────────────────────────
    XAUUSD:
      # yfinance: Yahoo no longer serves this contract (verified 2026-07-26:
      # 'possibly delisted, no price data found' at 1m/5m/1d). Left blank so the
      # feed skips straight to the next source instead of failing ~100x per symbol.
      # Spot metals/oil must come from twelve_data or alpha_vantage — the ETFs
      # (GLD/SLV/USO) do work on Yahoo but track a DIFFERENT price: GLD is ~$390
      # against spot gold ~$4,070, so quoting one as the other would be far worse
      # than no quote at all.
      yfinance_ticker:      ""
      alpha_vantage_symbol: "XAU"
      alpha_vantage_market: "USD"
      twelve_data_symbol:   "XAU/USD"
      price_min: 1000.0
      price_max: 10000.0

    XAGUSD:
      # yfinance: Yahoo no longer serves this contract (verified 2026-07-26:
      # 'possibly delisted, no price data found' at 1m/5m/1d). Left blank so the
      # feed skips straight to the next source instead of failing ~100x per symbol.
      # Spot metals/oil must come from twelve_data or alpha_vantage — the ETFs
      # (GLD/SLV/USO) do work on Yahoo but track a DIFFERENT price: GLD is ~$390
      # against spot gold ~$4,070, so quoting one as the other would be far worse
      # than no quote at all.
      yfinance_ticker:      ""
      alpha_vantage_symbol: "XAG"
      alpha_vantage_market: "USD"
      twelve_data_symbol:   "XAG/USD"
      price_min: 5.0
      price_max: 500.0

    XPTUSD:
      # yfinance: Yahoo no longer serves this contract (verified 2026-07-26:
      # 'possibly delisted, no price data found' at 1m/5m/1d). Left blank so the
      # feed skips straight to the next source instead of failing ~100x per symbol.
      # Spot metals/oil must come from twelve_data or alpha_vantage — the ETFs
      # (GLD/SLV/USO) do work on Yahoo but track a DIFFERENT price: GLD is ~$390
      # against spot gold ~$4,070, so quoting one as the other would be far worse
      # than no quote at all.
      yfinance_ticker:      ""
      alpha_vantage_symbol: "XPT"
      alpha_vantage_market: "USD"
      twelve_data_symbol:   "XPT/USD"
      price_min: 200.0
      price_max: 5000.0

    # ── Major FX pairs ────────────────────────────────────────────────────────
    EURUSD:
      yfinance_ticker:      "EURUSD=X"
      alpha_vantage_symbol: "EUR"
      alpha_vantage_market: "USD"
      twelve_data_symbol:   "EUR/USD"
      price_min: 0.5
      price_max: 2.5

    GBPUSD:
      yfinance_ticker:      "GBPUSD=X"
      alpha_vantage_symbol: "GBP"
      alpha_vantage_market: "USD"
      twelve_data_symbol:   "GBP/USD"
      price_min: 0.5
      price_max: 3.0

    USDJPY:
      yfinance_ticker:      "JPY=X"
      alpha_vantage_symbol: "USD"
      alpha_vantage_market: "JPY"
      twelve_data_symbol:   "USD/JPY"
      price_min: 50.0
      price_max: 200.0

    USDCHF:
      yfinance_ticker:      "CHF=X"
      alpha_vantage_symbol: "USD"
      alpha_vantage_market: "CHF"
      twelve_data_symbol:   "USD/CHF"
      price_min: 0.5
      price_max: 2.0

    AUDUSD:
      yfinance_ticker:      "AUDUSD=X"
      alpha_vantage_symbol: "AUD"
      alpha_vantage_market: "USD"
      twelve_data_symbol:   "AUD/USD"
      price_min: 0.3
      price_max: 1.5

    USDCAD:
      yfinance_ticker:      "CAD=X"
      alpha_vantage_symbol: "USD"
      alpha_vantage_market: "CAD"
      twelve_data_symbol:   "USD/CAD"
      price_min: 0.5
      price_max: 2.0

    NZDUSD:
      yfinance_ticker:      "NZDUSD=X"
      alpha_vantage_symbol: "NZD"
      alpha_vantage_market: "USD"
      twelve_data_symbol:   "NZD/USD"
      price_min: 0.3
      price_max: 1.5

    # ── Commodities ───────────────────────────────────────────────────────────
    USOIL:
      # WTI Crude Oil futures (continuous)
      # yfinance: Yahoo no longer serves this contract (verified 2026-07-26:
      # 'possibly delisted, no price data found' at 1m/5m/1d). Left blank so the
      # feed skips straight to the next source instead of failing ~100x per symbol.
      # Spot metals/oil must come from twelve_data or alpha_vantage — the ETFs
      # (GLD/SLV/USO) do work on Yahoo but track a DIFFERENT price: GLD is ~$390
      # against spot gold ~$4,070, so quoting one as the other would be far worse
      # than no quote at all.
      yfinance_ticker:      ""
      # Alpha Vantage has no direct WTI endpoint; empty string skips it.
      alpha_vantage_symbol: ""
      alpha_vantage_market: "USD"
      twelve_data_symbol:   "WTI/USD"
      price_min: 10.0
      price_max: 300.0

    # ── Crypto ────────────────────────────────────────────────────────────────
    BTCUSD:
      yfinance_ticker:      "BTC-USD"
      alpha_vantage_symbol: "BTC"
      alpha_vantage_market: "USD"
      twelve_data_symbol:   "BTC/USD"
      price_min: 1000.0
      price_max: 1000000.0

    ETHUSD:
      yfinance_ticker:      "ETH-USD"
      alpha_vantage_symbol: "ETH"
      alpha_vantage_market: "USD"
      twelve_data_symbol:   "ETH/USD"
      price_min: 100.0
      price_max: 100000.0

    # ── Equity indices ────────────────────────────────────────────────────────
    NAS100:
      # NASDAQ-100 futures (continuous)
      # NQ=F (futures) is delisted on Yahoo; ^NDX is the index itself and returns
      # data (verified 2026-07-26, 78 rows @5m).
      yfinance_ticker:      "^NDX"
      # Alpha Vantage does not expose index futures; empty string skips it.
      alpha_vantage_symbol: ""
      alpha_vantage_market: "USD"
      twelve_data_symbol:   "NDX"
      price_min: 5000.0
      price_max: 100000.0

    US30:
      # Dow Jones Industrial Average futures (continuous)
      # YM=F (futures) is delisted on Yahoo; ^DJI is the index itself and returns
      # data (verified 2026-07-26, 78 rows @5m).
      yfinance_ticker:      "^DJI"
      alpha_vantage_symbol: ""
      alpha_vantage_market: "USD"
      twelve_data_symbol:   "DJI"
      price_min: 10000.0
      price_max: 200000.0

  # ── yFinance ─────────────────────────────────────────────────────────────────
  # No API key required.  Uses yfinance library (pip install yfinance).
  # Rate limit: ~2000 req/hour per IP.  Suitable for 1-2 s polling.
  yfinance:
    enabled: true
    # yfinance download period for the latest price bar.
    period: "1d"
    interval: "1m"

  # ── Alpha Vantage ─────────────────────────────────────────────────────────────
  # Free tier: 25 requests/day, 5 requests/minute.
  # Docs: https://www.alphavantage.co/documentation/
  alpha_vantage:
    enabled: true
    api_key: "${ALPHA_VANTAGE_KEY:${ALPHA_VANTAGE_API_KEY:}}"
    base_url: "https://www.alphavantage.co/query"
    # Function used for FX rates and metals (XAU, XAG, XPT treated as currencies).
    fx_function: "CURRENCY_EXCHANGE_RATE"
    # Symbols with an empty alpha_vantage_symbol are skipped automatically.

  # ── Twelve Data ──────────────────────────────────────────────────────────────
  # Free tier: 800 API credits/day, 8 credits/minute.
  # Docs: https://twelvedata.com/docs#price
  twelve_data:
    enabled: true
    api_key: "${TWELVE_API_KEY:}"
    base_url: "https://api.twelvedata.com"
    # Endpoint for real-time price.
    price_endpoint: "/price"
    # Endpoint for quote (bid/ask).
    quote_endpoint: "/quote"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hopefx-ai-trading"
version = "1.0.0"
description = "Advanced AI-powered XAUUSD trading framework with machine learning"
readme = "README.md"
authors = [
    {name = "HOPEFX Team", email = "team@hopefx.ai"}
]
license = {text = "AGPL-3.0-only"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = ["trading", "ai", "machine-learning", "xauusd", "forex", "cryptocurrency", "bitcoin"]
dependencies = [
    # Core dependencies are read from requirements.txt
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.6",
    "pytest-timeout>=2.2.0",
    "black>=23.12.0",
    "ruff>=0.9.0",
    "mypy>=1.8.0",
]
docs = [
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/HACKLOVE340/HOPEFX-AI-TRADING"
Documentation = "https://github.com/HACKLOVE340/HOPEFX-AI-TRADING/blob/main/README.md"
Repository = "https://github.com/HACKLOVE340/HOPEFX-AI-TRADING"
"Bug Tracker" = "https://github.com/HACKLOVE340/HOPEFX-AI-TRADING/issues"

[project.scripts]
hopefx = "cli:main"
hopefx-server = "app:run_server"

[tool.setuptools.packages.find]
# Auto-discover all packages at the repo root.
# Excludes test directories, build artifacts, and the hopefx/ sub-codebase
# (which is a legacy parallel tree — root modules are canonical).
where = ["."]
exclude = ["tests*", "hopefx*", "src*", "build*", "dist*", "*.egg-info*"]

[tool.setuptools.package-data]
# Include py.typed markers (PEP 561) so downstream type checkers recognise
# these packages as typed.
"*" = ["*.txt", "*.md", "*.json", "*.yaml", "*.yml", "py.typed"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# pytest config lives in pytest.ini — no [tool.pytest.ini_options] here to
# avoid the "ignoring pytest config in pyproject.toml" warning on every run.


[tool.bandit]
# Only fail on high-severity findings; medium/low are reported but non-blocking.
# Tests and scripts are excluded — assert statements and hardcoded test
# credentials are expected in validation/bootstrap scripts.
severity = "high"
confidence = "medium"
exclude_dirs = ["tests", "alembic", "build", "dist", ".venv", "venv", "scripts", "locust", "examples"]
skips = [
    "B101",  # assert_used — acceptable in tests and guard clauses
    "B110",  # try_except_pass — contextlib.suppress preferred but not always possible
    "B311",  # random — non-crypto random is fine for simulations
    "B403",  # blacklist pickle — used with path confinement guards
    "B404",  # blacklist subprocess — used with fixed command lists only
    "B603",  # subprocess_without_shell — all calls use fixed arg lists, no user input
]

# ── mypy ──────────────────────────────────────────────────────────────────────
# Global defaults: non-strict for the annotation backlog.
# Per-module overrides below enforce strict on the risk-critical packages.
[tool.mypy]
python_version = "3.11"
# Prevents "HOPEFX-AI-TRADING is not a valid Python package name" when mypy
# is invoked from the repo root — the directory name contains uppercase and
# hyphens which are not valid Python identifiers.
explicit_package_bases = true
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
no_implicit_optional = true
# Exclude generated, vendored, test-fixture directories, and root-level
# legacy files that shadow canonical packages (e.g. execution.py vs execution/).
exclude = [
    "alembic/",
    "build/",
    "dist/",
    "site/",
    "\\.venv/",
    "venv/",
    "^execution\\.py$",
    "^ml/features\\.py$",
    "^ml/training\\.py$",
]

# Strict gate: risk analytics (VaR, GARCH, ES)
[[tool.mypy.overrides]]
module = ["risk.analytics", "risk.advanced_analytics"]
strict = true
warn_return_any = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
allow_untyped_decorators = true

# Strict gate: API layer
[[tool.mypy.overrides]]
module = ["api.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

# Strict gate: ML inference
[[tool.mypy.overrides]]
module = ["ml.inference_engine", "ml.live_inference", "ml.pipeline"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hopefx-ai-trading"
version = "1.0.0"
description = "Advanced AI-powered XAUUSD trading framework with machine learning"
readme = "README.md"
authors = [
    {name = "HOPEFX Team", email = "team@hopefx.ai"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = ["trading", "ai", "machine-learning", "xauusd", "forex", "cryptocurrency", "bitcoin"]
dependencies = [
    # Core dependencies are read from requirements.txt
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "flake8>=6.1.0",
    "pylint>=3.0.3",
]
docs = [
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/HACKLOVE340/HOPEFX-AI-TRADING"
Documentation = "https://github.com/HACKLOVE340/HOPEFX-AI-TRADING/blob/main/README.md"
Repository = "https://github.com/HACKLOVE340/HOPEFX-AI-TRADING"
"Bug Tracker" = "https://github.com/HACKLOVE340/HOPEFX-AI-TRADING/issues"

[project.scripts]
hopefx = "cli:main"
hopefx-server = "app:run_server"

[tool.setuptools.packages.find]
# Auto-discover all packages at the repo root.
# Excludes test directories, build artifacts, and the hopefx/ sub-codebase
# (which is a legacy parallel tree — root modules are canonical).
where = ["."]
exclude = ["tests*", "hopefx*", "src*", "build*", "dist*", "*.egg-info*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.json", "*.yaml", "*.yml"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# pytest config lives in pytest.ini — no [tool.pytest.ini_options] here to
# avoid the "ignoring pytest config in pyproject.toml" warning on every run.

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*/alembic/*",
    "*/migrations/*",
    "*/site-packages/*",
    "*/setup.py",
    "*/conftest.py",
]

[tool.coverage.report]
precision = 2
fail_under = 70
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
[tool.bandit]
# Only fail on high-severity findings; medium/low are reported but non-blocking.
# Tests are excluded — assert statements and hardcoded test credentials are expected.
severity = "high"
confidence = "medium"
exclude_dirs = ["tests", "alembic", "build", "dist", ".venv", "venv"]
skips = [
    "B101",  # assert_used — acceptable in tests and guard clauses
    "B311",  # random — non-crypto random is fine for simulations
]

[tool.mypy]
# Prevents "HOPEFX-AI-TRADING is not a valid Python package name" when mypy
# is invoked from the repo root — the directory name contains uppercase and
# hyphens which are not valid Python identifiers.
explicit_package_bases = true
ignore_missing_imports = true
# Exclude generated, vendored, test-fixture directories, and root-level
# legacy files that shadow canonical packages (e.g. execution.py vs execution/).
exclude = [
    "alembic/",
    "build/",
    "dist/",
    "site/",
    "\\.venv/",
    "venv/",
    "^execution\\.py$",
    "^ml/features\\.py$",
    "^ml/training\\.py$",
]

# duplicate [build-system] removed — kept setuptools declaration at top of file

services:
  redis:
    name: "Redis"
    description: "Redis — EventBus pub/sub and session cache"
    command: redis-server --daemonize no --loglevel warning --bind 127.0.0.1

  backend:
    name: "FastAPI Backend"
    description: "HOPEFX AI Trading API server (port 8000)"
    command: >
      cd /workspaces/HOPEFX-AI-TRADING &&
      [ -f .env ] || python3 scripts/bootstrap_dev.py &&
      OTEL_ENABLED=false APP_ENV=development REDIS_URL=redis://127.0.0.1:6379/0 REDIS_FORCE_TLS=false
      python3 run.py --mode api
    ready-on:
      http-request:
        url: http://localhost:8000/api/health
        timeout-seconds: 90

  frontend:
    name: "React Frontend (Vite dev)"
    description: "Vite dev server with HMR and /api proxy to backend (port 5173)"
    command: cd /workspaces/HOPEFX-AI-TRADING/frontend && npm run dev
    ready-on:
      http-request:
        url: http://localhost:5173
        timeout-seconds: 30

tasks:
  bootstrap:
    name: "Bootstrap dev environment"
    description: "Generate .env if missing, create the dev database, and print seed credentials"
    command: >
      cd /workspaces/HOPEFX-AI-TRADING &&
      python3 scripts/bootstrap_dev.py &&
      echo "" &&
      echo "Seed accounts (passwords are in .env):" &&
      echo "  superadmin  superadmin@hopefx.io  $(grep BOOTSTRAP_SUPERADMIN_PASSWORD .env | cut -d= -f2)" &&
      echo "  admin       admin@hopefx.io        $(grep BOOTSTRAP_ADMIN_PASSWORD .env | cut -d= -f2)" &&
      echo "  trader      trader@hopefx.io       $(grep BOOTSTRAP_TRADER_PASSWORD .env | cut -d= -f2)"

  retrain-smoke:
    name: "ML retrain smoke test"
    description: "Validate the retrain pipeline without downloading 50Y of data (< 5 min)"
    command: >
      cd /workspaces/HOPEFX-AI-TRADING &&
      PYTHONPATH=. python3 scripts/retrain_horizon5.py --smoke &&
      PYTHONPATH=. python3 -m ml.verify_model

  retrain-quarterly:
    name: "Quarterly walk-forward retrain"
    description: >
      Full production retrain: 50Y XAUUSD, 8Y OOS, 6-fold walk-forward.
      Runs feature stability analysis first, then trains the stacking ensemble.
      Requires network access to yfinance (GC=F). Takes 60-120 minutes.
    command: >
      cd /workspaces/HOPEFX-AI-TRADING &&
      PYTHONPATH=. python3 scripts/feature_stability_analysis.py
        --output ml/saved_models/feature_stability.json &&
      PYTHONPATH=. python3 scripts/retrain_model.py
        --advanced --years 50 --oos-years 8 &&
      PYTHONPATH=. python3 -m ml.verify_model &&
      echo "Quarterly retrain complete. Review ml/saved_models/advanced_oos_meta.json for OOS metrics."

  feature-stability:
    name: "Feature stability analysis"
    description: >
      Analyse which of the 222 features are stable across walk-forward folds.
      Writes ml/saved_models/feature_stability.json with stable/unstable lists.
    command: >
      cd /workspaces/HOPEFX-AI-TRADING &&
      PYTHONPATH=. python3 scripts/feature_stability_analysis.py
        --output ml/saved_models/feature_stability.json &&
      echo "Feature stability report written to ml/saved_models/feature_stability.json"

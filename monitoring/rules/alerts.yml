groups:
  # ---------------------------------------------------------------------------
  # Core API availability
  # ---------------------------------------------------------------------------
  - name: hopefx-critical
    rules:
      - alert: HopeFXAPIDown
        expr: up{job="hopefx-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HOPEFX API is down"
          description: "API instance {{ $labels.instance }} has been down for more than 1 minute"

      - alert: HopeFXHighErrorRate
        expr: rate(hopefx_http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"

      - alert: HopeFXHighLatency
        expr: histogram_quantile(0.95, rate(hopefx_latency_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency"
          description: "95th percentile latency is {{ $value }}s"

      - alert: HopeFXDailyLossLimit
        expr: hopefx_daily_pnl / hopefx_equity < -0.02
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Daily loss limit breached"
          description: "Daily loss is {{ $value | humanizePercentage }} of equity"

      - alert: HopeFXDatabaseConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database connections high"
          description: "{{ $value }} active connections"

      - alert: HopeFXRedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high"
          description: "Redis using {{ $value | humanizePercentage }} of memory"

  # ---------------------------------------------------------------------------
  # Circuit breakers
  # Metric: hopefx_circuit_breaker_state{breaker="<name>"}
  #   0 = closed (healthy)
  #   1 = half_open (probing)
  #   2 = open (failing — calls rejected)
  # Metric: hopefx_circuit_breaker_failures_total{breaker="<name>"}
  # ---------------------------------------------------------------------------
  - name: hopefx-circuit-breakers
    rules:
      # Any circuit breaker opens — immediate page
      - alert: HopeFXCircuitBreakerOpen
        expr: hopefx_circuit_breaker_state == 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker OPEN: {{ $labels.breaker }}"
          description: >
            The {{ $labels.breaker }} circuit breaker has opened after repeated
            failures. All calls to this service are being rejected immediately.
            Check service logs and the /api/health/deep endpoint.
            Breaker will probe again after its configured timeout.

      # Breaker stays open for >5 minutes — escalate
      - alert: HopeFXCircuitBreakerOpenExtended
        expr: hopefx_circuit_breaker_state == 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker OPEN >5 min: {{ $labels.breaker }}"
          description: >
            The {{ $labels.breaker }} circuit breaker has been open for more
            than 5 minutes. The underlying service has not recovered.
            Manual intervention may be required.

      # Broker circuit breaker specifically — highest severity
      - alert: HopeFXBrokerCircuitBreakerOpen
        expr: hopefx_circuit_breaker_state{breaker="broker"} == 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Broker circuit breaker OPEN — order execution halted"
          description: >
            The broker circuit breaker is open. No orders can be placed or
            managed. Check broker connectivity (TWS/Gateway/OANDA) and
            network. The kill switch may activate automatically.

      # Redis circuit breaker — affects session, pub/sub, kill switch
      - alert: HopeFXRedisCircuitBreakerOpen
        expr: hopefx_circuit_breaker_state{breaker="redis"} == 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Redis circuit breaker OPEN — cache and pub/sub unavailable"
          description: >
            The Redis circuit breaker is open. Session store, kill switch
            pub/sub, and rate limiting are degraded. Check Redis connectivity.

      # Database circuit breaker
      - alert: HopeFXDatabaseCircuitBreakerOpen
        expr: hopefx_circuit_breaker_state{breaker="database"} == 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Database circuit breaker OPEN — persistence unavailable"
          description: >
            The database circuit breaker is open. Trade records, user data,
            and audit logs cannot be persisted. Check PostgreSQL connectivity.

      # ML model circuit breaker
      - alert: HopeFXMLCircuitBreakerOpen
        expr: hopefx_circuit_breaker_state{breaker="ml_model"} == 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "ML model circuit breaker OPEN — signals degraded"
          description: >
            The ML model circuit breaker is open. Signal generation is
            degraded or disabled. The system may fall back to rule-based
            signals if configured. Check ml/saved_models/ and inference logs.

      # Half-open state persisting — service struggling to recover
      - alert: HopeFXCircuitBreakerHalfOpenStuck
        expr: hopefx_circuit_breaker_state == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker stuck in HALF_OPEN: {{ $labels.breaker }}"
          description: >
            The {{ $labels.breaker }} circuit breaker has been in HALF_OPEN
            state for more than 10 minutes, indicating the service is
            intermittently failing probes. Investigate root cause.

      # Failure rate spike — breaker not yet open but trending toward it
      - alert: HopeFXCircuitBreakerFailureRateHigh
        expr: rate(hopefx_circuit_breaker_failures_total[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker failure rate high: {{ $labels.breaker }}"
          description: >
            The {{ $labels.breaker }} circuit breaker is recording
            {{ $value | humanize }} failures/second over the last 5 minutes.
            The breaker may open soon if failures continue.

      # Multiple breakers open simultaneously — systemic failure
      - alert: HopeFXMultipleCircuitBreakersOpen
        expr: count(hopefx_circuit_breaker_state == 2) >= 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Multiple circuit breakers open ({{ $value }} services down)"
          description: >
            {{ $value }} circuit breakers are simultaneously open, indicating
            a systemic failure. The kill switch may activate automatically.
            Immediate investigation required.

  # ---------------------------------------------------------------------------
  # Auto-rollback events
  # Metric: hopefx_rollback_total{service="<name>"}
  # Metric: hopefx_rollback_strategy_total{strategy="soft|medium|hard|full"}
  # Metric: hopefx_rollback_trigger_total{trigger="<name>"}
  # Metric: hopefx_rollback_failed_total
  # ---------------------------------------------------------------------------
  - name: hopefx-rollback
    rules:
      # Any rollback triggered — always page
      - alert: HopeFXRollbackTriggered
        expr: increase(hopefx_rollback_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Auto-rollback triggered on {{ $labels.service }}"
          description: >
            An automatic rollback has been triggered on {{ $labels.service }}.
            {{ $value }} rollback(s) in the last 5 minutes.
            Check logs/app.log and the rollback audit trail in Redis
            (key: rollback:history). Investigate the root cause before
            re-deploying.

      # Hard or full rollback — code reverted, process restarted
      - alert: HopeFXHardRollbackTriggered
        expr: increase(hopefx_rollback_strategy_total{strategy=~"hard|full"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "HARD/FULL rollback triggered — code reverted"
          description: >
            A {{ $labels.strategy }} rollback has been executed. Code changes
            have been reverted via git and the process has been restarted.
            Verify the system is stable before re-deploying the failed version.

      # Rollback rate too high — repeated failures
      - alert: HopeFXRollbackRateHigh
        expr: rate(hopefx_rollback_total[30m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Rollback rate high — repeated failures detected"
          description: >
            More than 3 rollbacks in the last 30 minutes. The system is
            repeatedly failing and rolling back. This indicates a persistent
            issue that automated recovery cannot resolve. Manual intervention
            required.

      # Rollback triggered by circuit breaker open
      - alert: HopeFXRollbackFromCircuitBreaker
        expr: increase(hopefx_rollback_trigger_total{trigger="circuit_breaker_open"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Rollback triggered by circuit breaker opening"
          description: >
            An automatic rollback was triggered because a circuit breaker
            opened. This means a service failure caused both the circuit
            breaker to open AND a rollback to execute. Check which breaker
            opened and why.

      # Rollback triggered by kill switch
      - alert: HopeFXRollbackFromKillSwitch
        expr: increase(hopefx_rollback_trigger_total{trigger="kill_switch_activated"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Rollback triggered by kill switch activation"
          description: >
            An automatic rollback was triggered because the kill switch was
            activated. Trading is halted. Investigate the kill switch reason
            before deactivating.

      # Rollback triggered by health check failure
      - alert: HopeFXRollbackFromHealthCheck
        expr: increase(hopefx_rollback_trigger_total{trigger="health_check_failed"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Rollback triggered by post-deploy health check failure"
          description: >
            A post-deploy health check failed and triggered an automatic
            rollback. The deployment has been reverted. Review the health
            check output and fix the issue before re-deploying.

      # Rollback failed — system in unknown state
      - alert: HopeFXRollbackFailed
        expr: increase(hopefx_rollback_failed_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Auto-rollback FAILED — system in unknown state"
          description: >
            An automatic rollback was attempted but failed. The system may
            be in an inconsistent state. Immediate manual intervention is
            required. Check logs/app.log for rollback error details.

  # ---------------------------------------------------------------------------
  # Startup probe
  # Metric: hopefx_startup_complete (0=not started, 1=complete)
  # ---------------------------------------------------------------------------
  - name: hopefx-startup
    rules:
      - alert: HopeFXStartupSlow
        expr: hopefx_startup_complete == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "HOPEFX startup taking more than 3 minutes"
          description: >
            The application has been starting for more than 3 minutes without
            completing. Check /api/health/startup for which tasks are pending.
            This may indicate a slow DB migration, Redis connection issue, or
            ML model load failure.

      - alert: HopeFXStartupFailed
        expr: hopefx_startup_complete == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "HOPEFX startup has not completed after 10 minutes"
          description: >
            The application startup probe has not returned 200 after 10
            minutes. The pod is likely stuck. Check container logs and
            consider restarting the pod.

  # ---------------------------------------------------------------------------
  # P&L Reconciliation
  # ---------------------------------------------------------------------------
  - name: hopefx-pnl-reconciliation
    rules:
      - alert: HopeFXPnLReconciliationGateFailed
        expr: hopefx_pnl_recon_gate_passed == 0 and hopefx_sharpe_n_trades > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "P&L reconciliation gate failed"
          description: >
            The P&L reconciliation gate is blocked. Ledger P&L and broker-reported
            P&L have diverged beyond tolerance, or no fresh reconciliation snapshot
            exists. Model promotion is blocked until this is resolved.
            Run: python -m ml.pnl_reconciler --reconcile

      - alert: HopeFXPnLDivergenceHigh
        expr: hopefx_pnl_recon_divergence > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "P&L divergence between ledger and broker exceeds $5"
          description: >
            Absolute P&L divergence is {{ $value | humanize }} USD.
            Investigate unrecorded fills in execution/hopefx_engine.py.

      - alert: HopeFXPnLDivergenceWarning
        expr: hopefx_pnl_recon_divergence > 1 and hopefx_pnl_recon_divergence <= 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P&L divergence between ledger and broker exceeds $1"
          description: >
            Absolute P&L divergence is {{ $value | humanize }} USD.
            Check for slippage discrepancies or partially recorded fills.

      - alert: HopeFXPnLReconciliationStale
        expr: (time() - hopefx_pnl_recon_gate_passed offset 25h) > 0 or absent(hopefx_pnl_recon_gate_passed)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "P&L reconciliation has not run in over 24 hours"
          description: >
            The P&L reconciler has not published metrics in over 24 hours.
            Ensure the reconciliation background task is running and the broker
            is connected. Run: python -m ml.pnl_reconciler --reconcile

  - name: hopefx-ml-regime
    rules:

      # Fold-2 below-chance regime — ref: docs/FOLD2_REGIME_ANALYSIS.md
      # Walk-forward Fold 2 = 44.4% (below chance). Model abstains in
      # HIGH_VOL_PARABOLIC (parabolic blow-off / post-bubble crash).
      - alert: HopeFXFold2ParabolicRegime
        expr: hopefx_regime_conditional_regime_fraction{regime="high_vol_parabolic"} > 0.20
        for: 30m
        labels:
          severity: warning
          component: ml-regime
        annotations:
          summary: "Market in Fold-2 below-chance regime (HIGH_VOL_PARABOLIC)"
          description: >
            {{ $value | humanizePercentage }} of recent bars match the documented
            Fold-2 parabolic / post-bubble regime (model scored 44.4% there). The
            model is abstaining; expect reduced signal coverage. Do NOT override.
            Ref: docs/FOLD2_REGIME_ANALYSIS.md.

      - alert: HopeFXFold2AbstainActive
        expr: rate(hopefx_regime_conditional_predict_total{regime="high_vol_parabolic"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
          component: ml-regime
        annotations:
          summary: "Model abstaining on live signals (Fold-2 parabolic regime)"
          description: >
            Live predictions landed in HIGH_VOL_PARABOLIC over the last 15m
            (close > 1.30*MA200, or rv14 > 2.5*rv90 with price <= 75% of 200-bar
            peak). Confirm risk sizing is reduced. Ref: docs/FOLD2_REGIME_ANALYSIS.md.

  # ---------------------------------------------------------------------------
  # Constitutional invariant enforcement  (docs/INVARIANT_ROLLOUT.md)
  # Metrics (synced by prometheus_monitoring.py):
  #   hopefx_invariant_mode               0=off 1=monitor 2=enforce
  #   hopefx_invariant_engine_healthy     1=engine self-check passing
  #   hopefx_invariant_checks_total       cumulative checks run
  #   hopefx_invariant_violations_total   cumulative violations detected
  #   hopefx_invariant_blocked_total      cumulative orders refused (enforce)
  #   hopefx_invariant_halts_signalled_total  cumulative kill-switch trips
  #   hopefx_invariant_checker_errors_total   cumulative checker-internal errors
  # ---------------------------------------------------------------------------
  - name: hopefx-invariants
    rules:
      # The invariant engine itself is the monitor — if it is unhealthy, the
      # protection layer is blind. Page immediately ("monitor the monitors").
      - alert: HopeFXInvariantEngineUnhealthy
        expr: hopefx_invariant_engine_healthy == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Invariant engine self-check FAILING"
          description: >
            hopefx_invariant_engine_healthy == 0 — the constitutional invariant
            engine cannot verify itself. The enforcement layer is blind. Check
            /health/invariants and recent deploys.

      # A bug inside a checker — surfaces silently failing-open enforcement.
      - alert: HopeFXInvariantCheckerErrors
        expr: increase(hopefx_invariant_checker_errors_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Invariant checker raised an internal error"
          description: >
            {{ $value | humanize }} checker error(s) in 10m. A checker is failing
            (fail-open by default, so trades are NOT blocked by it). Investigate
            the offending predicate before relying on enforce mode.

      # Any violation during the SOAK (monitor mode) is a would-be block — review.
      - alert: HopeFXInvariantViolationsDuringSoak
        expr: increase(hopefx_invariant_violations_total[15m]) > 0 and hopefx_invariant_mode == 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Invariant violations during monitor-mode soak"
          description: >
            {{ $value | humanize }} violation(s) in 15m while in MONITOR mode —
            each is an order/cycle that WOULD be blocked under enforce. Review
            /health/invariants `recent` and confirm they are true positives
            before flipping to enforce. (docs/INVARIANT_ROLLOUT.md)

      # In enforce mode, blocked orders are expected on bad input but a spike
      # may indicate a bad threshold or a real incident.
      - alert: HopeFXInvariantBlockSpike
        expr: increase(hopefx_invariant_blocked_total[5m]) > 5 and hopefx_invariant_mode == 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Invariant enforcement is blocking orders ({{ $value | humanize }}/5m)"
          description: >
            Enforce mode refused {{ $value | humanize }} order(s) in 5m. Confirm
            these are genuine constitutional breaches and not a mis-set threshold.
            Roll back to monitor (HOPEFX_INVARIANT_MODE=monitor) if false-positive.

      # A constitutional reconciliation breach tripped the kill switch.
      - alert: HopeFXInvariantKillSwitchTrip
        expr: increase(hopefx_invariant_halts_signalled_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Invariant reconciliation breach tripped the kill switch"
          description: >
            A CONSTITUTIONAL reconciliation breach signalled a halt. Trading is
            halted. Reconcile DB vs broker positions before clearing the kill
            switch (see kill_switch deactivate runbook).

apiVersion: v1
kind: ConfigMap
metadata:
  name: hopefx-config
  namespace: hopefx
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  TRADING_MODE: "paper"
  DB_POOL_SIZE: "20"
  REDIS_SOCKET_TIMEOUT: "5"
  # Constitutional invariant enforcement — see docs/INVARIANT_ROLLOUT.md.
  # monitor = observe + log (safe default); flip to "enforce" after a clean soak.
  HOPEFX_INVARIANT_MODE: "monitor"
  # Staged rollout: enforce these checks while the global mode stays monitor.
  # order_authorization + pre_trade refuse single orders (cannot halt the desk);
  # reconciliation + ledger can trip the kill switch (halt ALL trading) on a
  # book-value/PnL or capital-equation breach — keep RECONCILER_DRIFT_VALUE sane and
  # HOPEFX_INVARIANT_FAIL_CLOSED="0". Remove a kind to roll it back instantly; when
  # all have soaked clean, collapse to HOPEFX_INVARIANT_MODE="enforce".
  HOPEFX_INVARIANT_ENFORCE_KINDS: "order_authorization,pre_trade,reconciliation,ledger"
  HOPEFX_INVARIANT_FAIL_CLOSED: "0"
  RISK_MAX_TICK_STALENESS_S: "5.0"
  RISK_MAX_SYMBOL_EXPOSURE_USD: "1000000.0"
  RISK_APPROVED_VAR_USD: "0"

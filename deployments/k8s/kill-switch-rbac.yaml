# deployments/k8s/kill-switch-rbac.yaml
# RBAC for kill switch ConfigMap access.
#
# The kill switch has five independent activation layers so that no single
# dependency can silence it. Layer 5 — the K8s ConfigMap watcher — is the
# documented fallback for when Redis (layer 4) is down, and it needs RBAC to
# get and patch the hopefx-kill-switch ConfigMap.
#
# This directory shipped without any RBAC manifest and with no
# serviceAccountName on the Deployment, so pods ran as the namespace `default`
# ServiceAccount and every get/patch was denied. A cluster deployed from here
# lost layer 5 entirely, and an operator who hit the kill switch stopped the
# pod they reached and no other (F139).
#
# Mirrors k8s/kill-switch-rbac.yaml deliberately: two manifest sets that grant
# different privileges for the same control is how the gap appeared.
#
# Scope: namespace-scoped, one named ConfigMap, two verbs. No cluster-wide
# permissions, no wildcard verbs.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hopefx-api
  namespace: hopefx
  labels:
    app.kubernetes.io/part-of: hopefx-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kill-switch-configmap-rw
  namespace: hopefx
  labels:
    app.kubernetes.io/part-of: hopefx-platform
    app.kubernetes.io/component: kill-switch
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["hopefx-kill-switch"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hopefx-api-kill-switch-configmap
  namespace: hopefx
  labels:
    app.kubernetes.io/part-of: hopefx-platform
    app.kubernetes.io/component: kill-switch
subjects:
  - kind: ServiceAccount
    name: hopefx-api
    namespace: hopefx
roleRef:
  kind: Role
  name: kill-switch-configmap-rw
  apiGroup: rbac.authorization.k8s.io

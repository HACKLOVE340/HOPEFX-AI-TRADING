[[gate]]
id = "gate_c_docker_compose"
kind = "ci_gate"
runs = "scripts/ci/gate_c_docker_compose.py"
evidence = "tests/unit/test_gate_c_docker_compose_injections.py"
injected = "Against a real mutated copy of docker-compose.yml (not synthetic): PAPER_TRADING defaulting to false, IS_FORCE_TLS and REDIS_FORCE_TLS defaulting to true, and alertmanager switched to image: without build: — all four fail, on both the PyYAML path and the regex fallback path checked directly. A sanity probe (temporarily disabling the PAPER_TRADING check) confirmed the suite would have caught a real regression before trusting the clean pass. No defect found — this one was already alive"

[[gate]]
id = "gate_d_model_accuracy"
kind = "ci_gate"
runs = "scripts/ci/gate_d_model_accuracy.py"
evidence = "tests/unit/test_gate_d_model_accuracy_injections.py"
injected = "Fifteen refusals against a consistent mirror: missing/invalid registry, missing or dangling active_version, missing symlink, a regular file in its place, a symlink to the wrong model, a tampered file failing SHA-256, an entry with no hash, sharpe_gate_passed=False, Sharpe under the floor, too few trades to be credible, a non-active state, missing meta, horizon mismatch, meta/registry hash mismatch, and oos_accuracy=null. The wrapper is proven to propagate rather than report its own success — an inner exit 3 stays 3 and never prints PASSED. This gate was deferred twice as needing a manifest-level injection because it \"validates 38 MB of artefacts resolved from __file__\"; that premise was wrong. The gate requires the artefacts to be CONSISTENT, not large: a 28-byte file whose real SHA-256 is written into a synthetic registry exercises every check, mirrors are about a kilobyte, and the suite runs in 4 seconds with no change to the production script. No defect found — alive"

[[gate]]
id = "gate_e_dead_files"
kind = "ci_gate"
runs = "scripts/ci/gate_e_dead_files.py"
evidence = "tests/unit/test_gate_e_dead_files_injections.py"
injected = "An unimported file in each guarded package fails; three real defects found and fixed along the way, not just a coverage gap. (1) kill_switch is a single top-level file, not a directory — _collect_py_files checked root/'kill_switch' only and always returned [], so the guard silently checked nothing. (2) import execution.live synthesised bare 'execution' as an import, so mod.startswith(imp + '.') made every OTHER file in the package look live the moment any one file was imported — a genuinely dead sibling was invisible in every guarded package, always, in the real repo. (3) EXCLUDED_PATTERNS served two purposes at once: correctly kept app.py/__init__.py out of the guarded-candidate scan, but wrongly also kept them out of the import-SOURCE scan, so app.py's route-registration imports and __init__.py re-exports (real production wiring) went unseen — fixing (2) alone would have turned ~100 genuinely-live files into false positives. Confirmed on the real repository, not just the mirror: 12 real findings remain, tracked as their own follow-up rather than resolved here"

[[gate]]
id = "gate_f_doc_consistency"
kind = "ci_gate"
runs = "scripts/ci/gate_f_doc_consistency.py"
evidence = "tests/unit/test_gate_f_doc_consistency_injections.py"
injected = "A doc importing a module that does not exist, a name missing from a real module, and a PascalCase class the repo never defines all fail; external prefixes, SKIP_NAMES placeholders and prose outside fenced blocks correctly do not. The defect found here is the third instance of the gate M / gate K shape: a missing document was SKIPPED and the gate exited 0 — with all three absent it printed \"checked 3 docs, no violations\", a count taken from len(DOCS_TO_SCAN) rather than from anything read, so renaming ARCHITECTURE.md turned the gate off with CI green. Missing docs now fail closed, DOC_ALLOW_SKIP=1 is the explicit local opt-out (matching AB_ALLOW_SKIP and REQ_ALLOW_SKIP), and the reported count comes from what was actually checked"

[[gate]]
id = "gate_g_import_discipline"
kind = "ci_gate"
runs = "scripts/ci/gate_g_import_discipline.py"
evidence = "tests/unit/test_gate_g_import_discipline_injections.py"
injected = "Legacy imports (both statement forms, from a guarded package and from a top-level file) fail; the data_layer public surface is allowed; files inside data_layer may import each other. Two real gaps found and fixed, each confirmed by execution at exit 0 first: `from data_layer.sentiment import x` passed because the rule required three path segments though the public surface is exactly three NAMES, and `import data_layer.internal.thing` was never examined at all because only ast.ImportFrom was checked. Fixing both surfaced seven pre-existing violations across api/, ml/ and backtesting/ (data_layer.sentiment, .microstructure, .validation), now recorded in KNOWN_VIOLATIONS as warnings because resolving them means deciding data_layer public surface — owner decision A2 — not changing a gate. The escape hatch itself is pinned in both directions: a listed violation warns and exits 0, an unlisted one alongside it still fails, and a listed entry does not cover the same file on another line"

[[gate]]

[[gate]]
id = "adr-check"
kind = "precommit_hook"
runs = "scripts/adr.py"
evidence = "tests/unit/test_adr_gate_injections.py"
injected = "A one-option record, a missing section, an empty section, a supersede pointing at 0099, a numbering gap, and an unreferenceable filename — each refused, with the clean case asserted first so a gate that refused everything could not pass as one that works. Immutability is injected against a real throwaway git repository rather than a mock: an accepted record is committed, then edited, and the gate notices; a status-only change to `superseded by NNNN` is permitted, because a rule that forbids the correct action is one people route around."

[[gate]]
id = "change-record"
kind = "precommit_hook"
runs = "deployment.change_records"
evidence = "tests/unit/test_change_record_gate_injections.py"
injected = "ADVISORY BY DEFAULT — the one gate in this ledger that does not block. The owner chose warn over block on 2026-09-09 (ADR 0012); CHANGE_RECORD_ENFORCE=1 turns the same finding into a non-zero exit, and the injections cover both policies. Refused under enforcement: a core-tier change with no Expected-Effect trailer, one with a blank trailer, an unclassified package, a root entry point, and a CI-config change. NOT refused: a presentation-only change, because a gate that blocks everything is not a working gate — and the clean case is asserted first for the same reason. Four near-miss trailer forms are checked against the parser, and the policy itself has six tests: warn by default, the warning naming the trailer, the warning naming the switch, enforcement blocking, enforcement passing a compliant change, and validate() reporting the problem under either policy. This gate was itself nearly exempt from Rule 1: discovery matched only scripts/*.py entries and this hook runs `python -m`, so the ledger reported the same count before and after it was added."


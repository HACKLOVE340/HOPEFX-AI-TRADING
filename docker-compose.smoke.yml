# docker-compose.smoke.yml
# ========================
# CI smoke-test override.  Used exclusively by .github/workflows/docker-smoke.yml.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.smoke.yml up --wait
#
# What this override does
# -----------------------
# 1. Disables services that cannot reach healthy in a CI environment:
#      - nginx      — requires /etc/letsencrypt TLS certs (not present in CI)
#      - trading    — requires a fully initialised app + ML models
#      - celery-worker / celery-beat — require a running Celery broker queue
#      - prometheus / alertmanager / grafana — monitoring stack, not under test
#
# 2. Overrides Redis to use plain TCP (no TLS) so the app can connect without
#    a certificate chain.  IS_FORCE_TLS and REDIS_FORCE_TLS are set to false
#    for all services.
#
# 3. Injects minimal safe values for all :?required vars so docker compose
#    does not abort with "must be set in .env" before containers start.
#
# 4. Reduces start_period / retries on healthchecks so the job completes
#    within the 15-minute CI timeout.
#
# Services verified healthy by this smoke test
# ---------------------------------------------
#   postgres   — pg_isready passes
#   redis      — redis-cli ping returns PONG
#   app        — GET /api/health/live returns HTTP 200 with body containing "alive"
#
# This is the minimum set needed to assert:
#   - The Docker image builds successfully
#   - Database migrations apply cleanly (alembic upgrade head runs in entrypoint)
#   - The FastAPI app starts and its health endpoint responds
#   - Redis pub/sub backbone is reachable from the app container

services:

  # ── Override Redis: plain TCP, no TLS, lightweight CI auth ──────────────────
  redis:
    command: >
      redis-server
      --save ""
      --loglevel warning
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --requirepass ci-smoke-redis-password
    environment:
      # Keep auth enabled so the production startup validator still passes.
      REDIS_PASSWORD: "ci-smoke-redis-password"  # pragma: allowlist secret
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ci-smoke-redis-password ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Override app: disable TLS, inject minimal required env vars ──────────────
  app:
    environment:
      # Disable Redis TLS so the app connects to the plain-TCP CI Redis
      IS_FORCE_TLS: "false"
      REDIS_FORCE_TLS: "false"
      REDIS_URL: "redis://:ci-smoke-redis-password@redis:6379/0"
      # Override the base compose interpolation explicitly. The base file
      # resolves DATABASE_URL before this service override is merged, so its
      # password can otherwise differ from the CI postgres container.
      DATABASE_URL: "postgresql://hopefx:ci_smoke_password@postgres:5432/hopefx"  # pragma: allowlist secret
      ASYNC_DATABASE_URL: "postgresql+asyncpg://hopefx:ci_smoke_password@postgres:5432/hopefx"  # pragma: allowlist secret
      # Minimal required secrets — safe placeholder values for CI only
      POSTGRES_PASSWORD: "ci_smoke_password"  # pragma: allowlist secret
      REDIS_PASSWORD: "ci-smoke-redis-password"  # pragma: allowlist secret
      SECURITY_JWT_SECRET: "ci-smoke-test-jwt-secret-minimum-32-chars!!"  # pragma: allowlist secret
      CONFIG_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"  # pragma: allowlist secret
      CONFIG_SALT: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      CRYPTO_WEBHOOK_SECRET: "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"  # pragma: allowlist secret
      HOPEFX_KILL_SWITCH_TOKEN: "ci-smoke-kill-switch-token-64-chars-placeholder-value-here!!"
      BOOTSTRAP_SUPERADMIN_PASSWORD: "ci-smoke-superadmin-pw"  # pragma: allowlist secret
      BOOTSTRAP_ADMIN_PASSWORD: "ci-smoke-admin-pw"  # pragma: allowlist secret
      BOOTSTRAP_TRADER_PASSWORD: "ci-smoke-trader-pw"  # pragma: allowlist secret
      # Paper trading — no live broker credentials needed
      BROKER_TYPE: "paper"
      PAPER_TRADING: "true"
      APP_ENV: "production"
      # Disable startup gate so health endpoint responds before full init
      STARTUP_GATE: "false"
      # APP_ENV=production defaults REQUIRE_EMAIL_VERIFICATION to true, which is
      # correct for a real deployment and correct behaviour when the smoke test
      # hit it: registration returned 201, then login returned
      #   401 {"detail":"Please verify your email before logging in."}
      #
      # There is no SMTP in CI and no inbox to click a link in, so that login
      # can never succeed and tests 4-8 (login, /me, signals, logout) were all
      # skipped for want of a token. Turning verification off here buys back
      # coverage of the whole authenticated path.
      #
      # Same shape as STARTUP_GATE above: a CI-only override of a gate that
      # needs an out-of-band step the runner cannot perform. Everything the
      # production path *can* exercise here — the CORS gates, the startup
      # validators — stays armed.
      REQUIRE_EMAIL_VERIFICATION: "false"
      # APP_ENV=production above arms three fail-closed CORS gates that each
      # sys.exit(1): "*" with credentials, any http:// origin, and an
      # all-localhost list (the last enforced in both core/middleware.py and
      # api/server.py). The smoke stack keeps APP_ENV=production on purpose, to
      # exercise the production path, so this value has to clear all three:
      # https, and not localhost.
      #
      # A reserved .example domain (RFC 2606) is used rather than a real one —
      # nothing here makes a cross-origin request. The healthcheck curls
      # http://localhost:8000/api/health/live directly with no Origin header, so
      # CORS never applies to it; this only has to satisfy the startup gates.
      ALLOWED_ORIGINS: "https://app.hopefx.example"
      APP_BASE_URL: "http://localhost"
      HOPEFX_DOMAIN: "localhost"
      # The data-layer orchestrator starts nine feeds (FRED, CFTC, IMF, WGC,
      # Yahoo…), each capped at ORCHESTRATOR_FEED_TIMEOUT_S, and the whole
      # start() is wrapped in a 60s ORCHESTRATOR_STARTUP_TIMEOUT_S budget. None
      # of those hosts is reachable from CI, so at the 15s default the feeds
      # alone exhaust the budget, start() is cancelled before it sets _started,
      # and /health/ready reports orchestrator down forever. Each feed injects
      # neutral series on timeout, so a short cap costs nothing here.
      ORCHESTRATOR_FEED_TIMEOUT_S: "5"
      # Disable optional integrations that require external credentials
      BRAIN_SEMANTIC_ENCODER: "false"
      CME_ENABLED: "false"
      CPP_SHIM_ENABLED: "false"
      # Suppress Sentry noise in CI
      SENTRY_DSN: ""
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Override postgres: inject password matching app override above ───────────
  postgres:
    environment:
      POSTGRES_PASSWORD: "ci_smoke_password"  # pragma: allowlist secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hopefx} -d ${POSTGRES_DB:-hopefx}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Disable services that cannot reach healthy in CI ─────────────────────────
  trading:
    profiles: ["disabled"]

  celery-worker:
    profiles: ["disabled"]

  celery-beat:
    profiles: ["disabled"]

  prometheus:
    profiles: ["disabled"]

  alertmanager:
    profiles: ["disabled"]

  grafana:
    profiles: ["disabled"]
    environment:
      # Placeholder satisfies the :?required check in the base file.
      # Grafana is disabled in CI — this value is never used.
      GRAFANA_ADMIN_PASSWORD: "ci-smoke-grafana-placeholder"

  nginx:
    profiles: ["disabled"]
